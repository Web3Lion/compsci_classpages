<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('course-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>secret3 — compsci_classpages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#0d1118;--panel2:#0f1420;--panel3:#111a2c;--border:#1e2c46;--border2:#182238;--border3:#2c3f66;--border-hi:#3a5488;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--accent:#ff4c00;--accent2:#ff7a3d;}
:root[data-theme="light"]{--bg:#f3f4f6;--panel:#ffffff;--panel2:#f7f8fa;--panel3:#eef0f3;--border:#d7dbe2;--border2:#e5e8ed;--border3:#c3c9d4;--border-hi:#a7b0c0;--text:#26313f;--bright:#0e1622;--muted:#48566a;--dim:#5f7186;--faint:#8394a8;--accent:#ff4c00;--accent2:#ff7a3d;}
*{box-sizing:border-box;}
body{margin:0;padding:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--accent);}
.wrap{max-width:520px;width:100%;padding:24px;}
.card{border:1px solid var(--border3);border-radius:16px;background:linear-gradient(160deg,var(--panel3) 0%,var(--panel) 100%);padding:40px 32px;text-align:center;}
.badge{display:inline-block;font-size:11px;letter-spacing:2px;color:var(--accent);border:1px solid var(--border3);background:var(--panel2);border-radius:999px;padding:6px 14px;margin-bottom:18px;}
h1{font-size:20px;margin:0 0 14px;color:var(--bright);font-family:'JetBrains Mono',monospace;}
p{font-size:14px;line-height:1.6;color:var(--muted);margin:0;}
.quote{font-style:italic;font-size:15px;color:var(--bright);margin:18px 0;padding:16px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 10px 10px 0;text-align:left;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="badge">secret3.html</div>
    <h1>Keep looking for the secret page.</h1>
    <p>You will surely find it.</p>
    <div class="quote">“Every wrong guess is data. Use it.”</div>
  </div>
</div>
</body>
</html>
