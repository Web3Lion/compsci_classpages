<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#0d1118;--panel2:#0f1420;--border:#243046;--border3:#324467;--accent:#7dd8ff;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;}
*{box-sizing:border-box;}
body{margin:0;padding:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--muted);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.mono{font-family:'JetBrains Mono',monospace;}
.wrap{max-width:520px;width:100%;padding:24px;}
.card{border:1px solid var(--border3);border-radius:18px;background:linear-gradient(160deg,var(--panel2) 0%,var(--panel) 100%);padding:44px 34px;text-align:center;}
.glitch{font-family:'JetBrains Mono',monospace;font-size:56px;font-weight:800;color:var(--accent);text-shadow:0 0 30px rgba(125,216,255,.5);margin:0 0 6px;letter-spacing:4px;}
h1{font-size:19px;color:var(--bright);margin:0 0 14px;}
p{font-size:13.5px;line-height:1.6;margin:0 0 20px;}
.list{display:flex;flex-direction:column;gap:10px;text-align:left;}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);}
.opt a{color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;}
.opt a:hover{text-decoration:underline;}
.hint{margin-top:20px;font-size:11px;color:#5c7592;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="glitch">404</div>
    <h1>That page doesn't exist.</h1>
    <p>Whatever you typed took a wrong turn. But sometimes wrong turns lead somewhere interesting.</p>
    <div class="list" id="opts"></div>
    <div class="hint" id="found">Checking your signed-in courses…</div>
  </div>
</div>
<script>
var COURSES = [
  { key: "cyber1", name: "Cybersecurity 1" },
  { key: "cyber2", name: "AP Cybersecurity 2" },
  { key: "cyber3", name: "Cybersecurity 3" }
];
var opts = document.getElementById("opts");
var found = document.getElementById("found");
var any = false;
COURSES.forEach(function(c){
  var sess = null;
  try { sess = JSON.parse(localStorage.getItem("ctf-sess-" + c.key)); } catch(e){}
  if (sess) {
    any = true;
    var row = document.createElement("div");
    row.className = "opt";
    row.innerHTML = '<span>' + c.name + '</span><a href="./' + c.key + '/6dd41be832.html">Claim Ultimate Flag 3 →</a>';
    opts.appendChild(row);
  }
});
if (any) {
  found.textContent = "You're signed in somewhere. That's not nothing.";
} else {
  found.innerHTML = 'Not signed in anywhere yet? Start at <a href="./cyber1/ctf.html" style="color:#7dd8ff;">Cyber 1</a>, <a href="./cyber2/ctf.html" style="color:#7dd8ff;">Cyber 2</a>, or <a href="./cyber3/ctf.html" style="color:#7dd8ff;">Cyber 3</a>.';
}
</script>
</body>
</html>
