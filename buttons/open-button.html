<html lang="en" data-no-a11y-btn>
<head>
<script src="../site.js?v=35.0.1"></script>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../assets/logo/icon-site-64.png?v=35.0.1">
<link rel="apple-touch-icon" href="../assets/logo/icon-site-256.png?v=35.0.1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Course</title>
<link href="../assets/fonts/fonts.css?v=35.0.1" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#ffffff;display:flex;align-items:center;justify-content:center;}
@keyframes btnPulse{0%,100%{box-shadow:0 14px 34px -18px var(--ac,#00b3ff),0 0 0 0 color-mix(in srgb,var(--ac,#00b3ff) 55%,transparent);}50%{box-shadow:0 14px 34px -18px var(--ac,#00b3ff),0 0 0 7px color-mix(in srgb,var(--ac,#00b3ff) 0%,transparent);}}
@keyframes arrowNudge{0%,100%{transform:translate(0,0);}50%{transform:translate(3px,-3px);}}
a.btn{
  font-family:'JetBrains Mono',monospace;
  display:inline-flex;align-items:center;gap:10px;
  font-size:16px;font-weight:800;letter-spacing:.5px;
  padding:16px 26px;border-radius:12px;
  animation:btnPulse 2.6s ease-in-out infinite;
  background:linear-gradient(160deg, color-mix(in oklch, var(--ac,#00b3ff) 18%, #121a26) 0%, #0e141d 100%);
  border:1px solid var(--ac,#00b3ff);
  color:#eef4ff;text-decoration:none;
  box-shadow:0 14px 34px -18px var(--ac,#00b3ff);
  transition:transform .15s ease, box-shadow .15s ease;
}
a.btn:hover{transform:translateY(-2px) scale(1.03);animation-play-state:paused;}
a.btn:hover svg{animation:arrowNudge .7s ease-in-out infinite;}
a.btn svg{flex:none;}
</style>
</head>
<body>
<a class="btn" id="goBtn" target="_blank" rel="noopener">
  <span id="label">Open Course</span>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4l-9 9M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h14a1 1 0 001-1v-4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>
<script>
// Configure via query string: ?to=cyber1/index.html&label=Cyber%20Security%201&color=%2300b3ff
var params = new URLSearchParams(location.search.replace(/\+/g,'%20'));
var to = params.get('to') || 'index.html';
var label = (params.get('label') || 'Open Course').replace(/\+/g,' ');
var color = params.get('color') || '#00b3ff';
if(color.charAt(0)!=='#') color = '#'+color;
document.getElementById('goBtn').href = to;
document.getElementById('label').textContent = label;
document.documentElement.style.setProperty('--ac', color);
</script>
</body>
</html>
