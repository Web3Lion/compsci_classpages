<html lang="en" data-no-a11y-btn>
<head>
<script src="../site.js?v=14.0.1"></script>
<meta charset="UTF-8">

<link rel="apple-touch-icon" href="../assets/logo/icon-site-256.png?v=33.2.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity 3 — Student Documents</title>
<link href="../assets/fonts/fonts.css?v=33.2.0" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#1c160a;font-family:'JetBrains Mono',monospace;}
body{
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:
    linear-gradient(rgba(212,175,55,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,175,55,.09) 1px, transparent 1px);
  background-size:42px 42px;
}
.wrap{max-width:640px;padding:40px 24px;text-align:center;position:relative;z-index:1;}
.bar{width:min(90vw,740px);height:3px;border-radius:2px;margin:0 auto 34px;
  background:linear-gradient(90deg, #ffe9a8, #d4af37);
  box-shadow:0 0 18px 2px color-mix(in srgb, #d4af37 55%, transparent);}
.dot{width:26px;height:12px;border-radius:8px;margin:0 auto 30px;
  background:color-mix(in srgb, #d4af37 30%, #1c160a);
  border:1px solid #d4af37;display:flex;align-items:center;justify-content:center;}
.dot i{width:7px;height:7px;border-radius:50%;background:#d4af37;box-shadow:0 0 8px 2px #d4af37;}
h1{color:#eef4ff;font-size:clamp(24px,4.4vw,34px);font-weight:800;letter-spacing:1px;margin:0 0 18px;text-transform:uppercase;}
p{color:#8ea0b8;font-size:14px;line-height:1.65;margin:0 0 34px;letter-spacing:.2px;}
@keyframes btnPulse{0%,100%{box-shadow:0 14px 34px -18px #d4af37,0 0 0 0 color-mix(in srgb,#d4af37 55%,transparent);}50%{box-shadow:0 14px 34px -18px #d4af37,0 0 0 7px color-mix(in srgb,#d4af37 0%,transparent);}}
@keyframes arrowNudge{0%,100%{transform:translate(0,0);}50%{transform:translate(3px,-3px);}}
a.btn{
  display:inline-flex;align-items:center;gap:12px;
  font-family:'JetBrains Mono',monospace;
  font-size:15px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:18px 30px;border-radius:12px;
  animation:btnPulse 2.6s ease-in-out infinite;
  background:linear-gradient(160deg, color-mix(in oklch, #d4af37 20%, #2c2411) 0%, #1c160a 100%);
  border:1px solid #d4af37;
  color:#eef4ff;text-decoration:none;
  box-shadow:0 14px 34px -18px #d4af37;
  transition:transform .15s ease, box-shadow .15s ease;
}
a.btn:hover{transform:translateY(-2px) scale(1.03);animation-play-state:paused;}
a.btn:hover svg.ext{animation:arrowNudge .7s ease-in-out infinite;}
a.btn svg{flex:none;}
.node{margin-top:30px;color:#d4af37;font-size:12px;letter-spacing:2px;opacity:.85;text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"></div>
  <div class="dot"><i></i></div>
  <h1>Enter the Cyber Grid</h1>
  <p>Open your Cybersecurity 3 learning resource and explore the systems that protect our digital world.</p>
  <a class="btn" href="https://drive.google.com/drive/folders/16d6iuaomSSpgymajTzoO0UFelfqSiIVm?usp=sharing" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4.6v9.2L12 22 4 15.8V6.6L12 2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Open Student Documents
    <svg class="ext" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4l-9 9M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h14a1 1 0 001-1v-4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div class="node">CYBERSECURITY 03 // ACCESS NODE 03</div>
</div>
</body>
</html>
