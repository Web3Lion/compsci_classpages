<style>
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#0c0a14;display:flex;align-items:center;justify-content:center;}
#label{border-right:2px solid #a855f7;padding-right:3px;white-space:nowrap;overflow:hidden;animation:caretBlink .8s step-end infinite;}
@keyframes btnPulse{0%,100%{box-shadow:0 14px 34px -18px var(--ac,#00b3ff),0 0 0 0 color-mix(in srgb,var(--ac,#00b3ff) 55%,transparent);}50%{box-shadow:0 14px 34px -18px var(--ac,#00b3ff),0 0 0 7px color-mix(in srgb,var(--ac,#00b3ff) 0%,transparent);}}
@keyframes arrowNudge{0%,100%{transform:translate(0,0);}50%{transform:translate(3px,-3px);}}
@keyframes caretBlink{0%,49%{border-color:#a855f7;}50%,100%{border-color:transparent;}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes cpuGlow{0%,100%{opacity:.35;}50%{opacity:.8;}}
@keyframes dash{to{stroke-dashoffset:-278;}}
a.btn{
  font-family:'JetBrains Mono',monospace;
  display:inline-flex;align-items:center;gap:10px;
  font-size:16px;font-weight:800;letter-spacing:.5px;
  padding:16px 26px;border-radius:12px;
  animation:btnPulse 2.6s ease-in-out infinite;
  background:linear-gradient(160deg, color-mix(in oklch, #a855f7 16%, #1a1524) 0%, #0c0a14 100%);
  border:1px solid #a855f7;
  color:#eef4ff;text-decoration:none;
  box-shadow:0 14px 34px -18px #a855f7;
  transition:transform .15s ease, box-shadow .15s ease;
}
a.btn:hover{transform:translateY(-2px) scale(1.03);animation-play-state:paused;}
a.btn:hover svg{animation:arrowNudge .7s ease-in-out infinite;}
a.btn svg{flex:none;}
</style>
</head>
<body>

<a class="btn" id="goBtn" href="apcsp/index.html" target="_blank" rel="noopener" style="position:relative;z-index:1;">
  <span id="label">AP Computer Science Principles</span>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4l-9 9M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h14a1 1 0 001-1v-4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>
<script>
document.documentElement.style.setProperty('--ac', '#a855f7');
(function(){
  var el = document.getElementById('label');
  var btn = document.getElementById('goBtn');
  var full = el.textContent;
  function typeIn(cb){
    el.textContent = '';
    var i = 0;
    (function type(){
      if (i <= full.length) { el.textContent = full.slice(0, i); i++; setTimeout(type, 65); }
      else if (cb) cb();
    })();
  }
  function cycle(){
    typeIn(function(){
      setTimeout(function(){
        btn.style.transition = 'box-shadow .3s ease, transform .3s ease';
        btn.style.boxShadow = '0 0 0 3px #a855f7, 0 0 40px 8px #a855f7';
        btn.style.transform = 'scale(1.04)';
        setTimeout(function(){
          btn.style.transition = 'transform .3s ease';
          btn.style.transform = 'scale(1)';
          el.style.transition = 'opacity .35s ease';
          el.style.opacity = '0';
          setTimeout(function(){
            btn.style.boxShadow = '';
            el.style.opacity = '1';
            cycle();
          }, 450);
        }, 450);
      }, 5000);
    });
  }
  cycle();
})();
</script>
