<style>
:root{--bg:#006b35;--panel:#005a2c;--panel2:#004d26;--border:#2f8f5c;--border3:#7cc49c;--text:#eafff1;--bright:#ffffff;--muted:#d4f2df;--dim:#b4e2c4;--gold:#ffffff;--gold2:#e6fff0;--btn:#ffffff;--btnText:#005a2c;--ok:#c8ffd9;--warn:#ffe08a;--bad:#ffc2b8;

    <div style="display:flex;align-items:center;gap:12px;"><img src="../assets/logo/sf-lion-green.png?v=35.0.0" alt="" style="height:40px;background:#fff;border-radius:10px;padding:4px 8px;"><div class="mono" style="font-size:12px;letter-spacing:3px;color:var(--gold);">SOUTH FAYETTE LIONS</div></div>

    <p style="margin:6px 0 0;color:var(--muted);max-width:680px;">Live vocab and review battles. Students join with a code, get a random lion name, and nothing is saved anywhere except the host&rsquo;s own browser.</p>

<script>
if (typeof window.__toggleTheme !== "function") window.__toggleTheme = function(){
  var r = document.documentElement, t = r.getAttribute("data-theme") === "light" ? "dark" : "light";
  r.setAttribute("data-theme", t); try { localStorage.setItem("course-theme", t); } catch (e) {}
  document.getElementById("themeToggle").textContent = t === "light" ? "DARK" : "LIGHT";
};
document.getElementById("themeToggle").textContent = document.documentElement.getAttribute("data-theme") === "light" ? "DARK" : "LIGHT";

(function(){
  var PREFIX = "sf-mane-event-", KEY = "mane-event-host", view = document.getElementById("view"), hdr = document.getElementById("hdr");
  var SHORT = /web3lion\.github\.io$/.test(location.host) ? "web3lion.github.io/compsci_classpages/mane" : location.host + location.pathname.replace(/mane-event\/(index\.html)?$/, "mane");
  var LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  var ADJ = ["Roaring","Golden","Mighty","Brave","Swift","Royal","Fierce","Clever","Bold","Noble","Savanna","Sunlit","Maned","Prowling","Pouncing","Proud"];
  var NOUN = ["Neuron","Byte","Photon","Proton","Atom","Comet","Pixel","Quark","Vector","Circuit","Galaxy","Fossil","Magnet","Prism","Nebula","Cipher","Helix","Orbit","Ion","Electron","Molecule","Crystal","Laser","Rocket","Quasar","Gene","Isotope","Kernel","Packet","Router"];
  var TEAMS = ["Gold Pride","Crimson Pride","Azure Pride","Lime Pride","Violet Pride","Silver Pride"];
  var TYPES = [["shift","Shift"],["scramble","Scramble"],["reveal","Reveal"],["bank","Word bank"]];
  var HP = 12, HIT = 3, MISS = 1;   // 4 correct answers = knockout; a wrong answer costs a third of a hit
  var MINS = [5,10,15,20,30], QT = [[0,"No limit"],[20,"20 s"],[30,"30 s"],[45,"45 s"],[60,"60 s"]];
  var FORMATS = [["sd","Sudden death (5 questions)"],["bo3","Best of 3"],["bo5","Best of 5"]];

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }
  function norm(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function disp(a){ var d = String(a || "").replace(/\([^)]*\)/g, "").split("/")[0].trim(); return d || String(a || "").trim(); }
  function alts(a){ var o = [norm(a), norm(disp(a))]; String(a || "").split("/").forEach(function(x){ o.push(norm(x.replace(/\([^)]*\)/g, ""))); }); return o.filter(Boolean); }
  function rnd(n){ return Math.random() * n | 0; }
  function shuffle(a){ for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function now(){ return Date.now(); }
  function tc(i){ return "var(--t" + (i || 0) + ")"; }
  function device(){ var u = navigator.userAgent; return /CrOS/.test(u) ? "Chromebook" : /iPad|Tablet/.test(u) ? "Tablet" : /Android|iPhone|Mobile/.test(u) ? "Phone" : "Laptop / desktop"; }
  function hpBar(hp){ var h = ""; for (var j = 0; j < 4; j++) { var w = Math.max(0, Math.min(3, hp - 3 * j)) / 3 * 100; h += '<i><b style="width:' + w + '%;"></b></i>'; } return '<div class="hp" aria-label="' + Math.ceil(hp / 3) + ' of 4 hits left">' + h + '</div>'; }
  function clock(ms){ var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); }

  /* ---------- CSV ---------- */
  function parseRows(text){
    var t = String(text || ""), tab = t.indexOf("\t") >= 0, rows = [], row = [], f = "", q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"' && f === "") q = true;
      else if (c === (tab ? "\t" : ",")) { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    rows = rows.map(function(r){ return r.map(function(x){ return x.trim(); }); }).filter(function(r){ return r.filter(Boolean).length >= 2; });
    var swap = false;
    if (rows.length) {
      var h0 = norm(rows[0][0]), hl = norm(rows[0][rows[0].length - 1]), P = /definition|question|prompt|clue/, A = /term|answer|word/;
      if (P.test(h0) && A.test(hl) && h0.length < 20) rows.shift();
      else if (A.test(h0) && P.test(hl) && h0.length < 20) { rows.shift(); swap = true; }
    }
    var out = [], seen = {};
    rows.forEach(function(r){
      r = r.filter(function(x, i){ return x || i === 0; });
      var qq, aa;
      if (swap) { aa = r[0]; qq = r.slice(1).join(", "); } else { aa = r[r.length - 1]; qq = r.slice(0, -1).join(", "); }
      qq = qq.slice(0, 300); aa = aa.slice(0, 80);
      var k = norm(qq) + "|" + norm(aa);
      if (!norm(qq) || !norm(aa) || seen[k] || out.length >= 500) return;
      seen[k] = 1; out.push({ q: qq, a: aa });
    });
    return out;
  }
  var TEMPLATE = "Definition,Term\n\"A weakness that can be exploited by a threat\",Vulnerability\n\"Keeping information private from people who should not see it\",Confidentiality\n\"What is 2 to the 4th power?\",16\n\"How many bits are in a byte?\",8\n";

  /* ---------- start ---------- */
  var q0 = new URLSearchParams(location.search), qcode = (q0.get("code") || "").toUpperCase().replace(/[^A-Z]/g, "");
  if (qcode.length === 6) join(qcode); else home();

  function saved(){ try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.v === 1 && now() - s.saved < 4 * 3600e3) return s; } catch (e) {} return null; }

  function home(msg){
    hdr.style.display = "";
    var sv = saved();
    view.innerHTML =
      (sv ? '<div class="card" style="border:2px solid var(--gold);margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;"><div style="flex:1;min-width:220px;"><b style="color:var(--bright);">Game ' + esc(sv.code) + ' is saved in this browser.</b><div style="color:var(--muted);">' + Object.keys(sv.players).length + ' player' + (Object.keys(sv.players).length === 1 ? '' : 's') + ' \u00b7 resume it and students reconnect on their own.</div></div><button class="btn" id="resume">Resume ' + esc(sv.code) + '</button><button class="btn ghost sm" id="discard">Discard</button></div>' : '') +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;">' +
        '<div class="card"><div class="lbl" style="color:var(--gold);">Teacher</div><h2 style="margin:6px 0 8px;color:var(--bright);font-size:22px;">Host a game</h2><p style="margin:0 0 16px;color:var(--muted);">Upload your questions, pick a class battle or a bracket, and put the join code on the projector.</p><div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn" id="host">Host a game</button><a class="btn ghost sm" href="connection-test.html">Connection test</a></div></div>' +
        '<div class="card"><div class="lbl" style="color:var(--gold);">Student</div><h2 style="margin:6px 0 8px;color:var(--bright);font-size:22px;">Join with a code</h2>' +
          '<div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start;"><input class="code" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" aria-label="6-letter code" placeholder="ABCDEF"><button class="btn" id="go">Join</button></div>' +
          (msg ? '<p role="alert" style="margin:12px 0 0;color:var(--bad);font-weight:700;">' + esc(msg) + '</p>' : '') + '</div>' +
      '</div>';
    document.getElementById("host").onclick = function(){ if (sv && !confirm("Start a new game? The saved game " + sv.code + " will be discarded.")) return; try { localStorage.removeItem(KEY); } catch (e) {} host(null); };
    if (sv) { document.getElementById("resume").onclick = function(){ host(sv); }; document.getElementById("discard").onclick = function(){ try { localStorage.removeItem(KEY); } catch (e) {} home(); }; }
    var inp = document.getElementById("code");
    inp.oninput = function(){ inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 6); };
    document.getElementById("go").onclick = function(){ if (inp.value.length === 6) join(inp.value); else inp.focus(); };
    inp.onkeydown = function(e){ if (e.key === "Enter") document.getElementById("go").click(); };
  }

  /* =====================================================================
     HOST — this browser is the game server. State is backed up to
     localStorage so a refresh resumes with the same code.
     ===================================================================== */
  function host(resume){
    var S = resume || { v: 1, code: "", phase: "setup", saved: now(), fseq: 0,
      setup: { csv: "", types: { shift: 1, scramble: 1, reveal: 1, bank: 1 }, mode: "battle", teams: 2, assign: "random", minutes: 10, qtime: 30, format: "bo3" },
      rows: [], players: {}, fights: {}, teamKO: [], feed: [], goAt: 0, endAt: 0, br: null };
    var HQ = [], lastCd = 0, CONN = {}, LAST = {}, LASTT = {}, peer = null, opened = false, tries = 0, dirty = true, lastDraw = 0, lastSave = 0, wake = null;
    if (!S.code) S.code = newCode();
    Object.keys(S.players).forEach(function(id){ S.players[id].up = false; S.players[id].downAt = now(); });
    Object.keys(S.fights).forEach(function(id){ var f = S.fights[id]; f.pause = 0; if (!f.between) newPrompt(f); });
    hdr.style.display = "none";
    view.innerHTML = '<div class="card mono" style="color:var(--dim);">Opening the den\u2026</div>';
    function newCode(){ var c = ""; for (var i = 0; i < 6; i++) c += LETTERS[rnd(LETTERS.length)]; return c; }

    function connect(){
      peer = new Peer(PREFIX + S.code, { debug: 0 });
      peer.on("open", function(){ if (!opened) { opened = true; dirty = true; } live(true); });
      peer.on("disconnected", function(){ live(false); setTimeout(function(){ if (!peer.destroyed && peer.disconnected) peer.reconnect(); }, 1000); });
      peer.on("error", function(e){
        if (e.type === "unavailable-id") {
          if (opened) return;
          peer.destroy();
          if (resume && ++tries < 15) { view.innerHTML = '<div class="card mono" style="color:var(--dim);">Reclaiming code ' + esc(S.code) + '\u2026 (' + tries + ')</div>'; setTimeout(connect, 2000); return; }
          S.code = newCode(); connect(); return;
        }
        if (opened) { live(false); return; }
        view.innerHTML = '<div class="card"><b style="color:var(--bad);">Couldn\u2019t reach the connection server.</b><p style="color:var(--muted);">' + esc(e.type || e.message) + '. The school network may block it. Try the connection test page.</p><button class="btn ghost" onclick="location.reload()">Try again</button></div>';
      });
      peer.on("connection", function(conn){
        conn.on("data", function(d){ try { onData(conn, d); } catch (err) { console.error(err); } });
        conn.on("close", function(){ var id = conn._pid; if (id && CONN[id] === conn) { delete CONN[id]; var p = S.players[id]; if (p) { p.up = false; p.downAt = now(); } dirty = true; } });
      });
    }
    connect();
    setInterval(function(){ if (peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 5000);
    function live(ok){ var el = document.getElementById("live"); if (el) { el.textContent = ok ? "\u25CF LIVE \u00B7 students can join" : "\u25CF RECONNECTING\u2026 keep this tab open"; el.style.color = ok ? "var(--ok)" : "var(--warn)"; } }
    window.addEventListener("beforeunload", function(e){ if (S.phase !== "setup" && S.phase !== "done") { save(true); e.preventDefault(); e.returnValue = ""; } });

    function save(force){ if (!force && now() - lastSave < 1000) return; lastSave = now(); S.saved = now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
    function send(id, o){ var c = CONN[id]; if (c && c.open) try { c.send(o); } catch (e) {} }
    function list(){ return Object.keys(S.players).map(function(k){ return S.players[k]; }); }
    function upList(){ return list().filter(function(p){ return p.up; }); }
    function pickName(){ var used = {}; list().forEach(function(p){ used[p.name] = 1; }); for (var i = 0; i < 300; i++) { var n = ADJ[rnd(ADJ.length)] + " " + NOUN[rnd(NOUN.length)]; if (!used[n]) return n; } return "Lion " + (list().length + 1); }
    function teamSizes(){ var z = []; for (var i = 0; i < S.setup.teams; i++) z.push(0); list().forEach(function(p){ if (p.team != null && p.team < S.setup.teams) z[p.team]++; }); return z; }
    function smallest(){ var z = teamSizes(), b = 0; z.forEach(function(n, i){ if (n < z[b]) b = i; }); return b; }
    function feed(txt, team){ S.feed.unshift({ txt: txt, team: team }); S.feed = S.feed.slice(0, 8); }
    function need(){ return S.setup.format === "bo5" ? 3 : S.setup.format === "bo3" ? 2 : 1; }

    function onData(conn, d){
      if (!d || typeof d !== "object") return;
      if (d.k === "join") {
        var tok = String(d.tok || ""); if (!/^[a-z0-9]{8,32}$/i.test(tok)) return;
        var p = S.players[tok];
        if (!p) {
          if (list().length >= 80) { try { conn.send({ k: "full" }); } catch (e) {} return; }
          p = S.players[tok] = { id: tok, name: pickName(), team: null, ko: 0, out: false, rest: 0, fid: null, last: null, msg: "", dev: "" };
          if (S.setup.mode === "battle") p.team = smallest();
          else if (S.phase === "countdown" || S.phase === "live") { p.out = true; p.late = true; }
        }
        p.up = true; p.dev = String(d.dev || "").slice(0, 30); conn._pid = tok; CONN[tok] = conn; LAST[tok] = "";
        try { conn.send({ k: "hi" }); } catch (e) {}
        dirty = true; return;
      }
      if (d.k === "ans" && conn._pid) answer(conn._pid, d);
    }

    /* ----- fights ----- */
    function fightOf(id){ var p = S.players[id]; return p && p.fid ? S.fights[p.fid] : null; }
    function allowed(d){
      var L = norm(d).length, ok = [];
      TYPES.forEach(function(t){
        if (!S.setup.types[t[0]]) return;
        if (t[0] === "bank") { if (S.distinct >= 4) ok.push("bank"); return; }
        if (L < 3 || L > 24) return;
        if (t[0] === "shift" && !/[a-z]/i.test(d)) return;
        ok.push(t[0]);
      });
      return ok;
    }
    function newPrompt(f){
      var R = S.rows, i = 0;
      for (var k = 0; k < 30; k++) { i = rnd(R.length); if (f.used.indexOf(i) < 0) break; }
      f.used.push(i); if (f.used.length > Math.min(R.length - 1, 40)) f.used.shift();
      var d = disp(R[i].a), ok = allowed(d);
      f.row = i; f.n++; f.mode = ok.length ? ok[rnd(ok.length)] : "type"; f.pz = ""; f.opts = null; f.rev = []; f.shift = 0; f.len = norm(d).length;
      if (f.mode === "shift") { f.shift = 1 + rnd(5); f.pz = d.toUpperCase().replace(/[A-Z]/g, function(c){ return String.fromCharCode((c.charCodeAt(0) - 65 + f.shift) % 26 + 65); }); }
      if (f.mode === "scramble") { var L = d.toUpperCase().replace(/[^A-Z0-9]/g, "").split(""), orig = L.join(""); for (var j = 0; j < 6; j++) { shuffle(L); if (L.join("") !== orig) break; } f.pz = L.join(""); }
      if (f.mode === "bank") {
        var seen = {}, o = [d]; seen[norm(d)] = 1;
        shuffle(R.map(function(r){ return disp(r.a); })).forEach(function(x){ if (o.length < 4 && !seen[norm(x)]) { seen[norm(x)] = 1; o.push(x); } });

        if (V.kev && lastKev !== null && V.kev.n !== lastKev) {
          var kv = V.kev, kel = document.getElementById(kv.won ? "sOppC" : "sMeC");
          KO_FX.blast({ el: kel, name: kv.won ? kv.opp : V.name, big: kv.sd ? (kv.won ? "WIN!" : "LOST") : "K.O.!", color: kv.won ? "#00934a" : "#d93a2b",
            sub: kv.sd ? (kv.won ? "You beat " + kv.opp : kv.opp + " wins") : kv.won ? "You knocked out " + kv.opp : kv.opp + " got the KO", say: kv.sd ? (kv.won ? "You win!" : "Match over") : "K. O.!" });
        }
        if (V.f && V.f.last && V.f.n !== lastSettled) { lastSettled = V.f.n; if (V.f.last.by === "me") KO_FX.sfx("hit"); }
      }
      lastKev = V.kev ? V.kev.n : (lastKev === null ? 0 : lastKev);
      var prevA = document.getElementById("sAns"), keep = prevA && V.f && +prevA.getAttribute("data-n") === V.f.n && !V.f.last && !V.f.between ? prevA.value : null, hadFocus = prevA && document.activeElement === prevA;
      if (V.f && V.f.n !== curN) { curN = V.f.n; used = []; keep = null; }
      var h = "";
      if (V.s === "lobby") h = big("You\u2019re in!", "Your name is <b style=\"color:var(--bright);\">" + esc(V.name) + "</b>" + (V.tn ? " on <b style=\"color:" + tc(V.team) + ";\">" + esc(V.tn) + "</b>" : "") + ". Wait for your teacher to start.", V.tn ? tc(V.team) : null);
      else if (V.s === "cd") h = '<div class="card" style="text-align:center;padding:40px 22px;"><div class="lbl">Get ready</div><div class="disp" id="sLeft" style="font-size:clamp(100px,30vw,200px);font-weight:800;color:var(--gold);line-height:1;">5</div></div>';
      else if (V.s === "wait") h = big(esc(V.msg), V.mode === "battle" ? "Stay on this page. You\u2019ll be matched with someone from another team." : "Stay on this page.");
      else if (V.s === "rest") h = big(esc(V.msg), "");
      else if (V.s === "pool") h = big("Rematch pool", (V.late ? "The bracket started before you joined, " : "You\u2019re out of the bracket, ") + "but you can keep playing for fun. Waiting for another player\u2026");
      else if (V.s === "done") {
        if (V.mode === "battle") h = big(esc(V.win) + " wins!", "Your team finished <b style=\"color:var(--bright);\">#" + V.place + "</b>. You scored <b style=\"color:var(--bright);\">" + V.ko + "</b> KO" + (V.ko === 1 ? "" : "s") + ". Nice work, " + esc(V.name) + ".");
        else h = big(V.champ ? esc(V.champ) + " is the champion!" : "The bracket is over.", V.place ? "You: <b style=\"color:var(--bright);\">" + esc(V.place) + "</b>" : "");
      }
      else if (V.s === "fight") h = fightView(V.f);
      view.innerHTML = me() + h;
      var a = document.getElementById("sAns");
      if (a) { if (keep != null) a.value = keep; if (hadFocus || keep == null) a.focus(); used.forEach(function(i){ var b = view.querySelector('.tile[data-i="' + i + '"]'); if (b) b.disabled = true; }); }
      wire();
    }
    function fightView(F){
      var bat = V.mode === "battle" && F.kind === "battle";
      var head = '<div class="card" style="padding:16px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;">' +
        '<div id="sMeC" style="min-width:0;padding:6px;border-radius:10px;"><div style="font-weight:800;color:var(--bright);">You</div>' + (F.sd ? '<div class="mono" style="font-size:24px;font-weight:800;color:var(--gold);">' + F.sd.me + '</div>' : hpBar(F.hp[0])) + '</div>' +
        '<div class="mono" style="font-size:12px;color:var(--dim);text-align:center;">' + (F.sd ? 'Q ' + Math.min(F.sd.q + 1, 99) + (F.sd.q >= 5 ? '<br>OVERTIME' : ' of 5') : 'VS') + '</div>' +
        '<div id="sOppC" style="min-width:0;text-align:right;padding:6px;border-radius:10px;"><div style="font-weight:800;color:' + (bat ? tc(F.ot) : "var(--bright)") + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(F.opp) + '</div>' + (F.sd ? '<div class="mono" style="font-size:24px;font-weight:800;color:var(--gold);">' + F.sd.op + '</div>' : hpBar(F.hp[1])) + '</div></div>' +
        (F.round ? '<div class="mono" style="font-size:13px;color:var(--dim);margin:-4px 0 12px;">' + esc(F.round) + (F.need > 1 ? ' \u00b7 games ' + F.wins[0] + '\u2013' + F.wins[1] + ' \u00b7 first to ' + F.need : '') + '</div>' : F.kind === "pool" ? '<div class="mono" style="font-size:13px;color:var(--dim);margin:-4px 0 12px;">Rematch pool \u00b7 just for fun</div>' : '');
      if (F.between) return head + big(esc(F.between), 'Next game in <span id="sLeft">3 s</span>');
      if (F.last) {
        var who = F.last.by === "me" ? ["You got it!", "var(--ok)"] : F.last.by === "opp" ? [esc(F.opp) + " got it", "var(--bad)"] : ["Nobody got it", "var(--warn)"];
        return head + '<div class="card" style="text-align:center;padding:26px 20px;"><div class="disp" style="font-size:clamp(26px,5vw,38px);font-weight:800;color:' + who[1] + ';">' + who[0] + '</div><div style="color:var(--muted);margin-top:10px;">' + esc(F.q) + '</div><div class="lbl" style="margin-top:14px;">Answer</div><div class="disp" style="font-size:clamp(26px,5vw,40px);font-weight:800;color:var(--bright);">' + esc(F.last.a) + '</div></div>';
      }
      var pz = "", note = "";
      if (F.m === "shift") { pz = '<div class="mono" style="font-size:clamp(26px,6vw,42px);font-weight:800;letter-spacing:4px;color:var(--gold);word-break:break-word;">' + esc(F.pz) + '</div>'; note = "SHIFT \u00b7 move each letter back <b style=\"color:var(--bright);\">" + F.k + "</b> (" + String.fromCharCode(65 + F.k) + "\u2192A)"; }
      else if (F.m === "scramble") { pz = '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + F.pz.split("").map(function(ch, i){ return '<button type="button" class="tile" data-i="' + i + '" aria-label="Letter ' + esc(ch) + '">' + esc(ch) + '</button>'; }).join("") + '</div>'; note = "SCRAMBLE \u00b7 tap the letters in order, or type the answer"; }
      else if (F.m === "reveal") { pz = '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + F.pz.split("").map(function(ch){ return ch === " " ? '<span class="mask sp"></span>' : '<span class="mask">' + (ch === "_" ? "" : esc(ch)) + '</span>'; }).join("") + '</div>'; note = "REVEAL \u00b7 letters fill in over time \u00b7 type the answer"; }
      else if (F.m === "bank") { pz = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;">' + F.opts.map(function(o){ return '<button type="button" class="bankb"' + (F.lock ? ' disabled' : '') + '>' + esc(o) + '</button>'; }).join("") + '</div>'; note = F.lock ? "Wrong pick. Wait for the next question." : "WORD BANK \u00b7 pick the answer \u00b7 a wrong pick costs a third of a hit"; }
      else note = "Type the answer";
      var form = F.m === "bank" ? "" : '<form id="sForm" style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;"><input class="ans" id="sAns" data-n="' + F.n + '" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" style="flex:1;min-width:200px;"' + (F.lock ? ' disabled placeholder="Locked for this question"' : ' placeholder="Answer"') + '><button class="btn" type="submit"' + (F.lock ? ' disabled' : '') + '>Strike</button>' + (F.m === "scramble" ? '<button class="btn ghost sm" type="button" id="sClr">Clear</button>' : '') + '</form>';
      return head + '<div class="card" style="display:flex;flex-direction:column;gap:14px;">' +
        (T.left != null ? '<div style="display:flex;align-items:center;gap:10px;"><div style="flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden;"><div id="sBar" style="height:100%;background:var(--gold);width:100%;"></div></div><span class="mono" id="sLeft" style="font-size:13px;color:var(--dim);min-width:40px;text-align:right;"></span></div>' : '') +
        '<div style="font-size:clamp(19px,3.4vw,26px);font-weight:700;color:var(--bright);line-height:1.35;text-wrap:pretty;">' + esc(F.q) + '</div>' +
        pz + '<div class="mono" style="font-size:13px;color:var(--muted);">' + note + '</div>' + form + '</div>';
    }
    function wire(){
      var f = document.getElementById("sForm"), a = document.getElementById("sAns"), sn = document.getElementById("sSnd");
      if (sn) sn.onclick = function(){ KO_FX.setSound(!KO_FX.soundOn()); render(); };
      if (f) f.onsubmit = function(e){ e.preventDefault(); if (a && a.value.trim()) submit(a.value); };
      view.querySelectorAll(".bankb").forEach(function(b){ b.onclick = function(){ submit(b.textContent); }; });
      view.querySelectorAll(".tile").forEach(function(b){ b.onclick = function(){ if (!a) return; a.value += b.textContent; b.disabled = true; used.push(b.getAttribute("data-i")); if (V.f && norm(a.value).length >= V.f.len) submit(a.value); }; });
      var cl = document.getElementById("sClr"); if (cl) cl.onclick = function(){ if (a) { a.value = ""; a.focus(); } used = []; view.querySelectorAll(".tile").forEach(function(b){ b.disabled = false; }); };
    }
  }
})();
</script>
<style>@media (max-width:820px){.bgrid{grid-template-columns:minmax(0,1fr)!important;}}</style>
</body>
</html>
