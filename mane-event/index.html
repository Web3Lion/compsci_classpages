<script>
if (typeof window.__toggleTheme !== "function") window.__toggleTheme = function(){
  var r = document.documentElement, t = r.getAttribute("data-theme") === "light" ? "dark" : "light";

document.getElementById("themeToggle").textContent = document.documentElement.getAttribute("data-theme") === "light" ? "DARK" : "LIGHT";

(function(){
  var PREFIX = "sf-mane-event-", KEY = "mane-event-host", view = document.getElementById("view"), hdr = document.getElementById("hdr");
  var SHORT = /web3lion\.github\.io$/.test(location.host) ? "web3lion.github.io/compsci_classpages/mane" : location.host + location.pathname.replace(/mane-event\/(index\.html)?$/, "mane");
  /* Cloudflare relay (TURN) for devices the school network won't let connect directly.
     Paste either the Metered credentials URL (https://<app>.metered.live/api/v1/turn/credentials?apiKey=...)
     or a Cloudflare Worker URL (claude only/cloudflare-relay-worker.js). Blank = direct only. */
  var RELAY_URL = "";
  var ICE = null, ICE_AT = 0, RELAY_ON = false;
  function iceConfig(){
    if (!RELAY_URL) return Promise.resolve(null);

    var done = false;
    return Promise.race([
      fetch(RELAY_URL, { cache: "no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ done = true; var list = Array.isArray(j) ? j : j && j.iceServers; if (list && list.length) { ICE = list; ICE_AT = Date.now(); RELAY_ON = true; return ICE; } return null; }).catch(function(){ return null; }),
      new Promise(function(res){ setTimeout(function(){ if (!done) res(ICE); }, 5000); })
    ]);
  }
  function peerOpts(ice){ return { debug: 0, config: { iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }, { urls: "stun:stun.l.google.com:19302" }].concat(ice || []) } }; }
  var LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  var ADJ = ["Roaring","Golden","Mighty","Brave","Swift","Royal","Fierce","Clever","Bold","Noble","Savanna","Sunlit","Maned","Prowling","Pouncing","Proud"];
  var NOUN = ["Neuron","Byte","Photon","Proton","Atom","Comet","Pixel","Quark","Vector","Circuit","Galaxy","Fossil","Magnet","Prism","Nebula","Cipher","Helix","Orbit","Ion","Electron","Molecule","Crystal","Laser","Rocket","Quasar","Gene","Isotope","Kernel","Packet","Router"];
  var THEMES = {
    lion:     { name: "Lion Pride", teams: ["Gold Pride","Crimson Pride","Azure Pride","Lime Pride","Violet Pride","Silver Pride"] },
    arcade:   { name: "Arcade",     teams: ["Neon Pink","Electric Blue","Laser Lime","Solar Orange","Ultra Violet","Cyber Cyan"] },
    elements: { name: "Elements",   teams: ["Fire","Water","Earth","Lightning","Ice","Plasma"] }
  };
  var MT = "lion";
  function teamNames(){ return (THEMES[MT] || THEMES.lion).teams; }
  function applyTheme(t){ MT = THEMES[t] ? t : "lion"; document.documentElement.setAttribute("data-mt", MT); }
  var TYPES = [["shift","Shift"],["scramble","Scramble"],["reveal","Reveal"],["bank","Word bank"]];
  var HP = 12, HIT = 3, MISS = 1;   // 4 correct answers = knockout; a wrong answer costs a third of a hit
  var MINS = [5,10,15,20,30], QT = [[0,"No limit"],[20,"20 s"],[30,"30 s"],[45,"45 s"],[60,"60 s"]];
  var FORMATS = [["sd","Sudden death (5 questions)"],["bo3","Best of 3"],["bo5","Best of 5"]];

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }
  function norm(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function disp(a){ var d = String(a || "").replace(/\([^)]*\)/g, "").split("/")[0].trim(); return d || String(a || "").trim(); }
  function alts(a){ var o = [norm(a), norm(disp(a))]; String(a || "").split("/").forEach(function(x){ o.push(norm(x.replace(/\([^)]*\)/g, ""))); }); return o.filter(Boolean); }
  function ansText(r){ return r.k === "v" ? disp(r.a) : String(r.a || "").trim(); }
  function isRight(r, txt){ var n = norm(txt); if (!n) return false; return r.k === "mc" ? n === norm(r.a) : alts(r.a).indexOf(n) >= 0; }
  function rnd(n){ return Math.random() * n | 0; }
  /* Jeopardy sheet: row 1 = categories, then a question row + answer row per value; a label column A is skipped */
  function parseBoard(text){
    var rows = parseCells(text).filter(function(r){ return r.some(function(x){ return x; }); });
    if (rows.length < 3) return null;
    var a = rows.map(function(r){ return r[0] || ""; }), lab = 0;
    a.slice(0, 7).forEach(function(x){ if (/^(categor|\$?\d{2,4}|q(uestion)?\b|a(nswer)?\b|clue|value|points?)/i.test(x) || /\b(q|a|question|answer)$/i.test(x)) lab++; });
    if (lab >= 2 || (a[0] === "" && rows[0].length > 1)) rows = rows.map(function(r){ return r.slice(1); });
    var cats = rows[0].map(function(x){ return x.replace(/\s*\n\s*/g, " "); }), n = 0;
    cats.forEach(function(c, i){ if (c) n = i + 1; }); n = Math.min(n, 8); if (n < 1) return null; cats = cats.slice(0, n);
    var levels = [];
    for (var r = 1; r < rows.length && levels.length < 10; r += 2) {
      var qr = rows[r] || [], ar = rows[r + 1] || [];
      if (!qr.some(function(x){ return x; })) continue;
      levels.push(cats.map(function(_, c){ return { q: (qr[c] || "").slice(0, 500), a: (ar[c] || "").replace(/\s*\n\s*/g, " ").slice(0, 160) }; }));
    }
    var clues = 0; levels.forEach(function(Lv){ Lv.forEach(function(x){ if (x.q && x.a) clues++; }); });
    return levels.length ? { cats: cats, levels: levels, clues: clues } : null;
  }
  function parseCells(text){
    var t = String(text || "").replace(/^\uFEFF/, ""), tab = t.indexOf("\t") >= 0 && t.indexOf(",") < 0, rows = [], row = [], f = "", q = false;
    for (var i = 0; i < t.length; i++) { var c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"' && f === "") q = true; else if (c === (tab ? "\t" : ",")) { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; } else f += c; }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.map(function(r){ return r.map(function(x){ return String(x).replace(/\r\n?/g, "\n").trim(); }); });
  }
  var JIMG = /(https?:\/\/[^\s"]+?(?:\.(?:png|jpe?g|gif|webp|svg)(?:\?[^\s"]*)?|googleusercontent\.com\/[^\s"]+|drive\.google\.com\/[^\s"]+))/i;
  function jClue(txt){
    var m = String(txt || "").match(JIMG); if (!m) return '<div class="jq">' + esc(txt) + '</div>';
    var u = m[1], id = (u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/) || [])[1];
    if (id) u = "https://drive.google.com/thumbnail?id=" + id + "&sz=w1600";
    var rest = String(txt).replace(m[1], "").trim();
    return (rest ? '<div class="jq">' + esc(rest) + '</div>' : '') + '<img src="' + esc(u) + '" alt="Clue image">';
  }
  function jMask(a){ return disp(a).split(/\s+/).filter(Boolean).map(function(w){ return '<span class="jw">' + w.split("").map(function(ch){ return '<i>' + (/[a-z0-9]/i.test(ch) ? '' : esc(ch)) + '</i>'; }).join("") + '</span>'; }).join(""); }
  function jRight(a, txt){ var n = norm(txt); if (!n) return false; var ok = alts(a); String(a || "").replace(/\(([^)]*)\)/g, function(_, x){ ok.push(norm(x)); }); return ok.indexOf(n) >= 0; }
  function shuffle(a){ for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function now(){ return Date.now(); }

      else if (V.s === "wait") h = big(esc(V.msg), V.mode === "battle" ? "Stay on this page. You\u2019ll be matched with someone from another team." : "Stay on this page.");
      else if (V.s === "rest") h = big(esc(V.msg), "");
      else if (V.s === "pool") h = big("Rematch pool", (V.late ? "The bracket started before you joined, " : "You\u2019re out of the bracket, ") + "but you can keep playing for fun. Waiting for another player\u2026");
      else if (V.s === "done") {
        if (V.mode === "jteam") h = big(esc(V.win) + " wins!", "Your team finished <b style=\"color:var(--bright);\">#" + V.place + "</b>. You earned <b style=\"color:var(--bright);\">$" + (V.cash || 0).toLocaleString() + "</b> for your team. Nice work, " + esc(V.name) + ".");
        else if (V.mode === "rush") h = big(V.place === 1 ? "You won!" : esc(V.champ) + " wins!", "You finished <b style=\"color:var(--bright);\">#" + V.place + "</b> of " + V.of + " with <b style=\"color:var(--bright);\">" + (V.score || 0).toLocaleString() + "</b> points.");
        else if (V.mode === "battle") h = big(esc(V.win) + " wins!", "Your team finished <b style=\"color:var(--bright);\">#" + V.place + "</b>. You scored <b style=\"color:var(--bright);\">" + V.ko + "</b> KO" + (V.ko === 1 ? "" : "s") + ". Nice work, " + esc(V.name) + ".");
        else h = big(V.champ ? esc(V.champ) + " is King of the Pride!" : "The bracket is over.", V.place ? "You: <b style=\"color:var(--bright);\">" + esc(V.place) + "</b>" : "");
      }
      else if (V.s === "fight") h = fightView(V.f);
      else if (V.s === "jpick" || V.s === "jq" || V.s === "jr") h = jView();
      else if (V.s === "rushq") {
        var rh = '<div class="mono" style="font-size:13px;color:var(--dim);margin-bottom:10px;">Roar Rush \u00b7 question ' + V.qi + ' of ' + V.total + ' \u00b7 #' + V.place + ' of ' + V.of + (V.streak >= 2 ? ' <span style="font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--warn);color:#2a1d00;">STREAK \u00d7' + V.streak + (V.streak >= 3 ? ' \u00b7 +100' : '') + '</span>' : '') + '</div>';
        if (V.x2) rh += '<div class="mono" style="display:inline-block;font-size:13px;font-weight:800;letter-spacing:2px;padding:5px 12px;border-radius:999px;background:var(--warn);color:#2a1d00;margin-bottom:10px;">DOUBLE POINTS \u00d72</div>';
        if (V.ok) h = rh + big("Locked in! +" + V.pts, "Nice and fast. Waiting for the others\u2026", "var(--ok)");
        else if (V.f && V.f.lock && V.f.m === "bank") h = rh + big("Not that one", "Wait for the answer.", "var(--bad)");
        else if (V.f) h = rh + puzzleCard(V.f);
      }
      else if (V.s === "rushr" && lastRR !== V.qi) { lastRR = V.qi; RDL = PREVP ? PREVP - V.place : 0; PREVP = V.place; }
      if (V.s === "rushr") h = big(V.ok ? "Correct! +" + V.pts : "The answer was " + esc(V.a), "You\u2019re <b style=\"color:var(--bright);\">#" + V.place + "</b> of " + V.of + " with <b style=\"color:var(--bright);\">" + V.score.toLocaleString() + "</b> points." + (RDL > 0 ? " <b style=\"color:var(--ok);\">\u25b2 up " + RDL + "!</b>" : RDL < 0 ? " <b style=\"color:var(--bad);\">\u25bc down " + (-RDL) + "</b>" : "") + (V.gap > 0 ? " <b style=\"color:var(--bright);\">" + V.gap.toLocaleString() + " pts behind #" + (V.place - 1) + "</b>" : V.place === 1 && V.score > 0 ? " <b style=\"color:var(--ok);\">You\u2019re in the lead!</b>" : "") + (V.ok && V.streak >= 3 ? " " + V.streak + " in a row!" : "") + (V.ok ? "" : " Get the next one!"), V.ok ? "var(--ok)" : "var(--gold)");
      view.innerHTML = me() + h;
      var a = document.getElementById("sAns");
      if (a) { if (keep != null) a.value = keep; if (hadFocus || keep == null) a.focus(); used.forEach(function(i){ var b = view.querySelector('.tile[data-i="' + i + '"]'); if (b) b.disabled = true; }); }
      wire();
    }
    function fightView(F){
      var bat = V.mode === "battle" && F.kind === "battle";
      var head = '<div class="card" style="padding:16px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;">' +
        '<div id="sMeC" style="min-width:0;padding:6px;border-radius:10px;"><div style="font-weight:800;color:var(--bright);">You</div>' + (F.sd ? '<div class="mono" style="font-size:24px;font-weight:800;color:var(--gold);">' + F.sd.me + '</div>' : hpBar(F.hp[0])) + '</div>' +
        '<div class="mono" style="font-size:12px;color:var(--dim);text-align:center;">' + (F.sd ? 'Q ' + Math.min(F.sd.q + 1, 99) + (F.sd.q >= 5 ? '<br>OVERTIME' : ' of 5') : 'VS') + '</div>' +
        '<div id="sOppC" style="min-width:0;text-align:right;padding:6px;border-radius:10px;"><div style="font-weight:800;color:' + (bat ? tc(F.ot) : "var(--bright)") + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(F.opp) + '</div>' + (F.sd ? '<div class="mono" style="font-size:24px;font-weight:800;color:var(--gold);">' + F.sd.op + '</div>' : hpBar(F.hp[1])) + '</div></div>' +
        (F.round ? '<div class="mono" style="font-size:13px;color:var(--dim);margin:-4px 0 12px;">' + esc(F.round) + (F.need > 1 ? ' \u00b7 games ' + F.wins[0] + '\u2013' + F.wins[1] + ' \u00b7 first to ' + F.need : '') + '</div>' : F.kind === "pool" ? '<div class="mono" style="font-size:13px;color:var(--dim);margin:-4px 0 12px;">Rematch pool \u00b7 just for fun</div>' : '');
      if (F.between) return head + big(esc(F.between), 'Next game in <span id="sLeft">3 s</span>');
      if (F.last) {
        var who = F.last.by === "me" ? ["You got it!", "var(--ok)"] : F.last.by === "opp" ? [esc(F.opp) + " got it", "var(--bad)"] : ["Nobody got it", "var(--warn)"];
        return head + '<div class="card" style="text-align:center;padding:26px 20px;"><div class="disp" style="font-size:clamp(26px,5vw,38px);font-weight:800;color:' + who[1] + ';">' + who[0] + '</div><div style="color:var(--muted);margin-top:10px;white-space:pre-line;">' + esc(F.q) + '</div><div class="lbl" style="margin-top:14px;">Answer</div><div class="disp" style="font-size:clamp(26px,5vw,40px);font-weight:800;color:var(--bright);">' + esc(F.last.a) + '</div></div>';
      }
      return head + puzzleCard(F);
    }
    function puzzleCard(F){
      var pz = "", note = "";
      if (F.m === "shift") { pz = '<div class="mono" style="font-size:clamp(26px,6vw,42px);font-weight:800;letter-spacing:4px;color:var(--gold);word-break:break-word;">' + esc(F.pz) + '</div>'; note = "SHIFT \u00b7 move each letter back <b style=\"color:var(--bright);\">" + F.k + "</b> (" + String.fromCharCode(65 + F.k) + "\u2192A)"; }
      else if (F.m === "scramble") { pz = '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + F.pz.split("").map(function(ch, i){ return '<button type="button" class="tile" data-i="' + i + '" aria-label="Letter ' + esc(ch) + '">' + esc(ch) + '</button>'; }).join("") + '</div>'; note = "SCRAMBLE \u00b7 tap the letters in order, or type the answer"; }
      else if (F.m === "reveal") { pz = '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + F.pz.split("").map(function(ch){ return ch === " " ? '<span class="mask sp"></span>' : '<span class="mask">' + (ch === "_" ? "" : esc(ch)) + '</span>'; }).join("") + '</div>'; note = "REVEAL \u00b7 letters fill in over time \u00b7 type the answer"; }
      else if (F.m === "outline") { var wc = F.pz.split(/\s+/).filter(function(w){ return /_/.test(w); }).length, lc = (F.pz.match(/_/g) || []).length;
        pz = '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + F.pz.split("").map(function(ch){ return ch === " " ? '<span class="mask sp"></span>' : '<span class="mask">' + (ch === "_" ? "" : esc(ch)) + '</span>'; }).join("") + '</div>';
        note = "FREE RESPONSE \u00b7 " + lc + " character" + (lc === 1 ? "" : "s") + (wc > 1 ? " \u00b7 " + wc + " words" : "") + " \u00b7 type the answer"; }
      else if (F.m === "bank") { pz = '<div style="display:grid;grid-template-columns:repeat(' + ((F.opts || []).length === 3 ? 3 : 2) + ',minmax(0,1fr));gap:8px;">' + F.opts.map(function(o, i){ return '<button type="button" class="bankb" data-o="' + i + '" data-t="' + esc(o) + '"' + (F.lock ? ' disabled' : '') + '><b class="lt">' + "ABCD"[i] + '</b><span>' + esc(o) + '</span></button>'; }).join("") + '</div>'; note = F.lock ? "Wrong pick. Wait for the next question." : (F.mc ? "MULTIPLE CHOICE" : "WORD BANK") + " \u00b7 tap or press A\u2013D" + (F.kind === "rush" ? "" : " \u00b7 a wrong pick costs a third of a hit"); }
      else note = "Type the answer";
      var form = F.m === "bank" ? "" : '<form id="sForm" style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;"><input class="ans" id="sAns" data-n="' + F.n + '" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" style="flex:1;min-width:200px;"' + (F.lock ? ' disabled placeholder="Locked for this question"' : ' placeholder="Answer"') + '><button class="btn" type="submit"' + (F.lock ? ' disabled' : '') + '>Strike</button>' + (F.m === "scramble" ? '<button class="btn ghost sm" type="button" id="sClr">Clear</button>' : '') + '</form>';
      return '<div class="card" style="display:flex;flex-direction:column;gap:14px;">' +
        (T.left != null ? '<div style="display:flex;align-items:center;gap:10px;"><div style="flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden;"><div id="sBar" style="height:100%;background:var(--gold);width:100%;"></div></div><span class="mono" id="sLeft" style="font-size:13px;color:var(--dim);min-width:40px;text-align:right;"></span></div>' : '') +
        '<div style="font-size:clamp(19px,3.4vw,26px);font-weight:700;color:var(--bright);line-height:1.35;text-wrap:pretty;white-space:pre-line;">' + esc(F.q) + '</div>' +
        pz + '<div class="mono" style="font-size:13px;color:var(--muted);">' + note + '</div>' + form +
        (F.kind === "rush" ? '</div>' : '<div style="display:flex;justify-content:flex-end;"><button type="button" id="sFF" class="btn ghost sm" style="border-color:var(--bad);color:var(--bad);">' + (F.kind === "match" ? "Forfeit match" : "Forfeit") + '</button></div></div>');
    }
    function wire(){
      var f = document.getElementById("sForm"), a = document.getElementById("sAns"), sn = document.getElementById("sSnd");
      if (sn) sn.onclick = function(){ KO_FX.setSound(!KO_FX.soundOn()); render(); };
      var lv = document.getElementById("sLeave"); if (lv) lv.onclick = leaveNow;
      var fb = document.getElementById("sFF"); if (fb) fb.onclick = forfeitNow;
      if (f) f.onsubmit = function(e){ e.preventDefault(); if (a && a.value.trim()) submit(a.value); };
      view.querySelectorAll("[data-jk]").forEach(function(b){ b.onclick = function(){ if (conn && conn.open) { conn.send({ k: "jpick", key: b.getAttribute("data-jk") }); view.querySelectorAll("[data-jk]").forEach(function(x){ x.disabled = true; }); } }; });
      view.querySelectorAll(".bankb").forEach(function(b){ b.onclick = function(){ submit(b.getAttribute("data-t") || b.textContent); }; });
      view.querySelectorAll(".tile").forEach(function(b){ b.onclick = function(){ if (!a) return; a.value += b.textContent; b.disabled = true; used.push(b.getAttribute("data-i")); if (V.f && norm(a.value).length >= V.f.len) submit(a.value); }; });
      var cl = document.getElementById("sClr"); if (cl) cl.onclick = function(){ if (a) { a.value = ""; a.focus(); } used = []; view.querySelectorAll(".tile").forEach(function(b){ b.disabled = false; }); };
    }
  }
})();
</script>
<style>@media (max-width:820px){.bgrid{grid-template-columns:minmax(0,1fr)!important;}}</style>
</body>
</html>
