<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packet Spy — Network Traffic Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#0b1220;--panel2:#0c1626;--panel3:#0e2136;--border:#1e3350;--border2:#172436;--border3:#244a6d;--border-hi:#2f5580;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--fainter:#3d5069;--accent:#00b3ff;--accent2:#7dd8ff;--bad:#ff5c7a;--warn:#ffcf5c;--ok:#4fd68a;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--accent2);}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 70px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);}
.brand h1{font-size:19px;margin:0;color:var(--bright);letter-spacing:.5px;}
.back{font-size:13px;color:var(--faint);}
.card{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:26px;}
.lead{color:var(--muted);line-height:1.6;font-size:15px;margin:0 0 18px;}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.stats{display:flex;gap:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);flex-wrap:wrap;}
.stats b{color:var(--bright);}
.newBtn{font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:9px 14px;border-radius:8px;border:1px solid var(--border3);background:var(--bg);color:var(--accent);cursor:pointer;min-height:44px;}
.newBtn:hover{background:var(--panel3);}
.tableWrap{border:1px solid var(--border2);border-radius:10px;overflow:hidden;}
.pRow{display:grid;grid-template-columns:34px 74px 1fr 1fr 56px 46px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border2);font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;color:var(--text);}
.pRow:last-child{border-bottom:none;}
.pRow:hover{background:var(--panel3);}
.pRow.flagged{background:color-mix(in srgb,var(--warn) 8%,transparent);}
.pRow .t{color:var(--faint);}
.pRow .proto{color:var(--accent2);}
.pRow .info{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.flagBtn{border:1px solid var(--border3);background:var(--bg);color:var(--faint);border-radius:6px;font-size:14px;cursor:pointer;width:30px;height:30px;line-height:1;}
.flagBtn.on{background:color-mix(in srgb,var(--warn) 20%,transparent);border-color:var(--warn);color:var(--warn);}
.detail{grid-column:1/-1;background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap;word-break:break-all;border:1px solid var(--border2);}
.head{display:grid;grid-template-columns:34px 74px 1fr 1fr 56px 46px;gap:10px;padding:9px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.8px;color:var(--faint);border-bottom:1px solid var(--border2);background:var(--panel2);}
.scrollBody{max-height:56vh;overflow-y:auto;}
.submitBtn{width:100%;margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:13.5px;padding:14px 16px;border-radius:10px;border:none;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#04141f;font-weight:700;cursor:pointer;min-height:44px;}
.submitBtn:hover{filter:brightness(1.08);}
/* ---------- results ---------- */
#results{display:none;margin-top:22px;padding-top:20px;border-top:1px solid var(--border2);}
.gradeBig{text-align:center;padding:4px 0 20px;}
.gradeBig .letter{font-size:56px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1;}
.gradeBig .sub{color:var(--dim);font-size:13.5px;margin-top:6px;}
.confRow{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);margin-bottom:20px;}
.confRow b{display:block;font-size:19px;color:var(--bright);}
.section{margin-bottom:18px;}
.section h3{font-size:12px;letter-spacing:1.2px;color:var(--faint);margin:0 0 10px;font-family:'JetBrains Mono',monospace;}
.itemRow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border2);font-size:13px;line-height:1.5;}
.itemRow:last-child{border-bottom:none;}
.itemRow .ic{flex:none;margin-top:1px;}
.itemRow .pay{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--faint);margin-top:3px;word-break:break-all;}
.debBtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.dbtn{font-family:'JetBrains Mono',monospace;font-size:13px;padding:11px 16px;border-radius:10px;border:1px solid var(--border3);background:var(--bg);color:var(--accent);cursor:pointer;min-height:44px;}
.dbtn:hover{background:var(--panel3);}
.dbtn.primary{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#04141f;font-weight:700;border:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span><h1>PACKET SPY</h1></div>
    <span class="back mono">network traffic simulator · free play, no XP</span>
  </div>

  <div class="card">
    <p class="lead">A capture just came in off the wire. Click a packet to inspect its payload, flag the ones leaking something they shouldn't, then submit your findings.</p>
    <div class="bar">
      <div class="stats"><span>Packets: <b id="statTotal">0</b></span><span>Flagged: <b id="statFlagged">0</b></span></div>
      <button class="newBtn" onclick="newCapture()">🔀 New capture</button>
    </div>
    <div class="tableWrap">
      <div class="head"><span></span><span>TIME</span><span>SRC → DST</span><span>INFO</span><span>PROTO</span><span>FLAG</span></div>
      <div class="scrollBody" id="tableBody"></div>
    </div>
    <button class="submitBtn" onclick="submitFindings()">▶ SUBMIT FINDINGS</button>
    <div id="results"></div>
  </div>
</div>

<script>
var BENIGN = [
  { proto:"TLS", port:443, info:"Client Hello, SNI=schoolportal.edu", payload:"TLSv1.3 Handshake — encrypted after this point. No readable content." },
  { proto:"TLS", port:443, info:"Application Data (encrypted)", payload:"Encrypted application data — 1,204 bytes, unreadable without the session key." },
  { proto:"DNS", port:53, info:"Standard query A canvas.instructure.com", payload:"DNS query for a normal, recognizable school-service domain." },
  { proto:"QUIC", port:443, info:"Protected Payload (encrypted)", payload:"QUIC transport — encrypted by design, nothing readable in the payload." },
  { proto:"NTP", port:123, info:"NTP time sync response", payload:"Standard time-sync traffic between the workstation and a time server." },
  { proto:"ICMP", port:0, info:"Echo (ping) request", payload:"Routine connectivity check, no payload of interest." },
  { proto:"ARP", port:0, info:"Who has 10.0.0.5? Tell 10.0.0.1", payload:"Normal local-network address resolution broadcast." },
  { proto:"SSH", port:22, info:"SSH2 Encrypted Packet", payload:"SSH session — encrypted end-to-end, no plaintext content visible." },
  { proto:"TLS", port:443, info:"Application Data (encrypted)", payload:"Encrypted application data — 892 bytes." },
  { proto:"DNS", port:53, info:"Standard query A googleapis.com", payload:"Routine DNS resolution for a common, legitimate service." }
];
var MALICIOUS = [
  { proto:"HTTP", port:80, info:"POST /login HTTP/1.1", payload:"POST /login HTTP/1.1\\nHost: portal-support.net\\nContent-Type: application/x-www-form-urlencoded\\n\\nusername=jsmith22&password=Fluffy2010",
    why:"A login form submitted over plain HTTP — the username and password are sitting in the payload in cleartext, readable by anyone on the wire." },
  { proto:"FTP", port:21, info:"USER admin / PASS ****", payload:"USER admin\\nPASS admin123\\n230 Login successful.",
    why:"FTP sends credentials completely unencrypted — this login (and password) was just captured in plain text." },
  { proto:"Telnet", port:23, info:"login: root", payload:"login: root\\nPassword: toor\\nWelcome to switch-core-3.",
    why:"Telnet has no encryption at all — this is a live admin login to network equipment, password included, sent in the clear." },
  { proto:"HTTP", port:80, info:"GET /api/data?apikey=... HTTP/1.1", payload:"GET /api/data?apikey=sk_live_51Hc9F2xJq8vBn3plMz HTTP/1.1\\nHost: internal-api.school.local",
    why:"A live API key was placed directly in the URL over an unencrypted connection — anyone capturing this traffic can reuse that key." },
  { proto:"TCP", port:4444, info:"Unusual outbound session to 185.220.101.7", payload:"Connection established to 185.220.101.7:4444 — repeating 60-second beacon interval, no legitimate service on this port.",
    why:"A regular beacon to an unfamiliar external IP on a non-standard port is a classic command-and-control signature." },
  { proto:"HTTP", port:80, info:"Authorization: Basic ...", payload:"GET /reports HTTP/1.1\\nHost: oldapp.school.local\\nAuthorization: Basic am9objpwYXNzMTIz",
    why:"HTTP Basic Auth is only base64-encoded, not encrypted — this decodes directly to a plaintext username and password." },
  { proto:"DNS", port:53, info:"Standard query TXT c2VjcmV0LWV4Zmls.evil-c2.net", payload:"DNS query: c2VjcmV0LWV4Zmls.evil-c2.net TXT — encoded data riding inside a subdomain, to a domain never seen before.",
    why:"Long, encoded-looking subdomains to an unrecognized domain are a common DNS-tunneling exfiltration pattern." },
  { proto:"HTTP", port:80, info:"Cookie: session=...; ssn=...", payload:"GET /profile HTTP/1.1\\nHost: oldportal.school.local\\nCookie: session=abc123; ssn=123-45-6789",
    why:"A Social Security number riding in a plaintext cookie, over an unencrypted connection — sensitive PII exposed on the wire." }
];

var ROUND=[], flagged={}, submitted=false;

function pickN(arr,n){
  var copy=arr.slice(), out=[];
  while(out.length<n && copy.length){ out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]); }
  return out;
}
function randIp(){ return (10+Math.floor(Math.random()*180))+"."+Math.floor(Math.random()*255)+"."+Math.floor(Math.random()*255)+"."+Math.floor(Math.random()*255); }
function fmtTime(i){ var s=i*3+Math.floor(Math.random()*3); return "00:"+String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0'); }

function newCapture(){
  var mal=pickN(MALICIOUS,5+Math.floor(Math.random()*2));
  var ben=pickN(BENIGN,12);
  var mixed=mal.map(function(m){return Object.assign({},m,{bad:true});})
    .concat(ben.map(function(b){return Object.assign({},b,{bad:false});}));
  mixed.sort(function(){return Math.random()-0.5;});
  ROUND = mixed.map(function(p,i){
    return Object.assign({}, p, { id:i, time:fmtTime(i), src:randIp()+":"+(1024+Math.floor(Math.random()*60000)), dst:randIp()+":"+p.port, open:false });
  });
  flagged={}; submitted=false;
  document.getElementById('results').style.display='none';
  renderTable();
}
function renderTable(){
  document.getElementById('statTotal').textContent=ROUND.length;
  document.getElementById('statFlagged').textContent=Object.keys(flagged).filter(function(k){return flagged[k];}).length;
  document.getElementById('tableBody').innerHTML = ROUND.map(function(p){
    var isFlagged=!!flagged[p.id];
    var row='<div class="pRow '+(isFlagged?'flagged':'')+'" onclick="toggleOpen('+p.id+')">'+
      '<span class="mono" style="color:var(--faint)">'+(p.id+1)+'</span>'+
      '<span class="t">'+p.time+'</span>'+
      '<span>'+p.src+' → '+p.dst+'</span>'+
      '<span class="info">'+p.info+'</span>'+
      '<span class="proto">'+p.proto+'</span>'+
      '<button class="flagBtn '+(isFlagged?'on':'')+'" onclick="event.stopPropagation();toggleFlag('+p.id+')" title="Flag as suspicious">⚑</button>'+
      (p.open?'<div class="detail">'+p.payload+'</div>':'')+
      '</div>';
    return row;
  }).join('');
}
function toggleOpen(id){ var p=ROUND.find(function(x){return x.id===id;}); p.open=!p.open; renderTable(); }
function toggleFlag(id){ flagged[id]=!flagged[id]; renderTable(); }

function submitFindings(){
  submitted=true;
  var tp=[], fn=[], fp=[];
  ROUND.forEach(function(p){
    var f=!!flagged[p.id];
    if(p.bad && f) tp.push(p);
    else if(p.bad && !f) fn.push(p);
    else if(!p.bad && f) fp.push(p);
  });
  var totalBad=ROUND.filter(function(p){return p.bad;}).length;
  var score = tp.length - fp.length;
  var pct = Math.max(0, score/totalBad);
  var grade,color;
  if(fn.length===0 && fp.length===0){ grade="A"; color="var(--ok)"; }
  else if(pct>=0.8){ grade="B"; color="var(--ok)"; }
  else if(pct>=0.6){ grade="C"; color="var(--warn)"; }
  else if(pct>=0.4){ grade="D"; color="var(--bad)"; }
  else { grade="F"; color="var(--bad)"; }

  var html='<div class="gradeBig"><div class="letter" style="color:'+color+'">'+grade+'</div><div class="sub">'+tp.length+' of '+totalBad+' real threats caught</div></div>';
  html+='<div class="confRow"><span><b style="color:var(--ok)">'+tp.length+'</b>caught</span><span><b style="color:var(--bad)">'+fn.length+'</b>missed</span><span><b style="color:var(--warn)">'+fp.length+'</b>false alarms</span></div>';

  if(fn.length){
    html+='<div class="section"><h3>MISSED THREATS</h3>';
    fn.forEach(function(p){ html+='<div class="itemRow"><span class="ic" style="color:var(--bad)">⚠</span><span><b style="color:var(--bright)">'+p.info+'</b> ('+p.proto+')<div class="pay">'+p.why+'</div></span></div>'; });
    html+='</div>';
  }
  if(fp.length){
    html+='<div class="section"><h3>FALSE ALARMS</h3>';
    fp.forEach(function(p){ html+='<div class="itemRow"><span class="ic" style="color:var(--warn)">⚑</span><span><b style="color:var(--bright)">'+p.info+'</b> ('+p.proto+') — this traffic was benign, flagging it would waste analyst time chasing nothing.</span></div>'; });
    html+='</div>';
  }
  html+='<div class="section"><h3>WHAT GAVE THEM AWAY</h3>';
  ROUND.filter(function(p){return p.bad;}).forEach(function(p){
    html+='<div class="itemRow"><span class="ic" style="color:'+(flagged[p.id]?'var(--ok)':'var(--faint)')+'">'+(flagged[p.id]?'✓':'·')+'</span><span><b style="color:var(--bright)">'+p.info+'</b><div class="pay">'+p.why+'</div></span></div>';
  });
  html+='</div>';
  html+='<div class="debBtns"><button class="dbtn primary" onclick="newCapture()">↻ New capture</button></div>';

  var el=document.getElementById('results');
  el.innerHTML=html;
  el.style.display='block';
}
newCapture();
</script>
</body>
</html>
