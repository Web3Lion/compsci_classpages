name: Weekly Hall of Fame snapshot

on:
  schedule:
    # 05:10 UTC Monday ≈ just after midnight America/New_York (DST-shifted by an hour twice a year — harmless, still lands early Monday).
    - cron: '10 5 * * 1'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test/backfill

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron_snapshot_all_classes RPC
        run: |
          curl -sf -X POST "${SUPABASE_URL}/rest/v1/rpc/cron_snapshot_all_classes" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
