<!DOCTYPE html>

<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('course-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="../site.js?v=9.0.0"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Teacher Resources — Cyber Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#0b1220;--panel2:#0c1626;--border:#1e3350;--border2:#172436;--border3:#244a6d;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--accent:#00b3ff;--accent2:#7dd8ff;}
:root[data-theme="light"]{--bg:#e9eef5;--panel:#ffffff;--panel2:#f2f6fb;--border:#cdd8e5;--border2:#dde5ef;--border3:#b6c8dc;--text:#26313f;--bright:#0e1622;--muted:#48566a;--dim:#5f7186;--faint:#6f8196;--accent:#0a74d6;--accent2:#075aa8;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);transition:background-color .25s ease,color .25s ease;}
a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent2);}
.mono{font-family:'JetBrains Mono',monospace;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.themebtn:hover{border-color:var(--accent);}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 60px;}
.tool{display:flex;align-items:center;gap:16px;min-height:64px;padding:16px 18px;background:var(--bg);border:1px solid var(--border2);border-radius:10px;transition:border-color .15s ease,box-shadow .15s ease,transform .08s ease;}
.tool:hover{border-color:var(--accent);box-shadow:0 6px 18px -12px var(--accent);}
.tool:active{transform:translateY(2px);}
@media(max-width:720px){.wrap{padding:0 12px 48px;}.themebtn{top:8px;right:8px;}}
</style>
</head>
<body>
<button id="themeToggle" class="themebtn" onclick="__toggleTheme()">LIGHT</button>
<main class="wrap" id="main">
  <a class="mono" href="../teacher.html" style="display:inline-flex;align-items:center;min-height:44px;margin-top:18px;font-size:12px;color:var(--dim);">&larr; Teacher dashboard</a>

  <div style="margin-top:10px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,var(--panel2) 0%,var(--bg) 60%);padding:34px 32px;">
    <div class="mono" style="font-size:12px;letter-spacing:2px;color:var(--accent);margin-bottom:12px;">&gt; ./teacher_cyber_tools</div>
    <h1 class="mono" style="font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;color:var(--bright);letter-spacing:-.5px;">Teacher Resources</h1>
  </div>

  <div style="margin-top:22px;border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:24px;">
    <div class="mono" style="font-size:12px;letter-spacing:1.5px;color:var(--accent);margin-bottom:16px;">// CYBER TOOLS</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <a class="tool" href="https://cyberskyline.com/events/ncl" target="_blank" rel="noopener">
        <span style="display:flex;flex-direction:column;gap:3px;min-width:0;"><span style="font-size:16px;font-weight:600;color:var(--bright);">National Cyber League</span><span style="font-size:13px;color:var(--dim);">Coach registration &amp; game codes · Cyber Skyline</span></span>
        <span class="mono" style="margin-left:auto;color:var(--faint);">&nearr;</span>
      </a>
      <a class="tool" href="https://centra.paradigmcyberventures.com/dashboard" target="_blank" rel="noopener">
        <span style="display:flex;flex-direction:column;gap:3px;min-width:0;"><span style="font-size:16px;font-weight:600;color:var(--bright);">Paradigm Centra</span><span style="font-size:13px;color:var(--dim);">centra.paradigmcyberventures.com</span></span>
        <span class="mono" style="margin-left:auto;color:var(--faint);">&nearr;</span>
      </a>
      <a class="tool" href="https://clark.center/home" target="_blank" rel="noopener">
        <span style="display:flex;flex-direction:column;gap:3px;min-width:0;"><span style="font-size:16px;font-weight:600;color:var(--bright);">CLARK</span><span style="font-size:13px;color:var(--dim);">Cybersecurity curriculum library · clark.center</span></span>
        <span class="mono" style="margin-left:auto;color:var(--faint);">&nearr;</span>
      </a>
    </div>
  </div>
</main>
<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'◐ DARK':'◑ LIGHT';}window.__toggleTheme=function(){var t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem(K,t);}catch(e){}lbl();};lbl();})();</script>
</body>
</html>
