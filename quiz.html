<style>
:root{
  --q-bg:#141c1c;--q-panel:#1b2525;--q-panel2:#212d2d;--q-ink:#e9efe9;--q-ink2:#c8d3cd;--q-muted:#a4b3ad;
  --q-rule:#34433f;--q-rule2:#28332f;--q-accent:#8ccfc2;--q-accentBg:#1f3633;--q-onAccent:#0f1d1b;
  --q-ok:#94d6a5;--q-okBg:#1c3324;--q-bad:#f2a99a;--q-badBg:#3a2420;--q-warn:#e8c57e;--q-warnBg:#352c18;
}
:root[data-theme="light"]{
  --q-bg:#f4f2eb;--q-panel:#fffdf8;--q-panel2:#f9f7f1;--q-ink:#1d2a29;--q-ink2:#36463f;--q-muted:#52615b;
  --q-rule:#d3d1c5;--q-rule2:#e6e3d9;--q-accent:#25645c;--q-accentBg:#e2eeea;--q-onAccent:#ffffff;
  --q-ok:#256536;--q-okBg:#e3f0e5;--q-bad:#983222;--q-badBg:#f7e6e1;--q-warn:#715209;--q-warnBg:#f6edd6;
}
/* site.js tokens (A11Y panel, skip link, focus ring) mapped onto this palette */
:root{--bg:var(--q-bg);--panel:var(--q-panel);--panel2:var(--q-panel2);--text:var(--q-ink2);--bright:var(--q-ink);--muted:var(--q-muted);--dim:var(--q-muted);--faint:var(--q-muted);--border:var(--q-rule);--border2:var(--q-rule2);--border3:var(--q-rule);--accent:var(--q-accent);--accent2:var(--q-accent);}
*{box-sizing:border-box;}
html{text-size-adjust:100%;-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--q-bg);color:var(--q-ink2);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:18px;line-height:1.6;transition:background-color .25s ease,color .25s ease;}
a{color:var(--q-accent);text-underline-offset:3px;} a:hover{color:var(--q-ink);}
:focus-visible{outline:3px solid var(--q-accent);outline-offset:3px;border-radius:4px;}
h1,h2,h3{font-family:'Literata',Georgia,serif;font-weight:600;color:var(--q-ink);line-height:1.25;margin:0;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'Atkinson Hyperlegible',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;padding:8px 14px;border-radius:999px;border:1px solid var(--q-rule);background:var(--q-panel);color:var(--q-accent);cursor:pointer;}
.themebtn:hover{border-color:var(--q-accent);}
.btn{font:inherit;font-size:17px;font-weight:700;min-height:48px;padding:11px 22px;border-radius:10px;border:2px solid var(--q-accent);background:var(--q-accent);color:var(--q-onAccent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
.btn:hover{filter:brightness(1.06);color:var(--q-onAccent);}
.btn.ghost{background:transparent;color:var(--q-accent);}
.btn.ghost:hover{background:var(--q-accentBg);color:var(--q-ink);}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.card{background:var(--q-panel);border:1px solid var(--q-rule);border-radius:14px;padding:28px;}
select,input[type=text]{font:inherit;font-size:17px;color:var(--q-ink);background:var(--q-panel2);border:2px solid var(--q-rule);border-radius:9px;min-height:48px;padding:9px 12px;width:100%;max-width:420px;}
select:focus,input[type=text]:focus{border-color:var(--q-accent);outline:none;box-shadow:0 0 0 3px var(--q-accentBg);}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border:2px solid var(--q-rule2);border-radius:10px;cursor:pointer;background:var(--q-panel2);}
.opt:hover{border-color:var(--q-rule);}
.opt input{width:22px;height:22px;accent-color:var(--q-accent);flex:none;margin:0;}
.opt:has(input:checked){border-color:var(--q-accent);background:var(--q-accentBg);color:var(--q-ink);}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
#quiz{user-select:none;-webkit-user-select:none;}
#quiz input[type=text]{user-select:text;-webkit-user-select:text;}
@media(max-width:640px){body{font-size:17px;}.card{padding:20px;border-radius:12px;}}

<script>
(function(){
var AUTH = window.CTF_AUTH;
var QID = new URLSearchParams(location.search).get("q");
/* ?demo=1 : local sample quiz for previewing the layout. Nothing is sent or saved. */
if(new URLSearchParams(location.search).get("demo")==="1"){ QID="demo"; AUTH=demoAuth(); }
function demoAuth(){
  var T=[["Phishing","A fraudulent message that tricks people into revealing information or clicking a malicious link."],["Firewall","A device or program that filters network traffic based on a set of rules."],["Malware","Software written to damage, disrupt, or gain unauthorized access to a system."],["Encryption","Converting readable data into an unreadable form so only authorized parties can read it."],["Authentication","Verifying that a user or device is who or what it claims to be."],["Patch","An update that fixes a security flaw or bug in software."],["Tailgating","Following an authorized person through a secure door without using your own access."],["Ransomware","Malware that locks or encrypts files and demands payment to restore them."],["Botnet","A network of infected computers controlled remotely by an attacker."],["Two-Factor Authentication","A login that requires two different kinds of proof of identity."]];
  function sh(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  var att=[], cur=null, key={};
  function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
  function info(){ return {title:"Demo: Module 3 Vocab Quiz",course:"cyber1",class_name:"Demo class",name:"Demo Student",handle:"demo",status:"open",time_limit_min:15,max_attempts:2,questions:8,due_at:new Date(Date.now()+864e5*3).toISOString(),in_progress:!!cur,attempts:att}; }
  function start(){
    if(cur) return cur;
    var p=sh(T), d=p.slice(0,8), rest=p.slice(8), idx=0; key={};
    function items(list,mc){ return list.map(function(x){ key[idx]=x[0]; var it={i:idx++,q:x[1]}; if(mc) it.opts=sh([x[0]].concat(sh(T.filter(function(y){return y[0]!==x[0];})).slice(0,3).map(function(y){return y[0];}))); return it; }); }
    var b=d.slice(0,2), m=d.slice(2,4), c=d.slice(4,6), t=d.slice(6,8);
    var paper=[{kind:"bank",items:items(b),bank:sh(b.map(function(x){return x[0];}).concat(rest.map(function(x){return x[0];})))},{kind:"match",items:items(m),choices:sh(m.map(function(x){return x[0];}))},{kind:"mc",items:items(c,true)},{kind:"typed",items:items(t)}];
    cur={attempt_id:"demo",attempt_no:att.length+1,paper:paper,answers:{},deadline:new Date(Date.now()+15*60000).toISOString(),now:new Date().toISOString(),total:8,title:"Demo: Module 3 Vocab Quiz",max_attempts:2};
    return cur;
  }
  function lev(a,b){ var p=[],i,j; for(j=0;j<=b.length;j++) p[j]=j; for(i=1;i<=a.length;i++){ var c=[i]; for(j=1;j<=b.length;j++) c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[b.length]; }
  function submit(ans, viol){
    var score=0, missed=[];
    cur.paper.forEach(function(s){ s.items.forEach(function(it){ var g=ans[it.i]||"", a=key[it.i], ok;
      if(s.kind==="typed"){ var G=norm(g),A=norm(a); ok=G!==""&&(G===A||lev(G,A)<=(A.length<=4?0:A.length<=8?1:2)); } else ok=g!==""&&norm(g)===norm(a);
      if(ok) score++; else missed.push({kind:s.kind,q:it.q,given:g}); }); });
    var r={no:cur.attempt_no,score:score,total:8,submitted_at:new Date().toISOString(),missed:missed,violation:viol||null}; att.push(r); cur=null;
    return {score:score,total:8,attempt_no:r.no,missed:missed,violation:viol||null,best:Math.max.apply(null,att.map(function(a){return a.score;})),attempts_left:2-att.length,status:"open"};
  }
  return {online:true, requireSchool:function(){ return Promise.resolve({email:"demo@example.org"}); }, signIn:function(){},
    rpc:function(fn,a){ return new Promise(function(res){ setTimeout(function(){ res(fn==="vq_info"?info():fn==="vq_start"?start():fn==="vq_submit"?submit(a.p_answers,a.p_violation):{ok:true}); },150); }); }};
}
var app = document.getElementById("app");
var COURSES = {cyber1:"Cybersecurity 1",cyber2:"AP Cybersecurity 2",cyber3:"Cybersecurity 3",apcsp:"AP Computer Science Principles",web3:"Web3"};
var KIND = {
  bank:  {title:"Completion with a word bank", how:"Choose the term from the word bank that matches each definition."},
  match: {title:"Matching", how:"Match each definition with a term from the list. Each term is used once."},
  mc:    {title:"Multiple choice", how:"Pick the term that matches each definition."},
  typed: {title:"Type the term", how:"Type the term that matches each definition. Small spelling mistakes are okay."}
};
var S = {info:null, att:null, answers:{}, focus:0, pastes:0, dirty:false, offset:0, tick:null, saveT:null, busy:false, away:false, warned:{}};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function rpc(fn,args){ return AUTH.rpc(fn,args||{}); }
function when(ts){ if(!ts) return ""; return new Date(ts).toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
function show(html){ app.innerHTML = html; var h = app.querySelector("h1"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } window.scrollTo(0,0); }
function say(t){ var l=document.getElementById("srLive"); l.textContent=""; setTimeout(function(){ l.textContent=t; },50); }
var toastT=null;
function toast(t){ var b=document.getElementById("toast"); b.textContent=t; b.style.display="block"; clearTimeout(toastT); toastT=setTimeout(function(){ b.style.display="none"; },4200); }
function note(kind, html){
  var c = {info:["--q-accentBg","--q-accent"], warn:["--q-warnBg","--q-warn"], bad:["--q-badBg","--q-bad"], ok:["--q-okBg","--q-ok"]}[kind];
  return '<div role="note" style="padding:14px 18px;border-radius:10px;background:var('+c[0]+');border-left:0;border:1px solid var('+c[1]+');color:var(--q-ink);margin-top:18px;">'+html+'</div>';
}
var RULE_TXT='When you start, the quiz opens in full screen. <b>If the quiz screen loses focus, your quiz ends right away</b> and is turned in with the answers you have so far. The screen loses focus if you leave full screen (including pressing Esc), switch to another tab or app, click outside the quiz window, or close or reload the page. Your teacher can see when a quiz ended this way.';
function ruleBanner(){
  return '<div role="note" aria-label="Stay on this screen" style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:18px 20px;border-radius:12px;background:var(--q-badBg);border:2px solid var(--q-bad);color:var(--q-ink);margin-bottom:22px;">'+
    '<span aria-hidden="true" style="font-size:28px;line-height:1;color:var(--q-bad);">&#9888;</span>'+
    '<div><div style="font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--q-bad);">Stay on this screen</div>'+
    '<p style="margin:6px 0 0;font-size:17px;line-height:1.55;">'+RULE_TXT+'</p></div></div>';
}
function errorView(title, msg, extra){
  show('<div class="card"><h1 style="font-size:28px;">'+esc(title)+'</h1><p style="margin:14px 0 0;">'+msg+'</p>'+(extra||"")+'</div>');
}

/* ---------------- boot ---------------- */
async function boot(){
  if(!QID) return errorView("Quiz link incomplete", "This link is missing its quiz code. Open the link your teacher shared again.");
  if(!AUTH || !AUTH.online) return errorView("Quizzes are offline", "The quiz server isn't connected right now. Tell your teacher.");
  var u = await AUTH.requireSchool();
  if(!u) return signInView();
  if(u.wrongDomain) return signInView('That account ('+esc(u.email)+') isn\u2019t a school account. Sign in with your school Google account.');
  loadInfo();
}
function signInView(msg){
  show('<div class="card"><h1 style="font-size:30px;">Vocab quiz</h1>'+
    '<p style="margin:14px 0 22px;">Sign in with your school Google account. Your name is filled in for you.</p>'+
    (msg?note("bad",msg):"")+
    '<div style="margin-top:22px;"><button class="btn" id="signInBtn">Sign in with Google</button></div></div>');
  document.getElementById("signInBtn").onclick=function(){ AUTH.signIn(); };
}
async function loadInfo(){
  var r;
  try{ r = await rpc("vq_info",{p_quiz:QID}); }
  catch(e){
    var m=(e&&e.message)||"";
    if(/not_enrolled/.test(m)) return notEnrolled();
    if(/no_quiz/.test(m)) return errorView("Quiz not found","This quiz was removed or the link is wrong. Ask your teacher for a new link.");
    if(/not_signed_in/.test(m)) return signInView();
    if(/function|schema|exist/i.test(m)) return errorView("Quizzes aren\u2019t set up yet","Your teacher needs to finish setting up quizzes.");
    return errorView("Something went wrong","The quiz didn\u2019t load. Refresh the page to try again.");
  }
  S.info = r; introView();
}
async function notEnrolled(){
  // vq_info returns the course on this error; rpc() throws before we see it, so ask again raw
  var course="", cname="";
  try{ var db=await AUTH.client(); var raw=await db.rpc("vq_info",{p_quiz:QID}); course=(raw.data&&raw.data.course)||""; cname=(raw.data&&raw.data.class_name)||""; }catch(e){}
  var link = course ? '<p style="margin:18px 0 0;"><a class="btn" href="'+course+'/ctf.html">Join '+esc(COURSES[course]||course)+'</a></p>' : "";
  errorView("Join your class first", "This quiz is for "+(cname?"<b>"+esc(cname)+"</b>":"a class you haven\u2019t joined")+". Join it with your class code, then open the quiz link again.", link);
}

/* ---------------- intro / results ---------------- */
function scoreLine(a){ var pct=a.total?Math.round(a.score/a.total*100):0; return a.score+" / "+a.total+" ("+pct+"%)"; }
function missedList(missed){
  if(!missed || !missed.length) return '<p style="margin:10px 0 0;color:var(--q-ok);font-weight:700;">You got every question right.</p>';
  return '<ol style="margin:12px 0 0;padding-left:24px;display:flex;flex-direction:column;gap:12px;">'+missed.map(function(m){
    return '<li><div style="color:var(--q-ink);">'+esc(m.q)+'</div>'+
      '<div style="font-size:16px;color:var(--q-muted);">Your answer: '+(m.given?'<span style="color:var(--q-bad);font-weight:700;">'+esc(m.given)+'</span>':'<i>no answer</i>')+'</div></li>';
  }).join("")+'</ol>';
}
function introView(){
  var i=S.info, att=i.attempts||[], used=att.length+(i.in_progress?1:0), left=Math.max(i.max_attempts-used,0);
  var best=att.reduce(function(b,a){return a.score!=null&&(b==null||a.score>b.score)?a:b;},null);
  var h='<div class="card">'+ruleBanner()+
    '<div style="font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--q-accent);">'+esc(COURSES[i.course]||i.course)+' \u00b7 '+esc(i.class_name)+'</div>'+
    '<h1 style="font-size:clamp(28px,4.6vw,38px);margin-top:10px;text-wrap:balance;">'+esc(i.title)+'</h1>'+
    '<p style="margin:12px 0 0;">Signed in as <b style="color:var(--q-ink);">'+esc(i.name)+'</b></p>'+
    '<dl style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0 0;">'+
      dl("Questions", i.questions)+
      dl("Time limit", i.time_limit_min?i.time_limit_min+" min":"None")+
      dl("Attempts", Math.min(used,i.max_attempts)+" of "+i.max_attempts+" used")+
      (i.due_at?dl("Due", when(i.due_at)):"")+
    '</dl>';
  if(best) h+=note("ok",'Best score: <b>'+scoreLine(best)+'</b>');
  if(i.status==="closed") h+=note("warn","This quiz is closed right now.");
  else if(i.status==="not_yet") h+=note("info","This quiz opens "+esc(when(i.opens_at))+".");
  else if(i.status==="past_due" && !i.in_progress) h+=note("warn","The due date has passed. This quiz is closed.");
  var canStart = i.in_progress || (i.status==="open" && left>0);
  if(canStart){
    h+='<div style="margin-top:24px;padding-top:22px;border-top:1px solid var(--q-rule2);">'+
      '<h2 style="font-size:20px;">Before you start</h2>'+
      '<ul style="margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;">'+
        (att.length?'<li>Each attempt gets a new set of questions.</li>':'<li>Your questions are picked just for you.</li>')+
        (i.time_limit_min?'<li>The timer starts when you press Start. When it reaches zero your answers are turned in.</li>':'<li>Your answers save as you go.</li>')+
        '<li>The quiz fills the screen. Stay in it until you press <b>Turn in quiz</b>. If the screen loses focus, the quiz ends and is turned in as is.</li>'+
        '<li>Copy and paste are turned off.</li>'+
        '<li>Your best score counts.</li>'+
      '</ul>'+
      '<div style="margin-top:22px;"><button class="btn" id="startBtn">'+(i.in_progress?"Resume quiz":att.length?"I understand. Start attempt "+(att.length+1):"I understand. Start quiz")+'</button></div></div>';
  } else if(i.status==="open" && left===0){
    h+=note("info","You\u2019ve used all your attempts.");
  }
  if(att.length){
    h+='<div style="margin-top:28px;padding-top:22px;border-top:1px solid var(--q-rule2);"><h2 style="font-size:20px;">Your results</h2>';
    att.slice().reverse().forEach(function(a){
      h+='<details style="margin-top:14px;border:1px solid var(--q-rule2);border-radius:10px;padding:14px 18px;background:var(--q-panel2);"'+(a===att[att.length-1]?" open":"")+'>'+
        '<summary style="cursor:pointer;min-height:28px;color:var(--q-ink);font-weight:700;">Attempt '+a.no+': '+scoreLine(a)+(a.violation?' <span style="color:var(--q-warn);">\u00b7 ended early</span>':'')+'</summary>'+
        '<div style="margin-top:6px;font-size:15px;color:var(--q-muted);">'+(a.violation?'Ended ':'Turned in ')+esc(when(a.submitted_at))+'</div>'+
        (a.violation?note("warn","This attempt ended early because the quiz screen lost focus. It was graded on the answers you had."):"")+
        (a.missed&&a.missed.length?'<h3 style="font-family:inherit;font-size:16px;margin-top:14px;">Questions you missed</h3>':'')+missedList(a.missed)+
      '</details>';
    });
    h+='</div>';
  }
  h+='</div>';
  show(h);
  var b=document.getElementById("startBtn"); if(b) b.onclick=startQuiz;
}
function dl(k,v){ return '<div style="padding:12px 14px;border-radius:10px;background:var(--q-panel2);border:1px solid var(--q-rule2);"><dt style="font-size:14px;color:var(--q-muted);">'+k+'</dt><dd style="margin:2px 0 0;font-size:18px;font-weight:700;color:var(--q-ink);">'+esc(v)+'</dd></div>'; }

/* ---------------- taking the quiz ---------------- */
function fsOn(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function fsExit(){ try{ if(document.exitFullscreen&&document.fullscreenElement) document.exitFullscreen(); else if(document.webkitExitFullscreen&&document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){} }
async function startQuiz(){
  // must run inside the click: browsers only allow full screen from a user gesture
  var de=document.documentElement, req=de.requestFullscreen||de.webkitRequestFullscreen;
  S.fs=!!req; S.armed=false;
  if(req){ try{ var p=req.call(de); if(p&&p.catch) p.catch(function(){ S.fs=false; }); }catch(e){ S.fs=false; } }
  var b=document.getElementById("startBtn"); if(b){ b.disabled=true; b.textContent="Getting your questions…"; }
  var r;
  try{ r=await rpc("vq_start",{p_quiz:QID}); }
  catch(e){
    var m=(e&&e.message)||"";
    fsExit();
    var why={integrity_closed:"Your open attempt was turned in because the quiz page was closed or reloaded, so the quiz screen lost focus.",closed:"This quiz is closed.",not_yet:"This quiz isn\u2019t open yet.",past_due:"The due date has passed.",no_attempts_left:"You\u2019ve used all your attempts."};
    var k=Object.keys(why).filter(function(x){return m.indexOf(x)!==-1;})[0];
    toast(k?why[k]:"Couldn\u2019t start the quiz. Try again."); return loadInfo();
  }
  S.att=r; S.answers=r.answers||{}; S.offset=new Date(r.now).getTime()-Date.now(); S.warned={};
  S.confirmBlank=false;
  quizView(); guardsOn(); startTimer();
  // arm the rule once full screen has settled (entering it can briefly blur the window)
  setTimeout(function(){ if(S.fs && !fsOn()) S.fs=false; S.armed=true; }, 1500);
}
function quizView(){
  var a=S.att, n=0, h='';
  h+='<div id="quiz">'+
    '<div style="position:sticky;top:0;z-index:50;margin:-72px -22px 22px;padding:14px 22px;background:color-mix(in srgb,var(--q-bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--q-rule2);display:flex;align-items:center;gap:16px;flex-wrap:wrap;">'+
      '<div style="min-width:0;flex:1;"><div style="font-weight:700;color:var(--q-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(a.title)+'</div>'+
      '<div id="progress" style="font-size:15px;color:var(--q-muted);"></div></div>'+
      '<div role="note" style="flex-basis:100%;order:3;font-size:15px;font-weight:700;color:var(--q-bad);">&#9888; Stay on this screen until you turn the quiz in. If it loses focus, the quiz ends.</div>'+
      (a.deadline?'<div style="text-align:right;margin-right:190px;"><div style="font-size:13px;color:var(--q-muted);">Time left</div><div id="clock" style="font-size:22px;font-weight:700;color:var(--q-ink);font-variant-numeric:tabular-nums;" aria-hidden="true">--:--</div></div>':'<div style="margin-right:190px;"></div>')+
    '</div>'+
    '<h1 style="font-size:clamp(26px,4vw,34px);">'+esc(a.title)+'</h1>'+
    '<p style="margin:8px 0 0;color:var(--q-muted);">Attempt '+a.attempt_no+' of '+a.max_attempts+' \u00b7 '+a.total+' questions</p>'+
    '<div style="margin-top:18px;">'+ruleBanner()+'</div>';
  a.paper.forEach(function(sec, si){
    var K=KIND[sec.kind]||{title:sec.kind,how:""};
    h+='<section aria-labelledby="sec'+si+'" class="card" style="margin-top:24px;">'+
      '<div style="font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--q-accent);">Part '+(si+1)+'</div>'+
      '<h2 id="sec'+si+'" style="font-size:24px;margin-top:4px;">'+K.title+'</h2>'+
      '<p style="margin:6px 0 0;">'+K.how+'</p>';
    if(sec.kind==="bank"){
      h+='<div style="margin-top:16px;padding:16px 18px;border-radius:10px;background:var(--q-accentBg);border:1px solid var(--q-rule);">'+
        '<h3 style="font-family:inherit;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--q-ink);">Word bank</h3>'+
        '<ul style="list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;">'+
        sec.bank.map(function(w){return '<li style="padding:6px 12px;border-radius:999px;background:var(--q-panel);border:1px solid var(--q-rule);color:var(--q-ink);font-weight:700;">'+esc(w)+'</li>';}).join("")+
        '</ul></div>';
    }
    if(sec.kind==="match"){
      h+='<div style="margin-top:16px;padding:16px 18px;border-radius:10px;background:var(--q-accentBg);border:1px solid var(--q-rule);">'+
        '<h3 style="font-family:inherit;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--q-ink);">Terms</h3>'+
        '<ol type="A" style="margin:10px 0 0;padding-left:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;color:var(--q-ink);font-weight:700;">'+
        sec.choices.map(function(w){return '<li>'+esc(w)+'</li>';}).join("")+'</ol></div>';
    }
    h+='<ol start="'+(n+1)+'" style="list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:0;">';
    sec.items.forEach(function(it){
      n++;
      var id="q"+it.i, val=S.answers[it.i]||"";
      h+='<li style="padding:18px 0;border-top:1px solid var(--q-rule2);display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;">'+
        '<span aria-hidden="true" style="font-weight:700;color:var(--q-accent);font-size:18px;">'+n+'.</span>'+
        '<div style="min-width:0;"><p id="'+id+'t" style="margin:0 0 12px;color:var(--q-ink);text-wrap:pretty;"><span class="sr">Question '+n+'. </span>'+esc(it.q)+'</p>';
      if(sec.kind==="bank"||sec.kind==="match"){
        var opts=sec.kind==="bank"?sec.bank:sec.choices;
        h+='<select data-i="'+it.i+'" aria-labelledby="'+id+'t"><option value="">Choose a term…</option>'+
          opts.map(function(w,wi){ var lab=sec.kind==="match"?String.fromCharCode(65+wi)+". "+w:w; return '<option value="'+esc(w)+'"'+(val===w?" selected":"")+'>'+esc(lab)+'</option>'; }).join("")+'</select>';
      } else if(sec.kind==="mc"){
        h+='<div role="radiogroup" aria-labelledby="'+id+'t" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">'+
          (it.opts||[]).map(function(w,wi){ return '<label class="opt"><input type="radio" name="'+id+'" data-i="'+it.i+'" value="'+esc(w)+'"'+(val===w?" checked":"")+'><span>'+esc(w)+'</span></label>'; }).join("")+'</div>';
      } else {
        h+='<input type="text" data-i="'+it.i+'" aria-labelledby="'+id+'t" value="'+esc(val)+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="120" placeholder="Type the term">';
      }
      h+='</div></li>';
    });
    h+='</ol></section>';
  });
  h+='<div class="card" style="margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">'+
    '<div style="flex:1;min-width:200px;"><div style="font-weight:700;color:var(--q-ink);">Ready to turn it in?</div><div id="progress2" style="font-size:15px;color:var(--q-muted);"></div><div id="submitNote" role="status" style="font-size:15px;font-weight:700;color:var(--q-warn);"></div></div>'+
    '<button class="btn" id="submitBtn">Turn in quiz</button></div></div>';
  show(h);
  progress();
  document.getElementById("submitBtn").onclick=function(){ submit(false); };
}
function answered(){ return Object.keys(S.answers).filter(function(k){ return String(S.answers[k]).trim()!==""; }).length; }
function progress(){
  var t=S.att.total, a=answered(), txt=a+" of "+t+" answered";
  var p=document.getElementById("progress"), p2=document.getElementById("progress2");
  if(p) p.textContent=txt; if(p2) p2.textContent=txt+(a<t?" \u00b7 "+(t-a)+" left blank":"");
}
function onAnswer(e){
  var t=e.target; if(!t.dataset || t.dataset.i==null || !S.att) return;
  S.confirmBlank=false; var sn=document.getElementById("submitNote"); if(sn) sn.textContent="";
  S.answers[t.dataset.i]=t.value; S.dirty=true; progress();
  clearTimeout(S.saveT); S.saveT=setTimeout(save, 1500);
}
app.addEventListener("change", onAnswer);
app.addEventListener("input", onAnswer);

async function save(){
  if(!S.att || S.busy || !S.dirty) return;
  S.dirty=false;
  try{ await rpc("vq_save",{p_attempt:S.att.attempt_id,p_answers:S.answers,p_focus:S.focus,p_pastes:S.pastes}); }
  catch(e){ var m=(e&&e.message)||""; if(/time_up|submitted/.test(m)) return submit(true); S.dirty=true; }
}
async function submit(auto, violation){
  if(!S.att || S.busy) return;
  if(!auto){
    var blank=S.att.total-answered();
    if(blank>0 && !S.confirmBlank){
      S.confirmBlank=true;
      var sn=document.getElementById("submitNote"); if(sn) sn.textContent=blank+" question"+(blank>1?"s are":" is")+" blank. Press Turn in quiz again to turn it in anyway.";
      return;
    }
  }
  S.busy=true; clearTimeout(S.saveT); stopTimer();
  var b=document.getElementById("submitBtn"); if(b){ b.disabled=true; b.textContent="Turning in…"; }
  var r;
  if(violation){ S.focus++; guardsOff(); }
  try{ r=await rpc("vq_submit",{p_attempt:S.att.attempt_id,p_answers:S.answers,p_focus:S.focus,p_pastes:S.pastes,p_violation:violation||null}); }
  catch(e){ if(violation){ guardsOff(); S.att=null; S.busy=false; fsExit(); return errorView("Quiz ended","Your quiz ended because the quiz screen lost focus. It was turned in with the answers you had. Refresh the page to see your score."); } S.busy=false; if(b){ b.disabled=false; b.textContent="Turn in quiz"; } toast("Couldn\u2019t turn in. Check your connection and try again."); startTimer(); return; }
  guardsOff(); S.att=null; S.busy=false; S.dirty=false; fsExit();
  resultView(r, auto);
}
function resultView(r, auto){
  var pct=r.total?Math.round(r.score/r.total*100):0;
  var h='<div class="card">'+
    (r.violation?'<div role="alert">'+note("warn","<b>Your quiz ended because the quiz screen lost focus.</b> It was turned in with the answers you had, and you got credit for those.")+'</div>':auto?note("info","Time ran out, so your answers were turned in."):"")+
    '<h1 style="font-size:28px;margin-top:'+(auto||r.violation?"18px":"0")+';">'+(r.violation?"Quiz ended":"Quiz turned in")+'</h1>'+
    '<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:18px 0 0;">'+
      '<span style="font-family:Literata,Georgia,serif;font-size:56px;font-weight:600;line-height:1;color:var(--q-ink);font-variant-numeric:tabular-nums;white-space:nowrap;">'+r.score+' / '+r.total+'</span>'+
      '<span style="font-size:22px;font-weight:700;color:var(--q-accent);">'+pct+'%</span></div>'+
    (r.best!=null&&r.best!==r.score?'<p style="margin:10px 0 0;">Your best score on this quiz: <b style="color:var(--q-ink);">'+r.best+' / '+r.total+'</b></p>':'')+
    '<h2 style="font-size:20px;margin-top:26px;">'+(r.missed&&r.missed.length?"Questions you missed":"Results")+'</h2>'+
    missedList(r.missed)+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--q-rule2);">'+
      (r.attempts_left>0&&r.status==="open"?'<button class="btn" id="againBtn">Try again with new questions</button>':'')+
      '<button class="btn ghost" id="doneBtn">Back to quiz overview</button>'+
    '</div>'+
    (r.attempts_left>0&&r.status==="open"?'<p style="margin:12px 0 0;font-size:15px;color:var(--q-muted);">'+r.attempts_left+' attempt'+(r.attempts_left>1?"s":"")+' left. Your best score counts.</p>':'')+
  '</div>';
  show(h);
  say((r.violation?"Your quiz ended because the quiz screen lost focus. ":"Quiz turned in. ")+"You scored "+r.score+" out of "+r.total+".");
  var a=document.getElementById("againBtn"); if(a) a.onclick=startQuiz;
  document.getElementById("doneBtn").onclick=loadInfo;
}

/* ---------------- timer ---------------- */
function startTimer(){
  stopTimer(); if(!S.att || !S.att.deadline) return;
  var end=new Date(S.att.deadline).getTime();
  function t(){
    var left=Math.round((end-(Date.now()+S.offset))/1000), c=document.getElementById("clock");
    if(left<=0){ if(c) c.textContent="0:00"; stopTimer(); submit(true); return; }
    var m=Math.floor(left/60), s=left%60;
    if(c){ c.textContent=m+":"+(s<10?"0":"")+s; c.style.color=left<=60?"var(--q-bad)":left<=300?"var(--q-warn)":"var(--q-ink)"; }
    [[300,"5 minutes left."],[60,"1 minute left."]].forEach(function(w){ if(left<=w[0]&&!S.warned[w[0]]){ S.warned[w[0]]=1; say(w[1]); toast(w[1]); } });
  }
  t(); S.tick=setInterval(t,1000);
}
function stopTimer(){ clearInterval(S.tick); S.tick=null; }

/* ---------------- integrity deterrents (quiz in progress only) ---------------- */
function inQuiz(e){ return S.att && e.target && e.target.closest && e.target.closest("#quiz"); }
function block(e){ if(inQuiz(e)){ e.preventDefault(); } }
function onPaste(e){ if(!S.att) return; e.preventDefault(); S.pastes++; S.dirty=true; toast("Paste is turned off during quizzes."); }
function violate(reason){ if(!S.att || S.busy || !S.armed) return; submit(true, reason); }
function onVis(){ if(document.hidden) violate("switched to another tab or app"); }
function onBlur(){ violate("clicked outside the quiz window"); }
function onFs(){ if(S.fs && !fsOn()) violate("left full screen"); }
function sbToken(){
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(/^sb-.*-auth-token$/.test(k)){ var v=JSON.parse(localStorage.getItem(k)); return v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)); } } }catch(e){}
  return null;
}
// closing / reloading: the page is going away, so send the 0 with keepalive
function onHide(){
  if(!S.att || S.busy || QID==="demo") return;
  var C=window.SUPABASE_CONFIG||{}, t=sbToken(); if(!C.url||!C.anonKey||!t) return;
  try{ fetch(C.url+"/rest/v1/rpc/vq_submit",{method:"POST",keepalive:true,
    headers:{apikey:C.anonKey,Authorization:"Bearer "+t,"Content-Type":"application/json"},
    body:JSON.stringify({p_attempt:S.att.attempt_id,p_answers:S.answers,p_focus:S.focus+1,p_pastes:S.pastes,p_violation:"closed or reloaded the quiz page"})}); }catch(e){}
}
function guardsOn(){
  ["copy","cut","contextmenu","dragstart"].forEach(function(k){ document.addEventListener(k,block); });
  document.addEventListener("paste",onPaste,true);
  document.addEventListener("visibilitychange",onVis);
  document.addEventListener("fullscreenchange",onFs); document.addEventListener("webkitfullscreenchange",onFs);
  window.addEventListener("blur",onBlur);
  window.addEventListener("pagehide",onHide);
}
function guardsOff(){
  ["copy","cut","contextmenu","dragstart"].forEach(function(k){ document.removeEventListener(k,block); });
  document.removeEventListener("paste",onPaste,true);
  document.removeEventListener("visibilitychange",onVis);
  document.removeEventListener("fullscreenchange",onFs); document.removeEventListener("webkitfullscreenchange",onFs);
  window.removeEventListener("blur",onBlur);
  window.removeEventListener("pagehide",onHide);
}
setInterval(function(){ if(S.att) save(); }, 20000);

boot();
})();
</script>
