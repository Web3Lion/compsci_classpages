<style>
:root{--bg:#0a0e14;--panel:#0b1220;--panel2:#0c1626;--border:#1e3350;--border2:#172436;--border3:#244a6d;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--accent:#00b3ff;--accent2:#7dd8ff;--amber:#ffcf5c;--amber-bg:#1a150a;--ok:#3ddc97;--bad:#ff7a85;}
:root[data-theme="light"]{--bg:#e9eef5;--panel:#ffffff;--panel2:#f2f6fb;--border:#cdd8e5;--border2:#dde5ef;--border3:#b6c8dc;--text:#26313f;--bright:#0e1622;--muted:#48566a;--dim:#5f7186;--faint:#8394a8;--accent:#0a74d6;--accent2:#075aa8;--amber:#8a6a00;--amber-bg:#fbf4dd;--ok:#1d7a4c;--bad:#b3261e;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);}
a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent2);}

.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px;}
.card{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:22px;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.btn{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--amber);background:var(--amber);color:#1a1200;cursor:pointer;}
:root[data-theme="light"] .btn:not(.ghost){background:#f3c94b;border-color:#8a6a00;}
.btn.ghost{background:transparent;color:var(--bright);border-color:var(--border3);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.chip{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:transparent;color:var(--dim);cursor:pointer;}
.chip[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-bg);color:var(--bright);}
.chip[aria-pressed="true"]::before{content:"\2713  ";}
select{font:inherit;font-size:15px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--border3);background:var(--bg);color:var(--bright);}
</style>

<script>
(function(){
  var AUTH = window.CTF_AUTH, view = document.getElementById("view"), sel = document.getElementById("cls"), FX = window.BATTLE_FX;
  var seenAt = 0, curBattle = null;
  if (FX) { FX.enableSound(true); FX.soundUi(document.getElementById("snd")); }
  var CLASSES = [], CUR = null, SET = null, ST = null, skew = 0, msg = "", busy = false, pick = {}, mins = 15, timer = null;
  var LENGTHS = [[5,"5 min"],[10,"10 min"],[15,"15 min (default)"],[20,"20 min"],[45,"Whole period"]];
  var FALLBACK = ["#3a86ff","#ff5d73","#2ec27e","#f4a300"];
  var ERR = { ungrouped:"Every student needs a team first. Use Randomize teams, or put them in a squad on the teacher dashboard.", need_two_teams:"You need at least 2 teams with students in them.",
    too_many_teams:"Battles take 2\u20134 teams. Merge some squads or use Randomize teams.", no_modules:"Pick at least one module.",
    no_manifest:"Open this class once in teacher.html so its flag list is published, then try again.", battle_live:"A battle is already running in this class." };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }
  function mmss(ms){ ms = Math.max(0, ms); var s = Math.ceil(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  function names(){ return ((((window.COURSE_CONFIG||{})[CUR.course]||{}).ctf)||{}).modules || []; }
  function modName(m){ var n = names()[m-1]; return "Module " + String(m).padStart(2,"0") + (n ? " \u00b7 " + n : ""); }
  function col(t, i){ return t.color || FALLBACK[i % 4]; }
  // ?demo=1 → a fake 2.5-minute battle with simulated captures (no backend, nothing saved)
  var DEMO = /[?&]demo=1/.test(location.search) ? demoEngine() : null;
  function rpc(fn, a){ return DEMO ? Promise.resolve(DEMO(fn, a || {})) : AUTH.rpc(fn, a || {}); }
  function demoEngine(){
    var TEAMS = [{ id:"r", name:"Red Rockets", color:"#ff5d73" }, { id:"b", name:"Blue Byte", color:"#3a86ff" }, { id:"g", name:"Green Ghosts", color:"#2ec27e" }];
    var NAMES = { r:["maya","jordan","eli","sofia","nate"], b:["ava","liam","zoe","owen","kai"], g:["noah","ruby","finn","isla","leo"] };
    var FLAGS = ["Phishing Spotter","Caesar Shift","Port Scan Basics","Password Entropy","CIA Triad Match","Firewall Rules","Hash It Out","Social Engineering","Packet Path","Least Privilege"];
    var PETS = ["p_cat","p_duck","p_owl","p_robot","p_lion","p_dragon", null, null];
    var t0, P, caps, status, ends, dbl, awards;
    function reset(){ t0 = Date.now(); ends = t0 + 150000; dbl = t0 + 40000; status = "live"; caps = []; awards = null;
      P = []; TEAMS.forEach(function(t){ NAMES[t.id].forEach(function(h){ P.push({ team: t.id, handle: h, points: 0, caps: 0, mvp: false, xp: 0, left: false, eq: { pet: PETS[Math.floor(Math.random() * PETS.length)] } }); }); }); }
    reset();
    var bias = { r: 1, b: .7, g: .5 };
    function step(){
      var now = Date.now();
      if (status !== "live") { if (now - ends > 25000) { TEAMS.forEach(function(t){ t.won = false; }); reset(); } return; }   // demo loops: podium 25s, then a new battle
      if (now >= ends) { finish(); return; }
      var el = (now - t0) / 1000; bias.g = el > 70 ? 1.6 : .5; bias.b = el > 100 ? 1.3 : .7;   // scripted comeback + lead changes
      var n = Math.random() < .35 ? 2 : 1;
      for (var i = 0; i < n; i++) {
        var tm = pickW(), pl = NAMES[tm][Math.floor(Math.random() * 5)], p = P.filter(function(x){ return x.handle === pl; })[0];
        var lvl = Math.random() < .25 ? 3 : Math.random() < .5 ? 2 : 1, x2 = now >= dbl && now < dbl + 30000, pts = x2 ? lvl * 2 : lvl;
        p.points += pts; p.caps++; caps.push({ team: tm, handle: pl, title: FLAGS[Math.floor(Math.random() * FLAGS.length)] + " (" + ["","Easy","Medium","Hard"][lvl] + ")", pts: pts, dbl: x2, base: lvl, at: new Date(now - i * 300).toISOString(), eq: p.eq });
      }
    }
    function pickW(){ var tot = 0, k; for (k in bias) tot += bias[k]; var r = Math.random() * tot; for (k in bias) { r -= bias[k]; if (r <= 0) return k; } return "r"; }
    function teams(){ return TEAMS.map(function(t){ var m = P.filter(function(p){ return p.team === t.id; }), pl = m.filter(function(p){ return p.caps > 0; }), tot = m.reduce(function(a, p){ return a + p.points; }, 0);
      return { id: t.id, name: t.name, color: t.color, won: t.won || false, total: tot, members: m.length, played: pl.length, avg: pl.length ? Math.round(tot / pl.length * 100) / 100 : 0 }; }).sort(function(a, b){ return b.avg - a.avg; }); }
    function finish(){
      status = "done"; var T = teams(), top = T[0].avg; TEAMS.forEach(function(t){ t.won = T.some(function(x){ return x.id === t.id && x.avg === top; }); });
      TEAMS.forEach(function(t){ var m = P.filter(function(p){ return p.team === t.id; }), mx = Math.max.apply(null, m.map(function(p){ return p.points; })); m.forEach(function(p){ p.mvp = p.points === mx && mx > 0; p.xp = p.caps ? (t.won ? 15 : 5) : 0; }); });
      var hard = {}; caps.forEach(function(c){ if (c.base === 3) hard[c.handle] = (hard[c.handle] || 0) + 1; });
      var hk = Object.keys(hard).sort(function(a, b){ return hard[b] - hard[a]; })[0], last = caps.filter(function(c){ return new Date(c.at).getTime() >= ends - 60000; }).pop();
      function tOf(h){ return P.filter(function(p){ return p.handle === h; })[0].team; }
      awards = { first: caps[0] && { handle: caps[0].handle, team: caps[0].team, secs: Math.round((new Date(caps[0].at) - t0) / 1000) },
        hard: hk && { handle: hk, team: tOf(hk), n: hard[hk] }, clutch: last && { handle: last.handle, team: last.team, secs: Math.max(0, Math.round((ends - new Date(last.at)) / 1000)), title: last.title } };
    }
    return function(fn, a){
      if (fn === "ctf_t_classes") return [{ id: "demo", name: "Demo class (preview)", course: "cyber2" }];
      if (fn === "ctf_t_tb_setup") return { teams: TEAMS.map(function(t){ return { id: t.id, name: t.name, color: t.color, members: 5 }; }), ungrouped: [], manifest: [{ module: 1, flags: 30 }, { module: 2, flags: 28 }], battle: null };
      if (fn === "ctf_t_tb_start") { TEAMS.forEach(function(t){ t.won = false; }); reset(); return { ok: true }; }
      if (fn === "ctf_t_tb_end") { if (a.p_award) finish(); else status = "cancelled"; return { ok: true }; }
      if (fn === "ctf_t_tb_randomize") return { ok: true };
      if (/^ctf_t_squadset_/.test(fn)) return fn === "ctf_t_squadset_list" ? [] : { ok: true };
      if (fn === "ctf_t_tb_state") {
        step();
        return { now: new Date().toISOString(), battle: { id: "demo-" + t0, status: status, modules: [1, 2], minutes: 2.5, started_at: new Date(t0).toISOString(), ends_at: new Date(ends).toISOString(), dbl_at: new Date(dbl).toISOString(),
          teams: teams(), players: P.slice().sort(function(a, b){ return b.points - a.points; }), feed: caps.slice(-12).reverse(), awards: status === "done" ? awards : null } };
      }
      return {};
    };
  }
  var WR = window.WROOM ? WROOM.attach({ kind: "team", teams: function(){ return SET && window.TEAM_PICK ? TEAM_PICK.chosen(SET.teams.filter(function(t){ return t.members > 0; })) : null; }, rpc: function(fn, a){ return rpc(fn, a); }, classId: function(){ return CUR && CUR.id; }, demo: !!DEMO }) : null;
  function wrBtn(){ return WR ? WR.label() : null; }
  function fail(e){ busy = false; msg = /tb_|function/.test(String(e && e.message)) ? "Run supabase/team-battles.sql first." : "Something went wrong: " + (e && e.message || e); paint(); }

  // team-picker.js missing (not uploaded / cached) → plain list, every team plays
  if (!window.TEAM_PICK) window.TEAM_PICK = { sync: function(){}, fetchSets: function(){}, bind: function(){}, note: function(){ return ""; },
    chosen: function(T){ return (T || []).map(function(t){ return t.id; }); },
    setsBar: function(){ return '<div style="margin-top:14px;font-size:12px;color:var(--bad);">Upload team-picker.js to pick teams and save team sets.</div>'; },
    teams: function(T, col){ return T.length ? T.map(function(t, i){ return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border2);"><span style="width:14px;height:14px;border-radius:4px;background:' + esc(col(t,i)) + ';"></span><b style="flex:1;color:var(--bright);">' + esc(t.name) + '</b><span class="mono" style="font-size:12px;color:var(--dim);">' + t.members + ' students</span></div>'; }).join("") : '<div style="color:var(--dim);font-size:14px;">No teams yet.</div>'; } };
  function setupView(){
    var T = SET.teams.filter(function(t){ return t.members > 0; }), un = SET.ungrouped || [], M = SET.manifest || [];
    var selMods = Object.keys(pick).filter(function(m){ return pick[m]; });
    var TP = window.TEAM_PICK; TP.fetchSets(rpc, CUR.id, paint);
    var ch = TP.chosen(T), ready = ch.length >= 2 && ch.length <= 4 && selMods.length && !busy;
    var teams = TP.teams(T, col, busy) + TP.note(T);
    return (WR ? WR.html() : '') + '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;" id="g">' +
      '<div class="card"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:12px;">TEAMS \u00b7 TICK WHO PLAYS</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px;">' + teams + '</div>' +
        (un.length ? '<div role="alert" style="margin-top:12px;font-size:13px;color:var(--amber);font-weight:700;">' + un.length + ' student' + (un.length>1?"s aren\u2019t":" isn\u2019t") + ' on a team and will sit out: ' + esc(un.slice(0,8).join(", ")) + (un.length > 8 ? "\u2026" : "") + '</div>' : '') +
        
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;"><span style="font-size:14px;color:var(--bright);font-weight:700;">Randomize teams:</span>' +
          [2,3,4].map(function(n){ return '<button type="button" class="btn ghost tbRand" data-n="' + n + '"' + (busy ? " disabled" : "") + '>' + n + ' teams</button>'; }).join("") + '</div>' +
        '<div style="font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5;">Randomizing reshuffles every student in this class into the first squads (creates Team A\u2013D if needed). Students see squad names once the battle starts.</div>' + TP.setsBar(busy) + '</div>' +
      '<div class="card"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:12px;">BATTLE OPTIONS</div>' +
        '<div style="font-weight:700;color:var(--bright);margin-bottom:10px;">Modules that count</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">' + (M.length ? M.map(function(m){ return '<button type="button" class="chip tbMod" data-m="' + m.module + '" aria-pressed="' + !!pick[m.module] + '">' + esc(modName(m.module)) + '</button>'; }).join("") : '<span style="color:var(--dim);font-size:13px;">Open this class in teacher.html once to publish its flags.</span>') + '</div>' +
        '<div style="font-weight:700;color:var(--bright);margin-bottom:10px;">Length</div>' +
        '<div role="group" aria-label="Length" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">' + LENGTHS.map(function(l){ return '<button type="button" class="chip tbMin" data-n="' + l[0] + '" aria-pressed="' + (mins === l[0]) + '">' + l[1] + '</button>'; }).join("") + '</div>' +
        '<button type="button" class="btn" id="tbStart" data-wr-start="Start battle"' + (ready ? "" : " disabled") + '>' + (wrBtn() || "Start battle") + '</button>' +
        '<div style="font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5;">Starting turns Squads on, ends any student flag duels in this class, and pauses new ones until the battle ends. Every battle has a clock (15 min if you don\u2019t pick). Students can exit any time; they stop scoring and get no XP. Score = team duel points \u00f7 teammates who captured a flag. Winners +10 XP, everyone who played +5.</div></div></div>' +
      (msg ? '<div role="alert" class="mono" style="margin-top:14px;color:var(--bad);font-weight:700;font-size:13px;">' + esc(msg) + '</div>' : '');
  }
  function battleView(b){
    var T = b.teams || [], max = Math.max.apply(null, T.map(function(t){ return +t.avg; }).concat([1]));
    var byId = {}; T.forEach(function(t, i){ byId[t.id] = { name: t.name, color: col(t, i) }; });
    var live = b.status === "live";
    var winners = T.filter(function(t){ return t.won; }).map(function(t){ return esc(t.name); });
    var head = live
      ? '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;"><div><div class="mono" style="font-size:12px;letter-spacing:1.5px;color:var(--faint);">' + (b.ends_at ? "TIME LEFT" : "NO CLOCK") + '</div><div class="mono" id="clock" style="font-size:64px;font-weight:800;color:var(--bright);line-height:1;">' + (b.ends_at ? "" : "\u221e") + '</div></div>' +
        '<div class="mono" style="flex:1;min-width:200px;font-size:14px;color:var(--muted);">' + (b.modules||[]).map(modName).map(esc).join(" \u00b7 ") + '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;"><button type="button" class="btn" id="tbEnd">End &amp; award</button><button type="button" class="btn ghost" id="tbCancel">Cancel (no XP)</button></div></div>'
      : '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;"><div style="flex:1;min-width:240px;"><div class="mono" style="font-size:12px;letter-spacing:1.5px;color:var(--faint);">' + (b.status === "done" ? "FINAL" : "CANCELLED") + '</div>' +
        '<div style="font-size:44px;font-weight:800;color:var(--bright);line-height:1.1;margin-top:4px;">' + (b.status !== "done" ? "Battle cancelled" : winners.length > 1 ? "Tie! " + winners.join(" & ") : winners.length ? winners[0] + " wins!" : "No team scored") + '</div></div>' +
        '<button type="button" class="btn" id="tbNew">New battle</button></div>';
    var bars = T.map(function(t, i){
      var c = col(t, i), pct = Math.round((+t.avg) / max * 100);
      var mvp = (b.players || []).filter(function(p){ return p.team === t.id && p.mvp; }).map(function(p){ return esc(p.handle); });
      var top = (b.players || []).filter(function(p){ return p.team === t.id; })[0];
      return '<div class="card" id="bar-' + esc(t.id) + '" style="padding:18px 20px;border-color:' + (t.won ? "var(--amber)" : "var(--border)") + ';border-width:' + (t.won ? "2px" : "1px") + ';">' +
        '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;"><span style="width:16px;height:16px;border-radius:4px;background:' + esc(c) + ';align-self:center;"></span>' +
          '<span style="font-size:26px;font-weight:800;color:var(--bright);flex:1;min-width:0;">' + esc(t.name) + (t.won ? ' <span class="mono" style="font-size:14px;color:var(--amber);">\u2605 WINNER</span>' : '') + '</span>' +
          '<span class="mono" style="font-size:40px;font-weight:800;color:var(--bright);">' + (+t.avg).toFixed(1) + '</span><span class="mono" style="font-size:13px;color:var(--dim);">avg</span></div>' +
        '<div role="img" aria-label="' + esc(t.name) + ' average ' + (+t.avg).toFixed(1) + '" style="height:22px;border-radius:999px;background:var(--bg);border:1px solid var(--border2);overflow:hidden;"><div style="height:100%;width:' + pct + '%;background:' + esc(c) + ';border-radius:999px;transition:width .6s ease;"></div></div>' +
        '<div class="mono" style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;"><span>' + t.total + ' pts total</span><span>' + t.played + '/' + t.members + ' played</span>' +
          (b.status === "done" ? (mvp.length ? '<span style="color:var(--bright);font-weight:700;">MVP: ' + mvp.join(", ") + '</span>' : '') : (top && top.points ? '<span>Leading: ' + esc(top.handle) + ' (' + top.points + ')</span>' : '')) + '</div></div>';
    }).join("");
    var feed = (b.feed || []).map(function(f){ var t = byId[f.team] || {}; return '<div class="' + (f._new ? "bfxFeedIn" : "") + '" style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--border2);font-size:15px;border-radius:6px;">' + (FX ? FX.avatar(f.handle, t.color, f.eq) : '') + '<b style="color:var(--bright);">' + esc(f.handle) + '</b>' + (f.dbl ? '<span class="mono" style="font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#ffcf5c;color:#1a1200;">x2</span>' : '') + '<span class="mono" style="font-size:12px;color:var(--dim);">' + esc(t.name || "") + '</span><span style="flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(f.title) + '</span><span class="mono" style="font-weight:800;color:var(--amber);">+' + f.pts + '</span></div>'; }).join("");
    var dbl = live && FX && FX.inDouble(b.dbl_at && new Date(b.dbl_at).getTime(), skew);
    if (b.status === "done" && FX) return results(b, byId) + '<div class="card" style="margin-top:18px;"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:6px;">LAST CAPTURES</div>' + (feed || '<div style="color:var(--dim);font-size:14px;padding-top:6px;">No captures.</div>') + '</div>' + (msg ? '<div role="alert" class="mono" style="margin-top:14px;color:var(--bad);font-weight:700;font-size:13px;">' + esc(msg) + '</div>' : '');
    return '<div class="card" style="margin-bottom:18px;border-color:' + (dbl ? "#ffcf5c" : "var(--amber)") + ';' + (dbl ? "box-shadow:0 0 40px -8px #ffcf5c;" : "") + '">' + head +
        (dbl ? '<div class="mono bfxPulse" style="margin-top:12px;font-size:20px;font-weight:800;color:#ffcf5c;letter-spacing:2px;">★ DOUBLE POINTS LIVE · every capture x2</div>' : '') + '</div>' +
      '<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;" id="g"><div style="display:flex;flex-direction:column;gap:14px;">' + bars + '</div>' +
      '<div class="card"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:6px;">LIVE CAPTURES</div>' + (feed || '<div style="color:var(--dim);font-size:14px;padding-top:6px;">No captures yet.</div>') + '</div></div>' +
      (msg ? '<div role="alert" class="mono" style="margin-top:14px;color:var(--bad);font-weight:700;font-size:13px;">' + esc(msg) + '</div>' : '');
  }
  function mmssS(sec){ sec = Math.max(0, sec|0); return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }
  function results(b, byId){
    var T = b.teams || [], P = b.players || [], A = b.awards || {}, winners = T.filter(function(t){ return t.won; }).map(function(t){ return t.name; });
    var rows = T.map(function(t, i){
      var mv = P.filter(function(p){ return p.team === t.id && p.mvp; }).map(function(p){ return p.handle; });
      return { name: t.name, color: col(t, i), score: (+t.avg).toFixed(1), sub: t.total + " pts · " + t.played + "/" + t.members + " played" + (mv.length ? " · MVP " + mv.join(", ") : "") };
    });
    var won = {}; T.forEach(function(t){ if (t.won) won[t.id] = 1; });
    var top = P.filter(function(p){ return p.mvp; }).sort(function(a, c){ return (c.points - a.points) || ((won[c.team] ? 1 : 0) - (won[a.team] ? 1 : 0)) || (c.caps - a.caps); })[0];
    function tc(id){ return (byId[id] || {}).color; }
    var awards = [
      A.first && { label: "⚡ FASTEST CAPTURE", who: A.first.handle, detail: mmssS(A.first.secs) + " into the battle", color: tc(A.first.team) },
      A.hard && { label: "◆ MOST HARD FLAGS", who: A.hard.handle, detail: A.hard.n + " hard flag" + (A.hard.n > 1 ? "s" : ""), color: tc(A.hard.team) },
      A.clutch && { label: "⏱ CLUTCH CAPTURE", who: A.clutch.handle, detail: "with " + mmssS(A.clutch.secs) + " left", color: tc(A.clutch.team) }
    ];
    var acts = '<div style="display:flex;gap:10px;flex-wrap:wrap;"><button type="button" class="btn" id="tbRematch">Rematch</button>' + (window.PRIZE_ROLL && !DEMO && T.some(function(t){ return t.won; }) ? '<button type="button" class="btn ghost" id="tbPrize">\u2605 Prize roll</button>' : '') + '<button type="button" class="btn ghost" id="tbFull">Full screen</button><button type="button" class="btn ghost" id="tbNew">New battle</button></div>';
    return FX.podium({ kicker: "FINAL · " + (b.modules||[]).map(function(m){ return "M" + String(m).padStart(2,"0"); }).join(" · "),
      title: winners.length > 1 ? "Tie! " + winners.join(" & ") : winners.length ? winners[0] + " wins!" : "No team scored",
      rows: rows, mvp: top && { name: top.handle, detail: top.points + " pts · " + top.caps + " captures", avatar: FX.avatar(top.handle, tc(top.team), top.eq) },
      awards: awards, actions: acts });
  }
  var showSetup = false;
  function paint(){
    if (!CUR) return;
    var b = ST && ST.battle;
    view.innerHTML = (b && (b.status === "live" || !showSetup)) ? battleView(b) : SET && !SET.error ? setupView() : (msg || (SET && SET.error) ? '<div class="card" style="border-color:var(--amber);"><b style="color:var(--bright);">Couldn\u2019t load the battle setup.</b><div class="mono" style="font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6;">' + esc(msg || ("Error: " + SET.error)) + '<br>Check that <b>supabase/team-battles.sql</b> has been run (install-check.html), then reload.</div></div>' : '<div class="card mono" style="color:var(--dim);">Loading&hellip;</div>');
    var g = document.getElementById("g"); if (g && innerWidth < 900) g.style.gridTemplateColumns = "1fr";
    bind(); clock(); prizeAuto();
  }
  // 31.3: winning squad rolls a class prize (no test bonus / graded bonus / homework pass)
  function prizeList(b){
    var W = (b.teams || []).filter(function(t){ return t.won; });
    return Promise.all(W.map(function(t){ return PRIZE_ROLL.squadIds(rpc, CUR.id, t.id).then(function(ids){
      return { key: "tb:" + b.id + ":" + t.id, cls: CUR.id, ids: ids, who: t.name, pool: "squad", title: "Team Battle winners" }; }); }));
  }
  function prizeAuto(){
    var b = ST && ST.battle; if (DEMO || !window.PRIZE_ROLL || !b || b.status !== "done" || !(b.teams || []).some(function(t){ return t.won; })) return;
    if (prizeAuto.k === b.id) return; prizeAuto.k = b.id;
    prizeList(b).then(function(L){ PRIZE_ROLL.auto("tb:" + b.id, L, b.finished_at || b.ends_at); });
  }
  function bind(){
    var pz = document.getElementById("tbPrize"); if (pz) pz.onclick = function(){ prizeList(ST.battle).then(function(L){ if (!PRIZE_ROLL.open(L)) { msg = "Every prize for this battle has been rolled."; paint(); } }); };
    if (window.TEAM_PICK) TEAM_PICK.bind(view, { rpc: rpc, reload: load, repaint: paint, err: function(m){ msg = m; paint(); } });
    if (WR) WR.bind(view);
    view.querySelectorAll(".tbMod").forEach(function(b){ b.onclick = function(){ var m = b.getAttribute("data-m"); pick[m] = !pick[m]; msg = ""; paint(); }; });
    view.querySelectorAll(".tbMin").forEach(function(b){ b.onclick = function(){ mins = +b.getAttribute("data-n"); paint(); }; });
    view.querySelectorAll(".tbRand").forEach(function(b){ b.onclick = function(){
      var n = +b.getAttribute("data-n");
      if (!confirm("Shuffle every student in " + CUR.name + " into " + n + " random teams? This replaces their current squads.")) return;
      busy = true; msg = ""; paint();
      rpc("ctf_t_tb_randomize", { p_class: CUR.id, p_n: n }).then(function(r){ busy = false; if (!r || r.error) msg = ERR[r && r.error] || "Couldn\u2019t randomize."; load(); }).catch(fail);
    }; });
    var s = document.getElementById("tbStart"); if (s) s.onclick = function(){
      var mods = Object.keys(pick).filter(function(m){ return pick[m]; }).map(Number);
      var groups = TEAM_PICK.chosen(SET.teams.filter(function(t){ return t.members > 0; }));
      if (WR && WR.needsRoom()) { WR.openRoom(); return; }   // 29.2: class duels always go through the waiting room
      busy = true; msg = ""; paint();
      (WR ? WR.go : function(f){ f(function(){}); })(function(done){
        rpc("ctf_t_tb_start", { p_class: CUR.id, p_modules: mods, p_minutes: mins || 15, p_groups: groups }).then(function(r){
          busy = false; var ok = r && !r.error; done(ok); if (!ok) { msg = ERR[r && r.error] || "Couldn\u2019t start (" + ((r && r.error) || "error") + ")."; paint(); return; }
          showSetup = false; load();
        }).catch(function(e){ done(false); fail(e); });
      });
    };
    var e = document.getElementById("tbEnd"); if (e) e.onclick = function(){ if (!confirm("End the battle now and award XP?")) return; rpc("ctf_t_tb_end", { p_battle: ST.battle.id, p_award: true }).then(load).catch(fail); };
    var c = document.getElementById("tbCancel"); if (c) c.onclick = function(){ if (!confirm("Cancel the battle? No XP is awarded.")) return; rpc("ctf_t_tb_end", { p_battle: ST.battle.id, p_award: false }).then(load).catch(fail); };
    var n = document.getElementById("tbNew"); if (n) n.onclick = function(){ showSetup = true; msg = ""; paint(); };
    var rm = document.getElementById("tbRematch"); if (rm) rm.onclick = function(){
      var ob = ST.battle; if (!confirm("Start a rematch with the same teams, modules and length?")) return;
      busy = true; rpc("ctf_t_tb_start", { p_class: CUR.id, p_modules: ob.modules, p_minutes: ob.minutes || 15, p_groups: (ob.teams || []).map(function(t){ return t.id; }) }).then(function(r){ busy = false; if (!r || r.error) { msg = ERR[r && r.error] || "Couldn’t start (" + ((r && r.error) || "error") + ")."; showSetup = true; paint(); return; } showSetup = false; load(); }).catch(fail);
    };
    var fu = document.getElementById("tbFull"); if (fu) fu.onclick = function(){ FX.fullscreen(document.getElementById("bfxResults")); };
  }
  function clock(){
    var el = document.getElementById("clock"), b = ST && ST.battle; if (!el || !b || !b.ends_at || b.status !== "live") return;
    var left = new Date(b.ends_at).getTime() - (Date.now() + skew);
    el.textContent = mmss(left); el.style.color = left < 60000 ? "var(--amber)" : "var(--bright)";
    if (FX) FX.clock(b.id, left, { el: el, music: true, dblAt: b.dbl_at && new Date(b.dbl_at).getTime(), skew: skew });
    if (left <= 0 && !clock._w) { clock._w = 1; setTimeout(function(){ clock._w = 0; load(); }, 1500); }
  }
  function load(){
    clearTimeout(timer); if (!CUR) return;
    var id = CUR.id;
    Promise.all([rpc("ctf_t_tb_state", { p_class: id }), rpc("ctf_t_tb_setup", { p_class: id })]).then(function(r){
      if (!CUR || CUR.id !== id) return;
      if (r[0] && r[0].error) { view.innerHTML = '<div class="card">Sign in on the <a href="teacher.html">teacher dashboard</a> first.</div>'; return; }
      ST = r[0]; SET = r[1]; if (!SET) msg = msg || "No setup data came back."; if (ST.now) skew = new Date(ST.now).getTime() - Date.now();
      var b = ST.battle;
      if (b && b.id !== curBattle) { if (curBattle && FX) FX.reset(curBattle); curBattle = b.id; seenAt = (b.feed || []).reduce(function(m, f){ return Math.max(m, new Date(f.at).getTime()); }, 0); }
      else if (b) (b.feed || []).forEach(function(f){ if (new Date(f.at).getTime() > seenAt) f._new = true; });
      if (b) seenAt = (b.feed || []).reduce(function(m, f){ return Math.max(m, new Date(f.at).getTime()); }, seenAt);
      paint();
      if (b && FX && !(showSetup && b.status !== "live")) {
        var T = b.teams || [];
        var ev = FX.track(b.id, { status: b.status,
          teams: T.map(function(t, i){ return { id: t.id, name: t.name, color: col(t, i), score: +t.avg }; }),
          feed: (b.feed || []).map(function(f){ return { who: f.handle, team: f.team, at: f.at, pts: f.pts, hard: (f.dbl ? f.pts / 2 : f.pts) === 3 }; }) }, { streakBy: "team" });
        ev.changed.forEach(function(id){ var el = document.getElementById("bar-" + id); if (el) FX.shake(el); });
      }
      if (b) (b.feed || []).forEach(function(f){ delete f._new; });
      timer = setTimeout(load, ST.battle && ST.battle.status === "live" ? 3000 : 15000);
    }).catch(function(e){ fail(e); timer = setTimeout(load, 15000); });
  }
  function pickClass(id){
    CUR = CLASSES.filter(function(c){ return c.id === id; })[0] || CLASSES[0]; if (!CUR) return;
    try { localStorage.setItem("battle-class", CUR.id); } catch (e) {}
    sel.value = CUR.id; pick = {}; ST = null; SET = null; showSetup = false; msg = ""; if (WR) WR.reload();
    if (FX && FX.setGuide) { var gc = (((window.COURSE_CONFIG || {})[CUR.course] || {}).ctf) || {}; FX.setGuide({ name: gc.adversary || "NEMESIS", color: gc.adversaryColor || "#ff4d6d", mentor: !!gc.mentor }); }
    load();
  }
  // keep the header clear of the fixed theme + A11Y buttons (site.js places A11Y left of the toggle)
  function clearFixed(){
    var hdr = document.getElementById("hdr"), minLeft = innerWidth;
    document.querySelectorAll("#themeToggle, #siteA11yBtn").forEach(function(b){ var r = b.getBoundingClientRect(); if (r.width && r.top < 60 && r.left < minLeft) minLeft = r.left; });
    hdr.style.paddingRight = (minLeft < innerWidth ? innerWidth - minLeft + 12 - (innerWidth - document.querySelector(".wrap").getBoundingClientRect().right) : 0) + "px";
  }
  window.addEventListener("resize", clearFixed); setTimeout(clearFixed, 0); setTimeout(clearFixed, 600);
  setInterval(clock, 500);
  (async function(){
    if (DEMO) { var dn = document.createElement("div"); dn.className = "mono"; dn.setAttribute("role", "note"); dn.style.cssText = "margin:-6px 0 14px;font-size:12px;color:var(--amber);"; dn.textContent = "PREVIEW MODE · fake teams and captures, nothing is saved. A 2\u00bd-minute battle plays on a loop. Click anywhere once to turn on sound."; document.getElementById("hdr").after(dn); }
    if (!DEMO && (!AUTH || !AUTH.online)) { view.innerHTML = '<div class="card">Connect the class backend (supabase-config.js) first.</div>'; return; }
    try { CLASSES = await rpc("ctf_t_classes") || []; } catch (e) { CLASSES = null; }
    if (!Array.isArray(CLASSES)) { view.innerHTML = '<div class="card">Sign in on the <a href="teacher.html">teacher dashboard</a> to run team battles.</div>'; return; }
    if (!CLASSES.length) { view.innerHTML = '<div class="card">No classes yet.</div>'; return; }
    sel.innerHTML = CLASSES.map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join("");
    function bgAuto(){ if (!window.BATTLE_BG) return; if (CUR && !(typeof DEMO !== "undefined" && DEMO)) BATTLE_BG.auto("projector", { cls: CUR.id }); else BATTLE_BG.use("projector", null); }
    sel.onchange = function(){ pickClass(sel.value); bgAuto(); };
    var want = new URLSearchParams(location.search).get("class"); try { want = want || localStorage.getItem("battle-class"); } catch (e) {}
    pickClass(want); bgAuto();
  })();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
})();
</script>
<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'◐ DARK':'◑ LIGHT';}window.__toggleTheme=function(){var t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem(K,t);}catch(e){}lbl();};lbl();})();</script>
