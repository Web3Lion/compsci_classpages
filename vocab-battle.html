<style>
:root{--bg:#0a0e14;--panel:#0b1220;--panel2:#0c1626;--border:#1e3350;--border2:#172436;--border3:#244a6d;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--accent:#00b3ff;--accent2:#7dd8ff;--ok:#3ddc97;--bad:#ff7a85;--adv:#ff3b3b;--adv2:#ff8080;--advglow:#ff0033;--advtext:var(--adv2);}
:root[data-theme="light"]{--bg:#e9eef5;--panel:#ffffff;--panel2:#f2f6fb;--border:#cdd8e5;--border2:#dde5ef;--border3:#b6c8dc;--text:#26313f;--bright:#0e1622;--muted:#48566a;--dim:#5f7186;--faint:#8394a8;--accent:#0a74d6;--accent2:#075aa8;--ok:#1d7a4c;--bad:#b3261e;--advtext:var(--bright);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);}
a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent2);}
.mono{font-family:'JetBrains Mono',monospace;}
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px;}
.card{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:22px;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.btn{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;min-height:44px;padding:10px 18px;border-radius:10px;border:2px solid var(--adv);background:var(--adv);color:#0b0306;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--bright);border-color:var(--border3);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.chip{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:transparent;color:var(--dim);cursor:pointer;}
.chip[aria-pressed="true"]{border-color:var(--adv);color:var(--bright);box-shadow:inset 0 0 0 1px var(--adv);}
.chip[aria-pressed="true"]::before{content:"\2713  ";}
select{font:inherit;font-size:15px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--border3);background:var(--bg);color:var(--bright);}
.mhp{height:8px;border-radius:999px;background:var(--bg);border:1px solid var(--border2);overflow:hidden;}
.mhp > div{height:100%;transition:width .35s ease;}
</style>
</head>
<body>
<button id="themeToggle" class="themebtn" onclick="__toggleTheme()">LIGHT</button>
<div class="wrap">
  <div id="hdr" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 18px;">
    <a href="teacher.html" class="mono" style="font-size:12px;color:var(--dim);padding:13px 4px;min-height:44px;display:inline-flex;align-items:center;">&larr; Teacher dashboard</a>

<script>
(function(){
  var AUTH = window.CTF_AUTH, view = document.getElementById("view"), sel = document.getElementById("cls"), FX = window.BATTLE_FX;
  var seenAt = 0, curSess = null;
  if (FX) { FX.enableSound(true); FX.soundUi(document.getElementById("snd")); }
  var VG = { cyber1:"CY1_VOCAB", cyber2:"CY2_VOCAB", cyber3:"CY3_VOCAB", apcsp:"APCSP_VOCAB", web3:"WEB3_VOCAB" };
  var CLASSES = [], CUR = null, SET = null, ST = null, skew = 0, msg = "", busy = false, pick = {}, mins = 15, timer = null, showSetup = false, MODS = {}, qset = "vocab";
  var BIN = window.BINARY_SET;
  var PMODES = [["cipher","Cipher"],["unscramble","Scramble"],["decrypt","Decrypt"],["bank","Word bank"]], modes = { cipher: true, unscramble: true, decrypt: true, bank: true };
  function nModes(){ return PMODES.filter(function(p){ return modes[p[0]]; }).length; }
  function modeList(){ return PMODES.filter(function(p){ return modes[p[0]]; }).map(function(p){ return p[0]; }); }
  var LENGTHS = [[5,"5 min"],[10,"10 min"],[15,"15 min (default)"],[20,"20 min"],[45,"Whole period"]], FALLBACK = ["#3a86ff","#ff5d73","#2ec27e","#f4a300"];
  var ERR = { ungrouped:"Every student needs a team first. Use Randomize teams, or put them in a squad on the teacher dashboard.", need_two_teams:"You need at least 2 teams with students in them.",
    too_many_teams:"Battles take 2\u20134 teams. Use Randomize teams.", too_few_terms:"Pick modules with at least 4 vocab terms.", battle_live:"A vocab battle is already running in this class." };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }
  function norm(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function disp(t){ return String(t || "").replace(/\(.*?\)/g, "").split("/")[0].trim(); }
  function mmss(ms){ ms = Math.max(0, ms); var s = Math.ceil(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  function guide(){ return (((window.COURSE_CONFIG||{})[CUR.course]||{}).ctf)||{}; }
  function modName(m){ if (+m === 0) return "Binary"; var n = (guide().modules || [])[m-1]; return "Module " + String(m).padStart(2,"0") + (n ? " \u00b7 " + n : ""); }
  function col(t, i){ return (t && t.color) || FALLBACK[i % 4]; }
  function rpc(fn, a){ return AUTH.rpc(fn, a || {}); }
  var WR = window.WROOM ? WROOM.attach({ kind: "vocab", teams: function(){ return SET && window.TEAM_PICK ? TEAM_PICK.chosen(SET.teams.filter(function(t){ return t.members > 0; })) : null; }, rpc: function(fn, a){ return rpc(fn, a); }, classId: function(){ return CUR && CUR.id; }, demo: false }) : null;
  function wrBtn(){ return WR ? WR.label() : null; }
  function fail(e){ busy = false; msg = /vd_|function/.test(String(e && e.message)) ? "Run supabase/vocab-duels.sql first." : /tb_randomize/.test(String(e && e.message)) ? "Randomize needs supabase/team-battles.sql." : "Something went wrong: " + (e && e.message || e); paint(); }
  function theme(){
    var g = guide(), r = document.documentElement;
    ["adv","adv2","advglow"].forEach(function(k, i){ var v = [g.adversaryColor, g.adversaryColor2, g.adversaryGlow][i]; if (v) r.style.setProperty("--" + k, v); else r.style.removeProperty("--" + k); });
    document.getElementById("ttl").textContent = ((g.mentor ? "\u25c6 " : "\u2620 ") + (g.adversary || "NEMESIS") + (g.mentor ? " REFEREES \u00b7 " : "\u2019S ARENA \u00b7 ") + "VOCAB BATTLE");
  }
  function loadVocab(c){
    return new Promise(function(res){
      if (window[VG[c]]) return res();
      var s = document.createElement("script"); s.src = c + "/vocab-data.js?v=34.1.0"; s.onload = s.onerror = function(){ res(); }; document.head.appendChild(s);
    }).then(function(){
      MODS = {}; ((window[VG[c]] || {}).terms || []).forEach(function(t){ var k = norm(disp(t.t)); if (k.length < 3 || k.length > 24) return; (MODS[t.m] = MODS[t.m] || []).push(t); });
    });
  }

  // team-picker.js missing (not uploaded / cached) → plain list, every team plays
  if (!window.TEAM_PICK) window.TEAM_PICK = { sync: function(){}, fetchSets: function(){}, bind: function(){}, note: function(){ return ""; },
    chosen: function(T){ return (T || []).map(function(t){ return t.id; }); },
    setsBar: function(){ return '<div style="margin-top:14px;font-size:12px;color:var(--bad);">Upload team-picker.js to pick teams and save team sets.</div>'; },
    teams: function(T, col){ return T.length ? T.map(function(t, i){ return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border2);"><span style="width:14px;height:14px;border-radius:4px;background:' + esc(col(t,i)) + ';"></span><b style="flex:1;color:var(--bright);">' + esc(t.name) + '</b><span class="mono" style="font-size:12px;color:var(--dim);">' + t.members + ' students</span></div>'; }).join("") : '<div style="color:var(--dim);font-size:14px;">No teams yet.</div>'; } };
  function setupView(){
    var T = SET.teams.filter(function(t){ return t.members > 0; }), un = SET.ungrouped || [];
    var keys = Object.keys(MODS).map(Number).sort(function(a,b){return a-b;}), selM = keys.filter(function(m){ return pick[m]; });
    var n = selM.reduce(function(a, m){ return a + MODS[m].length; }, 0), bin = qset === "binary" && BIN;
    if (bin) n = 510;
    var TP = window.TEAM_PICK; TP.fetchSets(rpc, CUR.id, paint);
    var ch = TP.chosen(T), ready = ch.length >= 2 && ch.length <= 4 && n >= 4 && (bin || nModes()) && !busy;
    var teams = TP.teams(T, col, busy) + TP.note(T);
    return (WR ? WR.html() : '') + '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;" id="g">' +
      '<div class="card"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:12px;">TEAMS \u00b7 TICK WHO PLAYS</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px;">' + teams + '</div>' +
        (un.length ? '<div role="alert" style="margin-top:12px;font-size:13px;color:var(--amber);font-weight:700;">' + un.length + ' student' + (un.length>1?"s aren\u2019t":" isn\u2019t") + ' on a team and will sit out: ' + esc(un.slice(0,8).join(", ")) + (un.length > 8 ? "\u2026" : "") + '</div>' : '') +
        
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;"><span style="font-size:14px;color:var(--bright);font-weight:700;">Randomize teams:</span>' +
          [2,3,4].map(function(k){ return '<button type="button" class="btn ghost vbRand" data-n="' + k + '"' + (busy ? " disabled" : "") + '>' + k + ' teams</button>'; }).join("") + '</div>' + TP.setsBar(busy) + '</div>' +
      '<div class="card"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:12px;">BATTLE OPTIONS</div>' +
        (BIN ? '<div style="font-weight:700;color:var(--bright);margin-bottom:10px;">Question set</div>' +
          '<div role="group" aria-label="Question set" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">' + [["vocab","Vocab"],["binary","Binary"]].map(function(q){ return '<button type="button" class="chip vbQs" data-q="' + q[0] + '" aria-pressed="' + (qset === q[0]) + '">' + q[1] + '</button>'; }).join("") + '</div>' : '') +
        (bin ? '<div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;">Each fight question is random: 8-bit conversions (decimal \u2192 binary, students type all 8 bits, or binary \u2192 decimal) mixed with binary concepts \u2014 the largest value or number of values for N bits/bytes, even or odd from a partial pattern like ? ? ? 1, the number before or after a binary value, bits \u2194 bytes, and the fewest bits needed for a number. Fresh numbers every battle. No puzzle disguise; students just type the answer.</div>' :
        '<div style="font-weight:700;color:var(--bright);margin-bottom:10px;">Vocab modules</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">' + (keys.length ? keys.map(function(m){ return '<button type="button" class="chip vbMod" data-m="' + m + '" aria-pressed="' + !!pick[m] + '">' + esc(modName(m)) + ' <span style="color:var(--dim);font-weight:500;">\u00b7 ' + MODS[m].length + '</span></button>'; }).join("") : '<span style="color:var(--dim);">No vocab list found for this course.</span>') + '</div>' +
        '<div style="font-weight:700;color:var(--bright);margin-bottom:10px;">Puzzle types</div>' +
        '<div role="group" aria-label="Puzzle types" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;">' + PMODES.map(function(p){ var on = !!modes[p[0]]; return '<button type="button" class="chip vbPm" data-p="' + p[0] + '" aria-pressed="' + on + '">' + (on ? "\u2713 " : "") + p[1] + '</button>'; }).join("") + '</div>' +
        '<div style="font-size:12px;color:var(--dim);margin-bottom:18px;">Each term uses one of the ticked types at random.' + (nModes() ? '' : ' <b style="color:var(--bad);">Pick at least one.</b>') + '</div>') +
        '<div style="font-weight:700;color:var(--bright);margin-bottom:10px;">Length</div>' +
        '<div role="group" aria-label="Length" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">' + LENGTHS.map(function(l){ return '<button type="button" class="chip vbMin" data-n="' + l[0] + '" aria-pressed="' + (mins === l[0]) + '">' + l[1] + '</button>'; }).join("") + '</div>' +
        '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;"><button type="button" class="btn" id="vbStart" data-wr-start="Start battle"' + (ready ? "" : " disabled") + '>' + (wrBtn() || "Start battle") + '</button><span class="mono" style="font-size:12px;color:var(--dim);">' + (bin ? "Random binary questions" : n ? n + " terms" : "Pick at least one module") + '</span></div>' +
        '<div style="font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6;">Students open <b>Vocab Duel</b> from their arena. Everyone on the page is paired with someone from another team; after each KO they get a new opponent. Each pair gets a different term. Correct = 25% hit, wrong = a third of a hit to yourself. Score = team KOs \u00f7 teammates who fought. Winners +10 XP, every fighter +5. Starting turns Squads on and ends 1v1 vocab duels in this class.</div></div></div>' +
      (msg ? '<div role="alert" class="mono" style="margin-top:14px;color:var(--bad);font-weight:700;font-size:13px;">' + esc(msg) + '</div>' : '');
  }
  function battleView(s){
    var T = s.teams || [], max = Math.max.apply(null, T.map(function(t){ return +t.avg; }).concat([1])), byId = {};
    T.forEach(function(t, i){ byId[t.id] = { name: t.name, color: col(t, i) }; });
    var live = s.status === "live", winners = T.filter(function(t){ return t.won; }).map(function(t){ return esc(t.name); });
    var head = live
      ? '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;"><div><div class="mono" style="font-size:12px;letter-spacing:1.5px;color:var(--faint);">TIME LEFT</div><div class="mono" id="clock" style="font-size:64px;font-weight:800;color:var(--bright);line-height:1;"></div></div>' +
        '<div style="flex:1;min-width:200px;"><div class="mono" style="font-size:14px;color:var(--muted);">' + (s.modules||[]).map(modName).map(esc).join(" \u00b7 ") + '</div><div class="mono" style="font-size:13px;color:var(--dim);margin-top:6px;">' + s.present + ' on the page \u00b7 ' + (s.fights||[]).length + ' fights live</div></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;"><button type="button" class="btn" id="vbEnd">End &amp; award</button><button type="button" class="btn ghost" id="vbCancel">Cancel (no XP)</button></div></div>'
      : '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;"><div style="flex:1;min-width:240px;"><div class="mono" style="font-size:12px;letter-spacing:1.5px;color:var(--faint);">' + (s.status === "done" ? "FINAL" : "CANCELLED") + '</div>' +
        '<div style="font-size:44px;font-weight:800;color:var(--bright);line-height:1.1;margin-top:4px;">' + (s.status !== "done" ? "Battle cancelled" : winners.length > 1 ? "Tie! " + winners.join(" & ") : winners.length ? winners[0] + " wins!" : "No KOs") + '</div></div>' +
        '<button type="button" class="btn" id="vbNew">New battle</button></div>';
    var bars = T.map(function(t, i){
      var c = col(t, i), pct = Math.round((+t.avg) / max * 100);
      var mvp = (s.leaders || []).filter(function(p){ return p.team === t.id && p.mvp; }).map(function(p){ return esc(p.handle); });
      return '<div class="card" id="bar-' + esc(t.id) + '" style="padding:18px 20px;border-color:' + (t.won ? "var(--adv)" : "var(--border)") + ';border-width:' + (t.won ? "2px" : "1px") + ';">' +
        '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;"><span style="width:16px;height:16px;border-radius:4px;background:' + esc(c) + ';align-self:center;"></span>' +
          '<span style="font-size:26px;font-weight:800;color:var(--bright);flex:1;min-width:0;">' + esc(t.name) + (t.won ? ' <span class="mono" style="font-size:14px;color:var(--advtext);">\u2605 WINNER</span>' : '') + '</span>' +
          '<span class="mono" style="font-size:40px;font-weight:800;color:var(--bright);">' + (+t.avg).toFixed(2) + '</span><span class="mono" style="font-size:13px;color:var(--dim);">KOs/fighter</span></div>' +
        '<div role="img" aria-label="' + esc(t.name) + ' ' + (+t.avg).toFixed(2) + ' KOs per fighter" style="height:22px;border-radius:999px;background:var(--bg);border:1px solid var(--border2);overflow:hidden;"><div style="height:100%;width:' + pct + '%;background:' + esc(c) + ';border-radius:999px;transition:width .6s ease;"></div></div>' +
        '<div class="mono" style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;"><span>' + t.kos + ' KOs</span><span>' + t.fought + '/' + t.members + ' fought</span>' + (mvp.length ? '<span style="color:var(--bright);font-weight:700;">MVP: ' + mvp.join(", ") + '</span>' : '') + '</div></div>';
    }).join("");
    var fights = live ? '<div class="card" style="margin-top:18px;"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:10px;">LIVE FIGHTS</div>' +
      ((s.fights || []).length ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;">' + s.fights.map(function(f){
        var A = byId[f.ta] || {}, B = byId[f.tb] || {};
        function side(h, hp, c){ return '<div style="flex:1;min-width:0;"><div style="display:flex;justify-content:space-between;gap:6px;font-size:13px;"><b style="color:var(--bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(h) + '</b><span class="mono" style="color:var(--dim);">' + Math.round(hp/3) + '%</span></div>' + (FX ? '<div style="margin-top:4px;">' + FX.bossBar("x" + Math.random().toString(36).slice(2, 8), Math.round(hp/3), esc(c || "#7f9cb8"), h + " health") + '</div>' : '<div class="mhp" style="margin-top:4px;"><div style="width:' + Math.round(hp/3) + '%;background:' + esc(c || "var(--dim)") + ';"></div></div>') + '</div>'; }
        return '<div style="display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--border2);">' + side(f.a, f.hpa, A.color) + '<span class="mono" style="font-size:11px;color:var(--faint);">VS</span>' + side(f.b, f.hpb, B.color) + '</div>';
      }).join("") + '</div>' : '<div style="color:var(--dim);font-size:14px;">Waiting for students to open Vocab Duel.</div>') + '</div>' : '';
    var feed = (s.feed || []).map(function(k){ var t = byId[k.team] || {}; return '<div class="' + (k._new ? "bfxFeedIn" : "") + '" style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--border2);font-size:15px;border-radius:6px;">' + (FX ? FX.avatar(k.winner, t.color) : '<span style="width:10px;height:10px;border-radius:3px;background:' + esc(t.color || "var(--dim)") + ';flex:none;"></span>') + '<b style="color:var(--bright);">' + esc(k.winner) + '</b><span style="color:var(--muted);">KO\u2019d</span><span style="color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(k.loser) + '</span></div>'; }).join("");
    var lead = (s.leaders || []).slice(0, 8).map(function(p, i){ var t = byId[p.team] || {}; return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;"><span class="mono" style="color:var(--faint);width:20px;">' + (i+1) + '</span><span style="width:10px;height:10px;border-radius:3px;background:' + esc(t.color || "var(--dim)") + ';"></span><b style="color:var(--bright);flex:1;min-width:0;">' + esc(p.handle) + (p.mvp ? ' \u2605' : '') + '</b><span class="mono" style="color:var(--bright);font-weight:800;">' + p.wins + '</span></div>'; }).join("");
    if (s.status === "done" && FX) {
      var L = s.leaders || [], won = {}; T.forEach(function(t){ if (t.won) won[t.id] = 1; });
      var top = L.filter(function(p){ return p.mvp; }).sort(function(a, b){ return (b.wins - a.wins) || ((won[b.team] ? 1 : 0) - (won[a.team] ? 1 : 0)) || (a.fights - b.fights); })[0];
      var grit = L.slice().sort(function(a, b){ return b.fights - a.fights; })[0];
      var rows = T.map(function(t, i){ var mv = L.filter(function(p){ return p.team === t.id && p.mvp; }).map(function(p){ return p.handle; });
        return { name: t.name, color: col(t, i), score: (+t.avg).toFixed(2), sub: t.kos + " KOs · " + t.fought + "/" + t.members + " fought" + (mv.length ? " · MVP " + mv.join(", ") : "") }; });
      var acts = '<div style="display:flex;gap:10px;flex-wrap:wrap;"><button type="button" class="btn" id="vbRematch">Rematch</button>' + (window.PRIZE_ROLL && T.some(function(t){ return t.won; }) ? '<button type="button" class="btn ghost" id="vbPrize">\u2605 Prize roll</button>' : '') + '<button type="button" class="btn ghost" id="vbFull">Full screen</button><button type="button" class="btn ghost" id="vbNew">New battle</button></div>';
      return FX.podium({ kicker: "FINAL · KOs PER FIGHTER", title: winners.length > 1 ? "Tie! " + T.filter(function(t){ return t.won; }).map(function(t){ return t.name; }).join(" & ") : winners.length ? T.filter(function(t){ return t.won; })[0].name + " wins!" : "No KOs",
        rows: rows, mvp: top && { name: top.handle, detail: top.wins + " KOs in " + top.fights + " fights", avatar: FX.avatar(top.handle, (byId[top.team] || {}).color) },
        awards: [grit && grit.fights ? { label: "⚔ IRON WILL · MOST FIGHTS", who: grit.handle, detail: grit.fights + " fights", color: (byId[grit.team] || {}).color } : null], actions: acts }) +
        (msg ? '<div role="alert" class="mono" style="margin-top:14px;color:var(--bad);font-weight:700;font-size:13px;">' + esc(msg) + '</div>' : '');
    }
    return '<div class="card" style="margin-bottom:18px;border-color:var(--adv);box-shadow:0 0 30px -16px var(--advglow);">' + head + '</div>' +
      '<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;" id="g"><div style="display:flex;flex-direction:column;gap:14px;">' + bars + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:14px;"><div class="card"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:6px;">KNOCKOUTS</div>' + (feed || '<div style="color:var(--dim);font-size:14px;padding-top:6px;">No KOs yet.</div>') + '</div>' +
      (lead ? '<div class="card"><div class="mono" style="font-size:11px;letter-spacing:1.5px;color:var(--faint);margin-bottom:6px;">TOP FIGHTERS \u00b7 KOs</div>' + lead + '</div>' : '') + '</div></div>' + fights +
      (msg ? '<div role="alert" class="mono" style="margin-top:14px;color:var(--bad);font-weight:700;font-size:13px;">' + esc(msg) + '</div>' : '');
  }
  function paint(){
    if (!CUR) return;
    var s = ST && ST.session;
    view.innerHTML = (s && (s.status === "live" || !showSetup)) ? battleView(s) : SET && !SET.error ? setupView() : (msg || (SET && SET.error) ? '<div class="card" style="border-color:var(--amber);"><b style="color:var(--bright);">Couldn\u2019t load the battle setup.</b><div class="mono" style="font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6;">' + esc(msg || ("Error: " + SET.error)) + '<br>Check that <b>supabase/vocab-duels.sql</b> has been run (install-check.html), then reload.</div></div>' : '<div class="card mono" style="color:var(--dim);">Loading&hellip;</div>');
    var g = document.getElementById("g"); if (g && innerWidth < 900) g.style.gridTemplateColumns = "1fr";
    bind(); clock(); prizeAuto();
  }
  // 31.3: winning squad rolls a class prize (no test bonus / graded bonus / homework pass)
  function prizeList(s){
    var W = (s.teams || []).filter(function(t){ return t.won; });
    return Promise.all(W.map(function(t){ return PRIZE_ROLL.squadIds(rpc, CUR.id, t.id).then(function(ids){
      return { key: "vd:" + s.id + ":" + t.id, cls: CUR.id, ids: ids, who: t.name, pool: "squad", title: "Vocab Battle winners" }; }); }));
  }
  function prizeAuto(){
    var s = ST && ST.session; if (!window.PRIZE_ROLL || !s || s.status !== "done" || !(s.teams || []).some(function(t){ return t.won; })) return;
    if (prizeAuto.k === s.id) return; prizeAuto.k = s.id;
    prizeList(s).then(function(L){ PRIZE_ROLL.auto("vd:" + s.id, L, s.finished_at); });
  }
  function bind(){
    if (WR) WR.bind(view);
    var pz = document.getElementById("vbPrize"); if (pz) pz.onclick = function(){ prizeList(ST.session).then(function(L){ if (!PRIZE_ROLL.open(L)) { msg = "Every prize for this battle has been rolled."; paint(); } }); };
    if (window.TEAM_PICK) TEAM_PICK.bind(view, { rpc: rpc, reload: load, repaint: paint, err: function(m){ msg = m; paint(); } });
    view.querySelectorAll(".vbMod").forEach(function(b){ b.onclick = function(){ var m = b.getAttribute("data-m"); pick[m] = !pick[m]; msg = ""; paint(); }; });
    view.querySelectorAll(".vbQs").forEach(function(b){ b.onclick = function(){ qset = b.getAttribute("data-q"); msg = ""; paint(); }; });
    view.querySelectorAll(".vbPm").forEach(function(x){ x.onclick = function(){ var p = x.getAttribute("data-p"); modes[p] = !modes[p]; paint(); }; });
    view.querySelectorAll(".vbMin").forEach(function(b){ b.onclick = function(){ mins = +b.getAttribute("data-n"); paint(); }; });
    view.querySelectorAll(".vbRand").forEach(function(b){ b.onclick = function(){
      var n = +b.getAttribute("data-n");
      if (!confirm("Shuffle every student in " + CUR.name + " into " + n + " random teams? This replaces their current squads.")) return;
      busy = true; msg = ""; paint();
      rpc("ctf_t_tb_randomize", { p_class: CUR.id, p_n: n }).then(function(r){ busy = false; if (!r || r.error) msg = r && r.error === "battle_live" ? "A team battle is running, so teams can\u2019t change right now." : "Couldn\u2019t randomize."; load(); }).catch(function(e){ busy = false; msg = "Randomize needs supabase/team-battles.sql."; paint(); });
    }; });
    var s = document.getElementById("vbStart"); if (s) s.onclick = function(){
      var mods = Object.keys(pick).filter(function(m){ return pick[m]; }).map(Number), pool = [];
      mods.forEach(function(m){ (MODS[m] || []).forEach(function(t){ pool.push({ t: disp(t.t), d: t.d }); }); });
      var pm = modeList();
      if (qset === "binary" && BIN) { mods = [BIN.module]; pool = BIN.pool(); pm = BIN.modes; }
      var groups = TEAM_PICK.chosen(SET.teams.filter(function(t){ return t.members > 0; }));
      if (WR && WR.needsRoom()) { WR.openRoom(); return; }   // 29.2: class duels always go through the waiting room
      busy = true; msg = ""; paint();
      (WR ? WR.go : function(f){ f(function(){}); })(function(done){
        rpc("ctf_t_vd_start", { p_class: CUR.id, p_modules: mods, p_pool: pool, p_minutes: mins || 15, p_modes: pm, p_groups: groups }).then(function(r){
          busy = false; var ok = r && !r.error; done(ok); if (!ok) { msg = ERR[r && r.error] || "Couldn\u2019t start (" + ((r && r.error) || "error") + ")."; paint(); return; }
          showSetup = false; load();
        }).catch(function(e){ done(false); fail(e); });
      });
    };
    var e = document.getElementById("vbEnd"); if (e) e.onclick = function(){ if (!confirm("End the battle now and award XP?")) return; rpc("ctf_t_vd_end", { p_session: ST.session.id, p_award: true }).then(load).catch(fail); };
    var c = document.getElementById("vbCancel"); if (c) c.onclick = function(){ if (!confirm("Cancel the battle? No XP is awarded.")) return; rpc("ctf_t_vd_end", { p_session: ST.session.id, p_award: false }).then(load).catch(fail); };
    var n = document.getElementById("vbNew"); if (n) n.onclick = function(){ showSetup = true; msg = ""; paint(); };
    var rm = document.getElementById("vbRematch"); if (rm) rm.onclick = function(){
      var os = ST.session, pool = []; if (!confirm("Start a rematch with the same teams, modules and length?")) return;
      (os.modules || []).forEach(function(m){ (MODS[m] || []).forEach(function(t){ pool.push({ t: disp(t.t), d: t.d }); }); });
      if (BIN && BIN.is(os.modules)) pool = BIN.pool();
      var rpm = BIN && BIN.is(os.modules) ? BIN.modes : (os.modes && os.modes.length ? os.modes : modeList());
      busy = true; rpc("ctf_t_vd_start", { p_class: CUR.id, p_modules: os.modules, p_pool: pool, p_minutes: os.minutes || 15, p_modes: rpm, p_groups: ((ST && ST.teams) || os.teams || []).map(function(t){ return t.id; }).filter(Boolean) }).then(function(r){ busy = false; if (!r || r.error) { msg = ERR[r && r.error] || "Couldn’t start (" + ((r && r.error) || "error") + ")."; showSetup = true; paint(); return; } showSetup = false; load(); }).catch(fail);
    };
    var fu = document.getElementById("vbFull"); if (fu) fu.onclick = function(){ FX.fullscreen(document.getElementById("bfxResults")); };
  }
  function clock(){
    var el = document.getElementById("clock"), s = ST && ST.session; if (!el || !s || !s.ends_at || s.status !== "live") return;
    var left = new Date(s.ends_at).getTime() - (Date.now() + skew);
    el.textContent = mmss(left); el.style.color = left < 60000 ? "var(--advtext)" : "var(--bright)";
    if (FX) FX.clock(s.id, left, { el: el, music: true });
    if (left <= 0 && !clock._w) { clock._w = 1; setTimeout(function(){ clock._w = 0; load(); }, 1500); }
  }
  function load(){
    clearTimeout(timer); if (!CUR) return;
    var id = CUR.id;
    Promise.all([rpc("ctf_t_vd_state", { p_class: id }), rpc("ctf_t_vd_setup", { p_class: id })]).then(function(r){
      if (!CUR || CUR.id !== id) return;
      if (r[0] && r[0].error) { view.innerHTML = '<div class="card">Sign in on the <a href="teacher.html">teacher dashboard</a> first.</div>'; return; }
      ST = r[0]; SET = r[1]; if (ST.now) skew = new Date(ST.now).getTime() - Date.now();
      var se = ST.session, mx = function(F, m){ return (F || []).reduce(function(a, f){ return Math.max(a, new Date(f.at).getTime()); }, m); };
      if (se && se.id !== curSess) { if (curSess && FX) FX.reset(curSess); curSess = se.id; seenAt = mx(se.feed, 0); }
      else if (se) (se.feed || []).forEach(function(f){ if (new Date(f.at).getTime() > seenAt) f._new = true; });
      if (se) seenAt = mx(se.feed, seenAt);
      paint();
      if (se && FX && !(showSetup && se.status !== "live")) {
        var ev = FX.track(se.id, { status: se.status, teams: (se.teams || []).map(function(t, i){ return { id: t.id, name: t.name, color: col(t, i), score: +t.avg }; }),
          feed: (se.feed || []).map(function(k){ return { who: k.winner, team: k.team, at: k.at, pts: 1 }; }) }, { streakBy: "team", noun: "KO", bloodText: "FIRST KO!", capLines: ["{w} lands the knockout for {t}!", "Down goes another one! {w} scores for {t}.", "{w} wins the fight. {t} adds a KO!"] });
        ev.changed.forEach(function(id){ var el = document.getElementById("bar-" + id); if (el) FX.shake(el); });
        if (window.KO_FX && se.status === "live") (se.feed || []).filter(function(f){ return f._new; }).slice(0, 3).forEach(function(f, i){
          var tm = (se.teams || []).map(function(t, j){ return { id: t.id, c: col(t, j) }; }).filter(function(t){ return t.id === f.team; })[0];
          setTimeout(function(){ KO_FX.blast({ name: f.loser, label: "KNOCKED OUT", sub: f.winner + " lands the KO", color: tm ? tm.c : "#ffcf5c", small: i > 0 }); }, i * 600); });
        (se.feed || []).forEach(function(f){ delete f._new; });
      }
      timer = setTimeout(load, ST.session && ST.session.status === "live" ? 2500 : 15000);
    }).catch(function(e){ fail(e); timer = setTimeout(load, 15000); });
  }
  function pickClass(id){
    CUR = CLASSES.filter(function(c){ return c.id === id; })[0] || CLASSES[0]; if (!CUR) return;
    try { localStorage.setItem("vbattle-class", CUR.id); } catch (e) {}
    sel.value = CUR.id; pick = {}; ST = null; SET = null; showSetup = false; msg = ""; theme(); if (WR) WR.reload();
    loadVocab(CUR.course).then(load);
  }
  function clearFixed(){
    var hdr = document.getElementById("hdr"), minLeft = innerWidth;
    document.querySelectorAll("#themeToggle, #siteA11yBtn").forEach(function(b){ var r = b.getBoundingClientRect(); if (r.width && r.top < 60 && r.left < minLeft) minLeft = r.left; });
    hdr.style.paddingRight = (minLeft < innerWidth ? innerWidth - minLeft + 12 - (innerWidth - document.querySelector(".wrap").getBoundingClientRect().right) : 0) + "px";
  }
  window.addEventListener("resize", clearFixed); setTimeout(clearFixed, 0); setTimeout(clearFixed, 600);
  setInterval(clock, 500);
  (async function(){
    if (!AUTH || !AUTH.online) { view.innerHTML = '<div class="card">Connect the class backend (supabase-config.js) first.</div>'; return; }
    try { CLASSES = await rpc("ctf_t_classes") || []; } catch (e) { CLASSES = null; }
    if (!Array.isArray(CLASSES)) { view.innerHTML = '<div class="card">Sign in on the <a href="teacher.html">teacher dashboard</a> to run vocab battles.</div>'; return; }
    if (!CLASSES.length) { view.innerHTML = '<div class="card">No classes yet.</div>'; return; }
    sel.innerHTML = CLASSES.map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join("");
    function bgAuto(){ if (!window.BATTLE_BG) return; if (CUR && !(typeof DEMO !== "undefined" && DEMO)) BATTLE_BG.auto("projector", { cls: CUR.id }); else BATTLE_BG.use("projector", null); }
    sel.onchange = function(){ pickClass(sel.value); bgAuto(); };
    var want = new URLSearchParams(location.search).get("class"); try { want = want || localStorage.getItem("vbattle-class"); } catch (e) {}
    pickClass(want); bgAuto();
  })();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
})();
</script>
