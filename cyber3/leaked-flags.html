<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('course-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shared notes — Cyber Security 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#15181c;--panel2:#1a1e23;--border:#2a2f36;--border3:#3a4048;--text:#c9ced4;--bright:#f0f2f4;--muted:#9aa2ab;--faint:#5f6771;--accent:#d4af37;}
:root[data-theme="light"]{--bg:#f4f5f6;--panel:#ffffff;--panel2:#f0f1f2;--border:#dcdfe3;--border3:#c5c9ce;--text:#2b3038;--bright:#12151a;--muted:#565d67;--faint:#7c848d;--accent:#d4af37;}
*{box-sizing:border-box;}
body{margin:0;padding:40px 16px;background:var(--bg);font-family:'JetBrains Mono',monospace;color:var(--text);}
.wrap{max-width:640px;margin:0 auto;}
.title{font-size:13px;color:var(--faint);margin-bottom:6px;}
h1{font-size:20px;color:var(--bright);margin:0 0 18px;}
.pad{background:var(--panel);border:1px solid var(--border3);border-radius:12px;padding:24px;}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.row:last-child{border-bottom:none;}
.k{color:var(--muted);}
.v{color:var(--bright);}
.btn{margin-top:20px;width:100%;font-family:inherit;font-size:13px;font-weight:700;padding:12px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#0a0c0e;cursor:pointer;}
.note{margin-top:14px;font-size:11px;color:var(--faint);line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">unlisted · shared by a classmate</div>
  <h1>"leaked" flag answers — Cyber Security 3</h1>
  <div class="pad">
    <div class="row"><span class="k">Module 1 Flag</span><span class="v">flag{...redacted...}</span></div>
    <div class="row"><span class="k">Module 2 Flag</span><span class="v">flag{...redacted...}</span></div>
    <div class="row"><span class="k">Ultimate Flag</span><span class="v">flag{...redacted...}</span></div>
    <button class="btn" id="copyBtn">Copy all answers</button>
    <div class="note">If this looks too easy, that's because it is. Nobody actually leaks working flag answers to a public URL.</div>
  </div>
</div>
<script src="../supabase-config.js"></script>
<script src="../auth.js"></script>
<script>
document.getElementById("copyBtn").onclick = function(){
  location.href = "honeypot.html?trap=leak";
};
</script>
</body>
</html>
