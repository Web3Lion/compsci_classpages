<!DOCTYPE html>

<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('course-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build the Program — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#0b1220;--panel2:#0c1626;--panel3:#0e2136;--border:#1e3350;--border2:#172436;--border3:#244a6d;--border-hi:#2f5580;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--fainter:#3d5069;--accent:#00b3ff;--accent2:#7dd8ff;--bad:#ff5c7a;--warn:#ffcf5c;--ok:#4fd68a;}
:root[data-theme="light"]{--bg:#f3f6fb;--panel:#ffffff;--panel2:#eef3fa;--panel3:#e3ebf7;--border:#d5e0f0;--border2:#e0e8f3;--border3:#bcd0ea;--border-hi:#8fb4e0;--text:#2b3a52;--bright:#111a2c;--muted:#3c4f6b;--dim:#51637f;--faint:#5b6f8c;--fainter:#7488a3;--accent:#0072b8;--accent2:#005c94;--bad:#c22a48;--warn:#8a6300;--ok:#178a52;}
body,.panel,.stepBtn,.btn{transition:background-color .25s ease,border-color .25s ease,color .25s ease;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.themebtn:hover{border-color:var(--accent);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent2);}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;padding-right:110px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.brand h1{font-size:19px;margin:0;color:var(--bright);letter-spacing:.5px;}
.backLink{font-size:13px;color:var(--faint);}
.lead{color:var(--muted);line-height:1.6;font-size:14px;margin:12px 0 20px;max-width:70ch;}
.panel{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:24px;}
.progressRow{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);}
.progressBar{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;}
.progressBar>div{height:100%;background:var(--accent);width:0;transition:width .3s ease;}
.meta{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--faint);margin-bottom:10px;}
.stem{font-size:14.5px;line-height:1.6;color:var(--bright);margin:2px 0 18px;font-weight:600;}
.chosenList{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;min-height:20px;}
.chosenRow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:9px;border:1px solid var(--border3);background:var(--panel2);font-size:13.5px;color:var(--bright);}
.chosenRow .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);font-weight:700;flex:none;width:18px;}
.chosenRow.correctRow{border-color:var(--ok);background:rgba(79,214,138,.1);}
.chosenRow.wrongRow{border-color:var(--bad);background:rgba(255,92,122,.1);}
.availList{display:flex;flex-direction:column;gap:8px;}
.stepBtn{padding:12px 14px;border-radius:9px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-size:13.5px;text-align:left;cursor:pointer;}
.stepBtn:hover{border-color:var(--border-hi);background:var(--panel3);}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13.5px;line-height:1.65;}
.feedback.correct{background:rgba(79,214,138,.1);border:1px solid rgba(79,214,138,.3);}
.feedback.wrong{background:rgba(255,92,122,.1);border:1px solid rgba(255,92,122,.3);}
.feedback b{display:block;margin-bottom:6px;font-family:'JetBrains Mono',monospace;font-size:12px;}
.controls{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
.btn{padding:12px 20px;border-radius:10px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;}
.btn:hover{border-color:var(--border-hi);background:var(--panel3);}
.btn:disabled{opacity:.4;cursor:default;}
.resultsWrap{text-align:center;}
.bigScore{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:800;color:var(--bright);margin:6px 0;}
.reviewRow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--border2);margin-bottom:10px;text-align:left;}
.reviewRow .mark{font-size:16px;flex:none;width:20px;}
.startScreen{text-align:center;padding:36px 10px;}
.startScreen p{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.6;}
.nameInput{width:100%;max-width:320px;padding:13px 16px;border-radius:10px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-family:'Inter',sans-serif;font-size:15px;margin-bottom:18px;text-align:center;}
.nameInput:focus{outline:none;border-color:var(--accent);}
.resultName{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);margin-bottom:2px;}
</style>
</head>
<body>
<button id="themeToggle" class="themebtn" onclick="__toggleTheme()">LIGHT</button>
<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'◐ DARK':'◑ LIGHT';}window.__toggleTheme=function(){var t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem(K,t);}catch(e){}lbl();};lbl();})();</script>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span><h1>BUILD THE PROGRAM</h1></div>
    <a class="backLink mono" href="index.html">&larr; practice</a>
  </div>
  <p class="lead">AP Computer Science Principles &middot; 10 random questions, graded. Click each step in the order it actually happens, first to last.</p>

  <div class="panel" id="quizPanel"></div>
</div>
<script>
var BANK = [
  {title:"Program Development Process", steps:["Understand what the problem is asking","Design an algorithm to solve it","Write the code","Test the program with sample data","Debug and fix any errors found"]},
  {title:"Debugging Cycle", steps:["Run the program","Notice the output is wrong","Form a hypothesis about the cause","Isolate and test that part of the code","Fix the bug and re-run to confirm"]},
  {title:"Decomposition", steps:["Identify the overall problem","Break it into smaller subproblems","Solve each subproblem separately","Combine the subproblem solutions","Test the combined solution"]},
  {title:"Caesar Cipher Encryption", steps:["Choose a shift key","Convert each letter to its alphabet position","Add the shift value to each position","Wrap past Z back around to A","Convert the shifted positions back to letters"]},
  {title:"Binary Search", steps:["Find the middle element of the sorted list","Compare the target to the middle element","If they match, the search is done","If the target is smaller, repeat on the left half","If the target is larger, repeat on the right half"]},
  {title:"Writing & Running Code", steps:["Write the code in a text editor","Save the file","Run the interpreter on the file","Read any error messages","Fix errors and re-run until it works"]},
  {title:"Finding the Maximum in a List", steps:["Set max to the first element","Loop through each remaining element","Compare the element to max","Update max if the element is bigger","After the loop, max holds the largest value"]},
  {title:"Calling a Function", steps:["Define the function with parameters","Call the function with specific argument values","Arguments are assigned to the parameters","The function body executes","The return value is sent back to the caller"]},
  {title:"Testing a Program", steps:["Choose typical test data","Run the program on that data","Compare the output to the expected result","Choose edge-case or boundary test data","Re-run and compare again"]},
  {title:"Flowchart to Pseudocode", steps:["Read the flowchart from start to end","Identify decision points as IF/ELSE","Identify repeated sections as loops","Write pseudocode following that same order","Trace through with sample values to check it"]},
  {title:"Encryption Key Exchange", steps:["Sender and receiver agree on an encryption method","Sender encrypts the message using the key","Sender transmits the ciphertext","Receiver decrypts it using the same key","Receiver reads the plaintext message"]},
  {title:"Building a List Through a Loop", steps:["Create an empty list before the loop starts","Loop through the source data one item at a time","Check each item against a condition","Append qualifying items to the list","Use the completed list after the loop ends"]}
];
var Q = [], idx = 0, answers = [], chosen = [], available = [], studentName = "", mode = "quiz";

function shuffleArr(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function escHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }


function renderStart(){
  var savedName = '';
  try{ savedName = localStorage.getItem('practice-student-name') || ''; }catch(e){}
  document.getElementById('quizPanel').innerHTML = '<div class="startScreen"><div class="meta">BEFORE YOU START</div><p>Type your name so it shows on your results &mdash; handy for a screenshot. Name is optional for Open Practice.</p><input type="text" id="studentNameInput" class="nameInput" placeholder="Your name" value="'+escHtml(savedName)+'" onkeydown="if(event.key===\'Enter\')beginQuiz();"><div class="controls" style="justify-content:center;gap:10px;"><button class="btn" onclick="beginPractice()">OPEN PRACTICE</button><button class="btn" onclick="beginQuiz()" style="border-color:var(--accent);color:var(--accent2);">BEGIN QUIZ &rarr;</button></div></div>';
  var inp = document.getElementById('studentNameInput');
  inp.focus(); inp.select();
}
function beginQuiz(){
  var v = document.getElementById('studentNameInput').value.trim();
  studentName = v;
  try{ localStorage.setItem('practice-student-name', v); }catch(e){}
  mode = 'quiz';
  startQuiz();
}
function beginPractice(){
  var v = document.getElementById('studentNameInput').value.trim();
  studentName = v;
  try{ if(v) localStorage.setItem('practice-student-name', v); }catch(e){}
  mode = 'practice';
  startQuiz();
}
function endPractice(){ renderStart(); }

function startQuiz(){
  Q = mode === 'practice' ? shuffleArr(BANK) : shuffleArr(BANK).slice(0, 10);
  idx = 0; answers = [];
  renderQuestion();
}

function renderQuestion(){
  var p = Q[idx];
  chosen = [];
  available = shuffleArr(p.steps.map(function(s,i){return {text:s, orig:i};}));
  renderBoard();
}

function renderBoard(locked, wasCorrect){
  var p = Q[idx];
  var chosenHtml = chosen.map(function(step, i){
    var cls = '';
    if(locked){ cls = (step.orig === i) ? ' correctRow' : ' wrongRow'; }
    return '<div class="chosenRow'+cls+'"><span class="num">'+(i+1)+'</span><span>'+escHtml(step.text)+'</span></div>';
  }).join('');
  var availHtml = available.map(function(step, i){
    return '<button class="stepBtn" onclick="chooseStep('+i+')">'+escHtml(step.text)+'</button>';
  }).join('');
  var html = (mode==='practice' ? '<div class="progressRow"><span class="mono" style="color:var(--accent2);">OPEN PRACTICE</span><span>Question <b style="color:var(--bright);">'+(idx+1)+'</b></span><button class="btn" style="padding:6px 12px;font-size:11px;margin-left:auto;" onclick="endPractice()">END &rarr;</button></div>' : '<div class="progressRow"><span>QUESTION <b style="color:var(--bright);">'+(idx+1)+'</b>/10</span><div class="progressBar"><div style="width:'+(idx/10*100)+'%;"></div></div></div>')
    + '<div class="meta">'+escHtml(p.title.toUpperCase())+'</div>'
    + '<div class="stem">Click the steps below in the order they actually happen.</div>'
    + '<div class="chosenList" id="chosenList">'+chosenHtml+'</div>'
    + '<div class="availList" id="availList">'+availHtml+'</div>'
    + '<div id="fbSlot"></div>'
    + '<div class="controls"><button class="btn" id="undoBtn" onclick="undoStep()" '+(chosen.length===0||locked?'disabled':'')+'>&larr; UNDO</button><button class="btn" id="nextBtn" disabled onclick="nextQuestion()">'+(idx===9?'SEE RESULTS':'NEXT')+' &rarr;</button></div>';
  document.getElementById('quizPanel').innerHTML = html;
}

function chooseStep(i){
  var step = available[i];
  available.splice(i, 1);
  chosen.push(step);
  if(chosen.length === Q[idx].steps.length){
    checkAnswer();
  } else {
    renderBoard();
  }
}

function undoStep(){
  var step = chosen.pop();
  available.push(step);
  renderBoard();
}

function checkAnswer(){
  var allCorrect = chosen.every(function(step, i){ return step.orig === i; });
  answers[idx] = {correct: allCorrect};
  renderBoard(true, allCorrect);
  var fb = '<div class="feedback '+(allCorrect?'correct':'wrong')+'"><b>'+(allCorrect?'CORRECT ORDER':'NOT QUITE — correct order shown below')+'</b>'+(allCorrect?'That\'s the order this process actually happens in.':'Green rows are in the right spot; red rows are out of place. The correct order is: '+Q[idx].steps.join(' → '))+'</div>';
  document.getElementById('fbSlot').innerHTML = fb;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  if(mode === 'practice'){
    idx++;
    if(idx >= Q.length){ Q = shuffleArr(BANK); idx = 0; }
    renderQuestion();
    return;
  }
  if(idx === 9){ showResults(); return; }
  idx++;
  renderQuestion();
}

function showResults(){
  var correctCount = answers.filter(function(a){return a.correct;}).length;
  var pct = Math.round(correctCount/10*100);
  var color = pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)';
  var html = '<div class="resultsWrap">'+(studentName?'<div class="resultName">'+escHtml(studentName)+'</div>':'')+'<div class="meta">RESULTS</div><div class="bigScore" style="color:'+color+';">'+correctCount+'/10</div><div class="mono" style="color:var(--dim);font-size:13px;margin-bottom:24px;">'+pct+'% correct</div></div>';
  html += Q.map(function(p, i){
    var a = answers[i];
    return '<div class="reviewRow"><span class="mark">'+(a.correct?'✅':'❌')+'</span><div><div class="mono" style="font-size:11.5px;color:var(--faint);margin-bottom:4px;">QUESTION '+(i+1)+' &middot; '+escHtml(p.title)+'</div><div style="font-size:13.5px;color:var(--muted);line-height:1.5;">'+escHtml(p.steps.join(' → '))+'</div></div></div>';
  }).join('');
  html += '<div class="controls" style="justify-content:center;margin-top:22px;"><button class="btn" onclick="startQuiz()">TRY AGAIN &rarr;</button></div>';
  document.getElementById('quizPanel').innerHTML = html;
}

renderStart();
</script>
</body>
</html>
