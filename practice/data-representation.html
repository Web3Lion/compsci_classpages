<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('course-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convert &amp; Represent — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#0b1220;--panel2:#0c1626;--panel3:#0e2136;--border:#1e3350;--border2:#172436;--border3:#244a6d;--border-hi:#2f5580;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--fainter:#3d5069;--accent:#00b3ff;--accent2:#7dd8ff;--bad:#ff5c7a;--warn:#ffcf5c;--ok:#4fd68a;}
:root[data-theme="light"]{--bg:#f3f6fb;--panel:#ffffff;--panel2:#eef3fa;--panel3:#e3ebf7;--border:#d5e0f0;--border2:#e0e8f3;--border3:#bcd0ea;--border-hi:#8fb4e0;--text:#2b3a52;--bright:#111a2c;--muted:#3c4f6b;--dim:#51637f;--faint:#5b6f8c;--fainter:#7488a3;--accent:#0072b8;--accent2:#005c94;--bad:#c22a48;--warn:#8a6300;--ok:#178a52;--codebg:#050810;}
:root[data-theme="light"] .codeBox{background:#e9eef7;color:#1c2c44;border-color:var(--border3);}
body,.panel,.choice,.btn{transition:background-color .25s ease,border-color .25s ease,color .25s ease;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.themebtn:hover{border-color:var(--accent);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent2);}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;padding-right:110px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.brand h1{font-size:19px;margin:0;color:var(--bright);letter-spacing:.5px;}
.backLink{font-size:13px;color:var(--faint);}
.lead{color:var(--muted);line-height:1.6;font-size:14px;margin:12px 0 20px;max-width:70ch;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.legItem{flex:1;min-width:150px;padding:12px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--panel);font-size:12px;line-height:1.5;color:var(--dim);}
.legItem b{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:3px;}
.panel{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:24px;}
.progressRow{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);}
.progressBar{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;}
.progressBar>div{height:100%;background:var(--accent);width:0;transition:width .3s ease;}
.meta{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--faint);margin-bottom:10px;}
.codeBox{background:var(--codebg,#050810);border:1px solid var(--border2);border-radius:10px;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.85;overflow-x:auto;white-space:pre;color:var(--text);margin-bottom:6px;}
.stem{font-size:14.5px;line-height:1.6;color:var(--bright);margin:14px 0 18px;}
.choices{display:grid;grid-template-columns:1fr;gap:10px;}
.choice{padding:14px 16px;border-radius:10px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;cursor:pointer;text-align:left;white-space:pre-wrap;}
.choice:hover{border-color:var(--border-hi);background:var(--panel3);}
.choice.correctPick{border-color:var(--ok);background:rgba(79,214,138,.14);}
.choice.wrongPick{border-color:var(--bad);background:rgba(255,92,122,.14);}
.choice:disabled{cursor:default;}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13.5px;line-height:1.65;}
.feedback.correct{background:rgba(79,214,138,.1);border:1px solid rgba(79,214,138,.3);}
.feedback.wrong{background:rgba(255,92,122,.1);border:1px solid rgba(255,92,122,.3);}
.feedback b{display:block;margin-bottom:6px;font-family:'JetBrains Mono',monospace;font-size:12px;}
.controls{display:flex;justify-content:flex-end;margin-top:18px;}
.btn{padding:12px 20px;border-radius:10px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;}
.btn:hover{border-color:var(--border-hi);background:var(--panel3);}
.btn:disabled{opacity:.4;cursor:default;}
.resultsWrap{text-align:center;}
.bigScore{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:800;color:var(--bright);margin:6px 0;}
.reviewRow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--border2);margin-bottom:10px;text-align:left;}
.reviewRow .mark{font-size:16px;flex:none;width:20px;}
.startScreen{text-align:center;padding:36px 10px;}
.startScreen p{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.6;}
.nameInput{width:100%;max-width:320px;padding:13px 16px;border-radius:10px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-family:'Inter',sans-serif;font-size:15px;margin-bottom:18px;text-align:center;}
.nameInput:focus{outline:none;border-color:var(--accent);}
.resultName{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);margin-bottom:2px;}
</style>
</head>
<body>
<button id="themeToggle" class="themebtn" onclick="__toggleTheme()">LIGHT</button>
<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'◐ DARK':'◑ LIGHT';}window.__toggleTheme=function(){var t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem(K,t);}catch(e){}lbl();};lbl();})();</script>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span><h1>CONVERT &AMP; REPRESENT</h1></div>
    <a class="backLink mono" href="index.html">&larr; practice</a>
  </div>
  <p class="lead">AP Computer Science Principles &middot; 10 random questions, graded. Binary, hexadecimal, bits, and how digital data represents information.</p>

  <div class="panel" id="quizPanel"></div>
</div>
<script>
var BANK = [{"stem":"What is the decimal value of binary 1011?","choices":["11","9","13","7"],"answer":"11","explain":"1011 = 8+0+2+1 = 11."},{"stem":"Convert decimal 26 to binary.","choices":["11010","11100","10110","01101"],"answer":"11010","explain":"16+8+2 = 26, so 26 in binary is 11010."},{"stem":"What is hexadecimal A3 in decimal?","choices":["163","153","173","193"],"answer":"163","explain":"A = 10, so A3 = 10*16 + 3 = 163."},{"stem":"How many distinct values can 4 bits represent?","choices":["16","8","4","32"],"answer":"16","explain":"4 bits gives 2^4 = 16 possible values."},{"stem":"A file uses 8 bits per character (ASCII). How many bits are needed for a 10-character word?","choices":["80","10","18","64"],"answer":"80","explain":"10 characters x 8 bits each = 80 bits."},{"stem":"Which best describes a bit?","choices":["A single binary digit, 0 or 1","A group of 8 binary digits","A character in ASCII","A decimal digit"],"answer":"A single binary digit, 0 or 1","explain":"A bit is the smallest unit of digital information — a single 0 or 1."},{"stem":"Why do computers use binary internally instead of decimal?","choices":["Transistors reliably represent two stable states (on/off)","Binary is faster for humans to read","Binary uses fewer digits than decimal, which matters for readability","Early computers only had two memory chips"],"answer":"Transistors reliably represent two stable states (on/off)","explain":"Physical hardware (transistors, switches) reliably distinguishes two states, making binary a natural fit."},{"stem":"Hex 0xFF equals which decimal and binary value?","choices":["255 in decimal, 11111111 in binary","256 in decimal, 11111110 in binary","254 in decimal, 11111111 in binary","255 in decimal, 11110000 in binary"],"answer":"255 in decimal, 11111111 in binary","explain":"F = 15, so FF = 15*16 + 15 = 255, which is 11111111 in binary."},{"stem":"Adding 1 to binary 1111 in a 4-bit register causes what?","choices":["Overflow — it wraps around to 0000","It becomes 10000 with no issue","It becomes 1110","Nothing happens"],"answer":"Overflow — it wraps around to 0000","explain":"A 4-bit register can't hold the value 16 (10000), so it overflows and wraps to 0000."},{"stem":"What is 2^8?","choices":["256","128","512","64"],"answer":"256","explain":"2^8 = 256."},{"stem":"Which uses fewer bits to represent the number 5: 3-bit unsigned binary (101), or the ASCII character '5' (8 bits)?","choices":["Unsigned binary (101, 3 bits) uses far fewer bits","ASCII text always uses fewer bits","They always use exactly the same number of bits","Binary can't represent single digits"],"answer":"Unsigned binary (101, 3 bits) uses far fewer bits","explain":"Representing the numeric value directly in binary takes only 3 bits, versus 8 bits to store the character '5' as text."},{"stem":"A grayscale image uses 8 bits per pixel. How many distinct shades of gray can each pixel show?","choices":["256","8","16","128"],"answer":"256","explain":"8 bits gives 2^8 = 256 possible shades."},{"stem":"What does 'lossless' mean when digitally representing data?","choices":["The exact original data can be perfectly reconstructed","Some fine detail is discarded to save space","The data is stored only in binary","The file cannot be compressed further"],"answer":"The exact original data can be perfectly reconstructed","explain":"Lossless representation/compression allows the original data to be recovered exactly, with nothing discarded."},{"stem":"The same bit pattern can represent very different kinds of information (a number, a letter, a color). What determines how those bits should be interpreted?","choices":["The data type or context a program assigns to those bits","The physical color of the bits","The order the bits were typed in","Nothing — bits always mean the same thing"],"answer":"The data type or context a program assigns to those bits","explain":"Bits have no inherent meaning; a program's data type/context determines how a bit pattern is interpreted."},{"stem":"An image made of a grid of tiny colored squares, each with a numeric color value, is an example of:","choices":["Digital representation of continuous (analog) visual information","A format that cannot be resized","A purely text-based format","A format with no numeric encoding at all"],"answer":"Digital representation of continuous (analog) visual information","explain":"A camera samples continuous, analog light and color into a discrete grid of numeric pixel values — digitizing analog information."}];
var Q = [], idx = 0, answers = [], studentName = "", mode = "quiz";

function shuffleArr(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function escHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderStart(){
  var savedName = '';
  try{ savedName = localStorage.getItem('practice-student-name') || ''; }catch(e){}
  document.getElementById('quizPanel').innerHTML = '<div class="startScreen"><div class="meta">BEFORE YOU START</div><p>Type your name so it shows on your results &mdash; handy for a screenshot. Name is optional for Open Practice.</p><input type="text" id="studentNameInput" class="nameInput" placeholder="Your name" value="'+escHtml(savedName)+'" onkeydown="if(event.key===\'Enter\')beginQuiz();"><div class="controls" style="justify-content:center;gap:10px;"><button class="btn" onclick="beginPractice()">OPEN PRACTICE</button><button class="btn" onclick="beginQuiz()" style="border-color:var(--accent);color:var(--accent2);">BEGIN QUIZ &rarr;</button></div></div>';
  var inp = document.getElementById('studentNameInput');
  inp.focus(); inp.select();
}
function beginQuiz(){
  var v = document.getElementById('studentNameInput').value.trim();
  studentName = v;
  try{ localStorage.setItem('practice-student-name', v); }catch(e){}
  mode = 'quiz';
  startQuiz();
}
function beginPractice(){
  var v = document.getElementById('studentNameInput').value.trim();
  studentName = v;
  try{ if(v) localStorage.setItem('practice-student-name', v); }catch(e){}
  mode = 'practice';
  startQuiz();
}
function endPractice(){ renderStart(); }

function startQuiz(){
  Q = mode === 'practice' ? shuffleArr(BANK) : shuffleArr(BANK).slice(0, 10);
  idx = 0; answers = [];
  renderQuestion();
}

function renderQuestion(){
  var p = Q[idx];
  var choicesOrder = shuffleArr(p.choices);
  var codeHtml = p.code ? '<div class="codeBox">'+p.code.map(escHtml).join('\n')+'</div>' : '';
  var html = (mode==='practice' ? '<div class="progressRow"><span class="mono" style="color:var(--accent2);">OPEN PRACTICE</span><span>Question <b style="color:var(--bright);">'+(idx+1)+'</b></span><button class="btn" style="padding:6px 12px;font-size:11px;margin-left:auto;" onclick="endPractice()">END &rarr;</button></div>' : '<div class="progressRow"><span>QUESTION <b style="color:var(--bright);">'+(idx+1)+'</b>/10</span><div class="progressBar"><div style="width:'+(idx/10*100)+'%;"></div></div></div>')
    + '<div class="meta">QUESTION '+(idx+1)+'</div>'
    + codeHtml
    + '<div class="stem">'+escHtml(p.stem)+'</div>'
    + '<div class="choices" id="choicesBox">' + choicesOrder.map(function(c){
        return '<button class="choice" onclick="pick('+JSON.stringify(c).replace(/"/g,'&quot;')+')">'+escHtml(c)+'</button>';
      }).join('') + '</div>'
    + '<div id="fbSlot"></div>'
    + '<div class="controls"><button class="btn" id="nextBtn" disabled onclick="nextQuestion()">'+(idx===9?'SEE RESULTS':'NEXT')+' &rarr;</button></div>';
  document.getElementById('quizPanel').innerHTML = html;
}

function pick(val){
  var p = Q[idx];
  if(answers[idx]) return;
  var correct = val === p.answer;
  answers[idx] = {pick:val, correct:correct};
  var btns = document.querySelectorAll('#choicesBox .choice');
  btns.forEach(function(b){
    b.disabled = true;
    var lbl = b.textContent.trim();
    if(lbl === p.answer) b.classList.add('correctPick');
    else if(lbl === val && !correct) b.classList.add('wrongPick');
  });
  var fb = '<div class="feedback '+(correct?'correct':'wrong')+'"><b>'+(correct?'CORRECT':'NOT QUITE — correct answer: '+escHtml(p.answer))+'</b>'+escHtml(p.explain)+'</div>';
  document.getElementById('fbSlot').innerHTML = fb;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  if(mode === 'practice'){
    idx++;
    if(idx >= Q.length){ Q = shuffleArr(BANK); idx = 0; }
    renderQuestion();
    return;
  }
  if(idx === 9){ showResults(); return; }
  idx++;
  renderQuestion();
}

function showResults(){
  var correctCount = answers.filter(function(a){return a.correct;}).length;
  var pct = Math.round(correctCount/10*100);
  var color = pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)';
  var html = '<div class="resultsWrap">'+(studentName?'<div class="resultName">'+escHtml(studentName)+'</div>':'')+'<div class="meta">RESULTS</div><div class="bigScore" style="color:'+color+';">'+correctCount+'/10</div><div class="mono" style="color:var(--dim);font-size:13px;margin-bottom:24px;">'+pct+'% correct</div></div>';
  html += Q.map(function(p, i){
    var a = answers[i];
    return '<div class="reviewRow"><span class="mark">'+(a.correct?'✅':'❌')+'</span><div><div class="mono" style="font-size:11.5px;color:var(--faint);margin-bottom:4px;">QUESTION '+(i+1)+' &middot; your answer: '+escHtml(a.pick)+(a.correct?'':' &middot; correct: '+escHtml(p.answer))+'</div><div style="font-size:13.5px;color:var(--muted);line-height:1.5;">'+escHtml(p.explain)+'</div></div></div>';
  }).join('');
  html += '<div class="controls" style="justify-content:center;margin-top:22px;"><button class="btn" onclick="startQuiz()">TRY AGAIN &rarr;</button></div>';
  document.getElementById('quizPanel').innerHTML = html;
}

renderStart();
</script>
</body>
</html>
