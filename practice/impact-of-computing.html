<!DOCTYPE html>

<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('course-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impact of Computing — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:#0b1220;--panel2:#0c1626;--panel3:#0e2136;--border:#1e3350;--border2:#172436;--border3:#244a6d;--border-hi:#2f5580;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--fainter:#3d5069;--accent:#00b3ff;--accent2:#7dd8ff;--bad:#ff5c7a;--warn:#ffcf5c;--ok:#4fd68a;}
:root[data-theme="light"]{--bg:#f3f6fb;--panel:#ffffff;--panel2:#eef3fa;--panel3:#e3ebf7;--border:#d5e0f0;--border2:#e0e8f3;--border3:#bcd0ea;--border-hi:#8fb4e0;--text:#2b3a52;--bright:#111a2c;--muted:#3c4f6b;--dim:#51637f;--faint:#5b6f8c;--fainter:#7488a3;--accent:#0072b8;--accent2:#005c94;--bad:#c22a48;--warn:#8a6300;--ok:#178a52;--codebg:#050810;}
:root[data-theme="light"] .codeBox{background:#e9eef7;color:#1c2c44;border-color:var(--border3);}
body,.panel,.choice,.btn{transition:background-color .25s ease,border-color .25s ease,color .25s ease;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.themebtn:hover{border-color:var(--accent);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent2);}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:10px;padding-right:110px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.brand h1{font-size:19px;margin:0;color:var(--bright);letter-spacing:.5px;}
.backLink{font-size:13px;color:var(--faint);}
.lead{color:var(--muted);line-height:1.6;font-size:14px;margin:12px 0 20px;max-width:70ch;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.legItem{flex:1;min-width:150px;padding:12px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--panel);font-size:12px;line-height:1.5;color:var(--dim);}
.legItem b{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:3px;}
.panel{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:24px;}
.progressRow{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);}
.progressBar{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;}
.progressBar>div{height:100%;background:var(--accent);width:0;transition:width .3s ease;}
.meta{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--faint);margin-bottom:10px;}
.codeBox{background:var(--codebg,#050810);border:1px solid var(--border2);border-radius:10px;padding:16px 18px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.85;overflow-x:auto;white-space:pre;color:var(--text);margin-bottom:6px;}
.stem{font-size:14.5px;line-height:1.6;color:var(--bright);margin:14px 0 18px;}
.choices{display:grid;grid-template-columns:1fr;gap:10px;}
.choice{padding:14px 16px;border-radius:10px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;cursor:pointer;text-align:left;white-space:pre-wrap;}
.choice:hover{border-color:var(--border-hi);background:var(--panel3);}
.choice.correctPick{border-color:var(--ok);background:rgba(79,214,138,.14);}
.choice.wrongPick{border-color:var(--bad);background:rgba(255,92,122,.14);}
.choice:disabled{cursor:default;}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:13.5px;line-height:1.65;}
.feedback.correct{background:rgba(79,214,138,.1);border:1px solid rgba(79,214,138,.3);}
.feedback.wrong{background:rgba(255,92,122,.1);border:1px solid rgba(255,92,122,.3);}
.feedback b{display:block;margin-bottom:6px;font-family:'JetBrains Mono',monospace;font-size:12px;}
.controls{display:flex;justify-content:flex-end;margin-top:18px;}
.btn{padding:12px 20px;border-radius:10px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;}
.btn:hover{border-color:var(--border-hi);background:var(--panel3);}
.btn:disabled{opacity:.4;cursor:default;}
.resultsWrap{text-align:center;}
.bigScore{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:800;color:var(--bright);margin:6px 0;}
.reviewRow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--border2);margin-bottom:10px;text-align:left;}
.reviewRow .mark{font-size:16px;flex:none;width:20px;}
.startScreen{text-align:center;padding:36px 10px;}
.startScreen p{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.6;}
.nameInput{width:100%;max-width:320px;padding:13px 16px;border-radius:10px;border:1px solid var(--border3);background:var(--panel2);color:var(--bright);font-family:'Inter',sans-serif;font-size:15px;margin-bottom:18px;text-align:center;}
.nameInput:focus{outline:none;border-color:var(--accent);}
.resultName{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim);margin-bottom:2px;}
</style>
</head>
<body>
<button id="themeToggle" class="themebtn" onclick="__toggleTheme()">LIGHT</button>
<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'◐ DARK':'◑ LIGHT';}window.__toggleTheme=function(){var t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem(K,t);}catch(e){}lbl();};lbl();})();</script>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span><h1>IMPACT OF COMPUTING</h1></div>
    <a class="backLink mono" href="index.html">&larr; practice</a>
  </div>
  <p class="lead">AP Computer Science Principles &middot; 10 random questions, graded. Intellectual property, licensing, algorithmic bias, and the digital divide.</p>

  <div class="panel" id="quizPanel"></div>
</div>
<script>
var BANK = [{"stem":"What does intellectual property (IP) protect?","choices":["Original creative or intellectual works, like software, writing, music, and inventions","Only physical objects like computers and phones","Government-owned data only","Nothing that exists in digital form"],"answer":"Original creative or intellectual works, like software, writing, music, and inventions","explain":"IP law protects original creative and intellectual works, whether physical, written, or digital."},{"stem":"Which best describes what a Creative Commons license allows?","choices":["Creators specify exactly how others may use, share, or build on their work, short of full copyright restriction","Anyone can use any CC-licensed work with zero restrictions or attribution","CC licenses only apply to software, not creative works","CC licenses remove all rights from the original creator"],"answer":"Creators specify exactly how others may use, share, or build on their work, short of full copyright restriction","explain":"Creative Commons licenses let a creator grant specific permissions while keeping some rights, rather than an all-or-nothing choice."},{"stem":"Using someone else's copyrighted code in a project without permission or a license that allows it is:","choices":["A violation of intellectual property rights","Always legal in an educational setting","Required for open-source projects","The same as plagiarizing text only, not code"],"answer":"A violation of intellectual property rights","explain":"Code is protected by copyright like other creative works; using it without permission or a valid license violates IP rights."},{"stem":"If a machine learning model is trained mostly on data from one demographic group, what's a likely consequence?","choices":["The model may perform worse or make biased decisions for other groups not well represented in the training data","The model becomes completely unbiased automatically","The model will refuse to run","Bias in training data never affects the outcome"],"answer":"The model may perform worse or make biased decisions for other groups not well represented in the training data","explain":"Models tend to reflect the patterns in their training data, so underrepresented groups can be poorly served."},{"stem":"What is meant by 'algorithmic bias'?","choices":["Systematic and unfair outcomes produced by an algorithm, often due to biased data or design choices","A bug that always causes a program to crash","A type of encryption error","An intentional feature added to make software slower"],"answer":"Systematic and unfair outcomes produced by an algorithm, often due to biased data or design choices","explain":"Algorithmic bias refers to unfair, systematic patterns in an algorithm's outputs, often traced to its training data or design."},{"stem":"What is crowdsourcing, in the context of computing?","choices":["Gathering information, data, or work from a large number of people, often via the Internet","A method of encrypting large files","A way to compress video for streaming","A type of computer virus"],"answer":"Gathering information, data, or work from a large number of people, often via the Internet","explain":"Crowdsourcing pools contributions from many individuals, often coordinated online."},{"stem":"What is the 'digital divide'?","choices":["The gap between those who have reliable access to computing technology and the Internet and those who do not","The difference between binary and decimal number systems","The boundary between the client and server in a network","A term for the line between hardware and software"],"answer":"The gap between those who have reliable access to computing technology and the Internet and those who do not","explain":"The digital divide describes unequal access to technology and connectivity across different groups or regions."},{"stem":"Why can crowdsourced data (like citizen-reported map data) be both powerful and risky?","choices":["It can capture large-scale, real-time information, but may also be inaccurate, biased, or manipulated since it isn't centrally verified","It's always 100% accurate because many people contributed","It's illegal in most countries","It requires no data verification because volunteers are always experts"],"answer":"It can capture large-scale, real-time information, but may also be inaccurate, biased, or manipulated since it isn't centrally verified","explain":"Crowdsourcing scales data collection but sacrifices centralized quality control, opening the door to inaccuracy or manipulation."},{"stem":"Posting someone else's photo online without permission, when they had an expectation of privacy, raises concerns about:","choices":["Privacy and appropriate use of personal data","Only intellectual property, not privacy","Encryption, not personal data","None of these — public posts are never a concern"],"answer":"Privacy and appropriate use of personal data","explain":"Sharing someone's personal image without consent is primarily a privacy issue, separate from IP concerns."},{"stem":"Which best explains why open-source software licenses matter?","choices":["They specify what others are legally allowed to do with the shared code, like reuse, modify, or redistribute it","They make all software free for any use with zero terms","They only apply to code written by large corporations","They remove the need for any license at all"],"answer":"They specify what others are legally allowed to do with the shared code, like reuse, modify, or redistribute it","explain":"Open-source licenses define the exact permissions and conditions attached to reusing shared code."},{"stem":"A hiring algorithm trained on historical hiring data that reflected past discrimination is likely to:","choices":["Perpetuate or amplify that same discrimination in its future recommendations","Automatically correct all past discrimination","Have no relationship to the data it was trained on","Only affect the company's IT department"],"answer":"Perpetuate or amplify that same discrimination in its future recommendations","explain":"Models trained on biased historical data tend to reproduce — or even amplify — that same bias."},{"stem":"What responsibility do computing innovators generally have regarding the societal effects of their creations?","choices":["To consider and try to anticipate the beneficial and harmful effects their innovations may have on individuals and society","None — only end users are responsible for how software is used","Only legal responsibility, never ethical responsibility","Responsibility only if the software fails technically"],"answer":"To consider and try to anticipate the beneficial and harmful effects their innovations may have on individuals and society","explain":"Innovators are expected to weigh both the benefits and potential harms of what they build, not just its technical function."},{"stem":"Which is an example of appropriately citing/crediting a digital resource?","choices":["Including the original creator's name and a citation when reusing their work under its license terms","Removing all names or credits before reuse","Renaming the file so it looks self-created","Only crediting sources longer than one paragraph"],"answer":"Including the original creator's name and a citation when reusing their work under its license terms","explain":"Proper attribution means crediting the original creator according to the terms of the resource's license."},{"stem":"What is one reason unequal access to high-speed Internet (part of the digital divide) matters for education?","choices":["Students without reliable access may be unable to fully participate in online learning, research, or digital coursework","Internet access has no effect on a student's coursework","All schools already provide equal Internet access everywhere","It only affects entertainment, not schoolwork"],"answer":"Students without reliable access may be unable to fully participate in online learning, research, or digital coursework","explain":"Lack of reliable connectivity can directly limit a student's ability to complete online-dependent coursework."},{"stem":"Why is bias in training data considered an ethical issue in computing, not just a technical one?","choices":["Biased algorithmic outcomes can cause real, unequal harm to real people and groups, beyond just a technical inaccuracy","Ethics and technical accuracy are unrelated topics","Bias only matters if the code doesn't compile","There is no ethical dimension to how software makes decisions"],"answer":"Biased algorithmic outcomes can cause real, unequal harm to real people and groups, beyond just a technical inaccuracy","explain":"When biased outputs translate into unfair treatment of real people, the issue extends beyond correctness into ethics."}];
var Q = [], idx = 0, answers = [], studentName = "", mode = "quiz";

function shuffleArr(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function escHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderStart(){
  var savedName = '';
  try{ savedName = localStorage.getItem('practice-student-name') || ''; }catch(e){}
  document.getElementById('quizPanel').innerHTML = '<div class="startScreen"><div class="meta">BEFORE YOU START</div><p>Type your name so it shows on your results &mdash; handy for a screenshot. Name is optional for Open Practice.</p><input type="text" id="studentNameInput" class="nameInput" placeholder="Your name" value="'+escHtml(savedName)+'" onkeydown="if(event.key===\'Enter\')beginQuiz();"><div class="controls" style="justify-content:center;gap:10px;"><button class="btn" onclick="beginPractice()">OPEN PRACTICE</button><button class="btn" onclick="beginQuiz()" style="border-color:var(--accent);color:var(--accent2);">BEGIN QUIZ &rarr;</button></div></div>';
  var inp = document.getElementById('studentNameInput');
  inp.focus(); inp.select();
}
function beginQuiz(){
  var v = document.getElementById('studentNameInput').value.trim();
  studentName = v;
  try{ localStorage.setItem('practice-student-name', v); }catch(e){}
  mode = 'quiz';
  startQuiz();
}
function beginPractice(){
  var v = document.getElementById('studentNameInput').value.trim();
  studentName = v;
  try{ if(v) localStorage.setItem('practice-student-name', v); }catch(e){}
  mode = 'practice';
  startQuiz();
}
function endPractice(){ renderStart(); }

function startQuiz(){
  Q = mode === 'practice' ? shuffleArr(BANK) : shuffleArr(BANK).slice(0, 10);
  idx = 0; answers = [];
  renderQuestion();
}

function renderQuestion(){
  var p = Q[idx];
  var choicesOrder = shuffleArr(p.choices);
  var codeHtml = p.code ? '<div class="codeBox">'+p.code.map(escHtml).join('\n')+'</div>' : '';
  var html = (mode==='practice' ? '<div class="progressRow"><span class="mono" style="color:var(--accent2);">OPEN PRACTICE</span><span>Question <b style="color:var(--bright);">'+(idx+1)+'</b></span><button class="btn" style="padding:6px 12px;font-size:11px;margin-left:auto;" onclick="endPractice()">END &rarr;</button></div>' : '<div class="progressRow"><span>QUESTION <b style="color:var(--bright);">'+(idx+1)+'</b>/10</span><div class="progressBar"><div style="width:'+(idx/10*100)+'%;"></div></div></div>')
    + '<div class="meta">QUESTION '+(idx+1)+'</div>'
    + codeHtml
    + '<div class="stem">'+escHtml(p.stem)+'</div>'
    + '<div class="choices" id="choicesBox">' + choicesOrder.map(function(c){
        return '<button class="choice" onclick="pick('+JSON.stringify(c).replace(/"/g,'&quot;')+')">'+escHtml(c)+'</button>';
      }).join('') + '</div>'
    + '<div id="fbSlot"></div>'
    + '<div class="controls"><button class="btn" id="nextBtn" disabled onclick="nextQuestion()">'+(idx===9?'SEE RESULTS':'NEXT')+' &rarr;</button></div>';
  document.getElementById('quizPanel').innerHTML = html;
}

function pick(val){
  var p = Q[idx];
  if(answers[idx]) return;
  var correct = val === p.answer;
  answers[idx] = {pick:val, correct:correct};
  var btns = document.querySelectorAll('#choicesBox .choice');
  btns.forEach(function(b){
    b.disabled = true;
    var lbl = b.textContent.trim();
    if(lbl === p.answer) b.classList.add('correctPick');
    else if(lbl === val && !correct) b.classList.add('wrongPick');
  });
  var fb = '<div class="feedback '+(correct?'correct':'wrong')+'"><b>'+(correct?'CORRECT':'NOT QUITE — correct answer: '+escHtml(p.answer))+'</b>'+escHtml(p.explain)+'</div>';
  document.getElementById('fbSlot').innerHTML = fb;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  if(mode === 'practice'){
    idx++;
    if(idx >= Q.length){ Q = shuffleArr(BANK); idx = 0; }
    renderQuestion();
    return;
  }
  if(idx === 9){ showResults(); return; }
  idx++;
  renderQuestion();
}

function showResults(){
  var correctCount = answers.filter(function(a){return a.correct;}).length;
  var pct = Math.round(correctCount/10*100);
  var color = pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)';
  var html = '<div class="resultsWrap">'+(studentName?'<div class="resultName">'+escHtml(studentName)+'</div>':'')+'<div class="meta">RESULTS</div><div class="bigScore" style="color:'+color+';">'+correctCount+'/10</div><div class="mono" style="color:var(--dim);font-size:13px;margin-bottom:24px;">'+pct+'% correct</div></div>';
  html += Q.map(function(p, i){
    var a = answers[i];
    return '<div class="reviewRow"><span class="mark">'+(a.correct?'✅':'❌')+'</span><div><div class="mono" style="font-size:11.5px;color:var(--faint);margin-bottom:4px;">QUESTION '+(i+1)+' &middot; your answer: '+escHtml(a.pick)+(a.correct?'':' &middot; correct: '+escHtml(p.answer))+'</div><div style="font-size:13.5px;color:var(--muted);line-height:1.5;">'+escHtml(p.explain)+'</div></div></div>';
  }).join('');
  html += '<div class="controls" style="justify-content:center;margin-top:22px;"><button class="btn" onclick="startQuiz()">TRY AGAIN &rarr;</button></div>';
  document.getElementById('quizPanel').innerHTML = html;
}

renderStart();
</script>
</body>
</html>
