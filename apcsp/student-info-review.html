<!DOCTYPE html>

<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('course-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Info Review — AP Computer Science Principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a14;--panel:#15111d;--panel2:#1a1524;--border:#332845;--border2:#241d33;--border3:#48395f;--border-hi:#6a5788;--text:#d8d2e6;--bright:#f5f2ff;--muted:#aca2c4;--dim:#867ba0;--faint:#5d5279;--accent:#a855f7;--accent2:#c98bff;}
:root[data-theme="light"]{--bg:#f1eef7;--panel:#ffffff;--panel2:#f6f3fb;--border:#d7cfe4;--border2:#e4ddf0;--border3:#b8accf;--border-hi:#897ba8;--text:#2c2740;--bright:#140e26;--muted:#524a6a;--dim:#6f668c;--faint:#8d83a6;--accent:#8b2fd6;--accent2:#6f1fb0;}
*{box-sizing:border-box;}
body{margin:0;padding:40px 16px 80px;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);}
a{color:var(--accent);}
a:hover{color:var(--accent2);}
.mono{font-family:'JetBrains Mono',monospace;}
.wrap{max-width:920px;margin:0 auto;}
h1{font-size:22px;margin:0 0 4px;color:var(--bright);}
.sub{font-size:13px;color:var(--dim);margin:0 0 26px;}
.card{border:1px solid var(--border3);border-radius:14px;background:var(--panel);padding:22px;margin-bottom:16px;}
.btn{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;padding:11px 18px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#160a02;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--accent);}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
input[type=text]{font-family:'JetBrains Mono',monospace;font-size:13px;padding:10px 12px;border-radius:8px;border:1px solid var(--border3);background:var(--bg);color:var(--bright);}
.resp{border:1px solid var(--border2);border-radius:10px;padding:16px 18px;margin-bottom:12px;background:var(--panel2);}
.resp .who{display:flex;justify-content:space-between;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);margin-bottom:10px;}
.resp .who b{color:var(--bright);font-family:'Inter',sans-serif;font-size:14px;}
.qa{margin-bottom:8px;}
.qa .q{font-size:11.5px;letter-spacing:.3px;color:var(--faint);text-transform:uppercase;margin-bottom:2px;}
.qa .a{font-size:14px;color:var(--text);line-height:1.5;}
.empty{color:var(--faint);font-size:13.5px;padding:30px;text-align:center;}
.gate{max-width:420px;margin:80px auto;text-align:center;}
.gate .btn{width:100%;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel2);color:var(--dim);cursor:pointer;}
</style>
</head>
<body>
<button id="themeToggle" class="themebtn" onclick="__toggleTheme()">LIGHT</button>
<div class="wrap">
  <div id="app"><div class="empty">Loading…</div></div>
</div>
<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'\u25d0 DARK':'\u25d1 LIGHT';}window.__toggleTheme=function(){var cur=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',cur);try{localStorage.setItem(K,cur);}catch(e){}lbl();};lbl();})();</script>
<script src="../supabase-config.js"></script>
<script src="../auth.js"></script>
<script>
var course = "apcsp";
var LOCAL_KEY = "student-info-" + course;
var app = document.getElementById("app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

var QLABELS = {
  why_cs: "Why interested in AP CSP", hope_learn: "What they hope to learn",
  coding_before: "Coding experience before this class", know_you: "What they'd like me to know",
  unique: "One unique thing about them", fav_teacher: "Favorite teacher and why",
  talk_hour: "Could talk for an hour about", alone_group: "Alone or group work, and why",
  hidden_skill: "Hidden skill", learning_style: "Learning style",
  cs_outside: "Where they'd use CS outside class"
};
var RATING_GROUPS = {
  learn_methods: { seat: "Seat, listening/writing", pair_group: "Pair/group collaboration",
    breakdown: "Breaking tasks down & sharing", teacher_led: "Teacher-led discussion" },
  confidence_tech: { v: "Confidence with tech" },
  cs_knowledge: { v: "Prior CS knowledge" },
  speak_comfort: { v: "Comfort speaking up" },
  interests: { gaming: "Interest: gaming", coding: "Interest: coding", data: "Interest: data & analytics",
    design: "Interest: creative/visual design", building: "Interest: building/fixing" },
  challenge_style: { v: "Challenge style (1=structure, 5=independent)" },
  screen_time: { v: "Screen time / online-ness" },
  coding_experience: { v: "Coding experience" }
};

function renderList(rows, source){
  if (!rows.length) { app.innerHTML = '<div class="card"><div class="empty">No responses yet' + (source === 'local' ? ' on this device' : '') + '.</div></div>'; return; }
  var toolbar = '<div class="toolbar"><input type="text" id="search" placeholder="Filter by name or period…">' +
    '<button class="btn ghost" id="csvBtn">Export CSV</button>' +
    '<span class="mono" style="color:var(--faint);font-size:12px;margin-left:auto;">' + rows.length + ' response' + (rows.length === 1 ? '' : 's') + (source === 'local' ? ' · saved on this device only' : ' · from all devices') + '</span></div>';

  function card(r){
    var qa = Object.keys(QLABELS).map(function(k){
      return '<div class="qa"><div class="q">' + esc(QLABELS[k]) + '</div><div class="a">' + esc(r.answers[k] || '—') + '</div></div>';
    }).join("");
    var ratingQa = Object.keys(RATING_GROUPS).map(function(g){
      var vals = r.answers[g] || {};
      return Object.keys(RATING_GROUPS[g]).map(function(k){
        return '<div class="qa"><div class="q">' + esc(RATING_GROUPS[g][k]) + '</div><div class="a">' + (vals[k] || '—') + ' / 5</div></div>';
      }).join("");
    }).join("");
    var when = new Date(r.ts || r.created_at).toLocaleString();
    return '<div class="resp" data-name="' + esc((r.name||'').toLowerCase()) + '" data-period="' + esc((r.period||'').toLowerCase()) + '">' +
      '<div class="who"><b>' + esc(r.name || 'Unnamed') + '</b><span>' + esc(r.period || '—') + ' · ' + esc(when) + '</span></div>' + qa + ratingQa + '</div>';
  }

  app.innerHTML = '<h1>Student Info — responses</h1><div class="sub">AP Computer Science Principles · Day 0 warm-up</div>' + toolbar +
    '<div id="list">' + rows.map(card).join("") + '</div>';

  document.getElementById("search").addEventListener("input", function(e){
    var v = e.target.value.toLowerCase();
    document.querySelectorAll("#list .resp").forEach(function(el){
      var hit = el.getAttribute("data-name").indexOf(v) !== -1 || el.getAttribute("data-period").indexOf(v) !== -1;
      el.style.display = hit ? "" : "none";
    });
  });
  document.getElementById("csvBtn").addEventListener("click", function(){
    var ratingCols = [];
    Object.keys(RATING_GROUPS).forEach(function(g){ Object.keys(RATING_GROUPS[g]).forEach(function(k){ ratingCols.push(g + "_" + k); }); });
    var head = ["name","period","when"].concat(Object.keys(QLABELS)).concat(ratingCols);
    var lines = [head.join(",")];
    rows.forEach(function(r){
      var when = new Date(r.ts || r.created_at).toISOString();
      var ratingVals = [];
      Object.keys(RATING_GROUPS).forEach(function(g){ var vals = r.answers[g] || {}; Object.keys(RATING_GROUPS[g]).forEach(function(k){ ratingVals.push(vals[k] || ""); }); });
      var cells = [r.name || "", r.period || "", when]
        .concat(Object.keys(QLABELS).map(function(k){ return r.answers[k] || ""; }))
        .concat(ratingVals);
      lines.push(cells.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(","));
    });
    var blob = new Blob([lines.join("\n")], {type:"text/csv"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "student-info-responses.csv"; a.click();
  });
}

function loadLocal(){
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch(e) { return []; }
}

async function loadCloud(){
  if (!window.CTF_AUTH || !window.CTF_AUTH.online) return null;
  var u = await window.CTF_AUTH.requireSchool();
  if (!u || u.wrongDomain) return "gate";
  if (!window.CTF_AUTH.isTeacher(u)) return "gate";
  try {
    var rows = await window.CTF_AUTH.rpc("ctf_t_target_warmup", { p_course: course });
    return Array.isArray(rows) ? rows : [];
  } catch(e) { return null; }
}

function renderGate(){
  app.innerHTML = '<div class="gate"><h1>Teacher sign-in required</h1><p class="sub">Sign in with your school Google account to view responses saved to the shared backend.</p><button class="btn" id="signinBtn">Sign in with Google</button></div>';
  document.getElementById("signinBtn").addEventListener("click", function(){ window.CTF_AUTH.signIn(); });
}

(async function(){
  var cloud = await loadCloud();
  if (cloud === "gate") { renderGate(); return; }
  if (Array.isArray(cloud)) { renderList(cloud, "cloud"); return; }
  renderList(loadLocal(), "local");
})();
</script>
</body>
</html>
