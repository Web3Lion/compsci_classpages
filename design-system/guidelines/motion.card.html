<!-- @dsCard group="Brand" viewport="700x140" subtitle="Loops idle, never bounces — blink, led, spin, float, sheen" name="Motion" -->
<!DOCTYPE html><html lang="en" data-course="cyber1"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
body{padding:18px;background-image:var(--field-image);background-size:var(--field-size) var(--field-size);}
.mono{font-family:var(--font-mono);}</style></head><body>
<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;">
<div style="text-align:center;"><span style="display:inline-block;width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;"></span><div class="mono" style="font-size:9px;color:var(--fainter);margin-top:6px;">spin</div></div>
<div style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:var(--glow-sm);animation:led 1.9s ease-in-out infinite;"></span><div class="mono" style="font-size:9px;color:var(--fainter);margin-top:6px;">led</div></div>
<div style="text-align:center;"><span style="display:inline-block;width:14px;height:26px;background:var(--accent);animation:blink 1.1s step-end infinite;"></span><div class="mono" style="font-size:9px;color:var(--fainter);margin-top:6px;">blink</div></div>
<div style="text-align:center;"><span style="display:inline-block;width:34px;height:34px;border-radius:var(--r-sm);background:var(--panel3);border:1px solid var(--accent);animation:floatY 7s ease-in-out infinite;"></span><div class="mono" style="font-size:9px;color:var(--fainter);margin-top:6px;">floatY</div></div>
<div class="mono" style="font-size:10px;color:var(--dim);max-width:230px;line-height:1.6;">Press = translateY(2px) scale(.99) + inset shadow. Hover = lift 3px + accent ring.</div>
</div>
</body></html>
