<!-- @dsCard group="Colors" viewport="700x130" subtitle="Constant across every course — Easy/Medium/Hard map to ok/warn/bad" name="Status & difficulty" -->
<!DOCTYPE html><html lang="en" data-course="cyber1"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
body{padding:18px;background-image:var(--field-image);background-size:var(--field-size) var(--field-size);}
.mono{font-family:var(--font-mono);}</style></head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap;">
<span class="mono" style="font-size:11px;font-weight:700;letter-spacing:var(--ls-pill);padding:8px 14px;border-radius:var(--r-sm);color:var(--ok);background:color-mix(in srgb, var(--ok) 13%, transparent);border:1px solid color-mix(in srgb, var(--ok) 40%, transparent);">OK / EASY</span><span class="mono" style="font-size:11px;font-weight:700;letter-spacing:var(--ls-pill);padding:8px 14px;border-radius:var(--r-sm);color:var(--warn);background:color-mix(in srgb, var(--warn) 13%, transparent);border:1px solid color-mix(in srgb, var(--warn) 40%, transparent);">WARN / MEDIUM</span><span class="mono" style="font-size:11px;font-weight:700;letter-spacing:var(--ls-pill);padding:8px 14px;border-radius:var(--r-sm);color:var(--bad);background:color-mix(in srgb, var(--bad) 13%, transparent);border:1px solid color-mix(in srgb, var(--bad) 40%, transparent);">BAD / HARD</span><span class="mono" style="font-size:11px;font-weight:700;letter-spacing:var(--ls-pill);padding:8px 14px;border-radius:var(--r-sm);color:var(--amber);background:color-mix(in srgb, var(--amber) 13%, transparent);border:1px solid color-mix(in srgb, var(--amber) 40%, transparent);">HINT / CAUTION</span>
</div>
<div class="mono" style="font-size:10px;color:var(--faint);margin-top:12px;">tinted fill at ~13% · border at ~40% · full-strength text</div>
</body></html>
