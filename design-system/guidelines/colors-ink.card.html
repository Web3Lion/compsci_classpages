<!-- @dsCard group="Colors" viewport="700x130" subtitle="Six weights of text, brightest to faintest" name="Ink scale" -->
<!DOCTYPE html><html lang="en" data-course="cyber1"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
body{padding:18px;background-image:var(--field-image);background-size:var(--field-size) var(--field-size);}
.mono{font-family:var(--font-mono);}</style></head><body>
<div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;">
<div><div style="font-size:20px;font-weight:700;color:var(--bright);">Bright</div><div class="mono" style="font-size:9px;color:var(--fainter);">--bright<br>headings</div></div><div><div style="font-size:20px;font-weight:700;color:var(--text);">Text</div><div class="mono" style="font-size:9px;color:var(--fainter);">--text<br>body</div></div><div><div style="font-size:20px;font-weight:700;color:var(--muted);">Muted</div><div class="mono" style="font-size:9px;color:var(--fainter);">--muted<br>secondary</div></div><div><div style="font-size:20px;font-weight:700;color:var(--dim);">Dim</div><div class="mono" style="font-size:9px;color:var(--fainter);">--dim<br>meta</div></div><div><div style="font-size:20px;font-weight:700;color:var(--faint);">Faint</div><div class="mono" style="font-size:9px;color:var(--fainter);">--faint<br>labels</div></div><div><div style="font-size:20px;font-weight:700;color:var(--fainter);">Fainter</div><div class="mono" style="font-size:9px;color:var(--fainter);">--fainter<br>hairline</div></div>
</div>
</body></html>
