<!-- @dsCard group="Colors" viewport="700x120" subtitle="Quiet to loud — nested cards step down, focus steps up" name="Borders" -->
<!DOCTYPE html><html lang="en" data-course="cyber1"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
body{padding:18px;background-image:var(--field-image);background-size:var(--field-size) var(--field-size);}
.mono{font-family:var(--font-mono);}</style></head><body>
<div style="display:flex;gap:8px;"><div style="flex:1;min-width:0;">
  <div style="height:44px;border-radius:var(--r-md);border:var(--stroke);background:var(--border2);"></div>
  <div class="mono" style="font-size:10px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">--border2</div>
  <div class="mono" style="font-size:9px;color:var(--fainter);">inner rows</div>
</div><div style="flex:1;min-width:0;">
  <div style="height:44px;border-radius:var(--r-md);border:var(--stroke);background:var(--border);"></div>
  <div class="mono" style="font-size:10px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">--border</div>
  <div class="mono" style="font-size:9px;color:var(--fainter);">standard card</div>
</div><div style="flex:1;min-width:0;">
  <div style="height:44px;border-radius:var(--r-md);border:var(--stroke);background:var(--border3);"></div>
  <div class="mono" style="font-size:10px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">--border3</div>
  <div class="mono" style="font-size:9px;color:var(--fainter);">inputs / buttons</div>
</div><div style="flex:1;min-width:0;">
  <div style="height:44px;border-radius:var(--r-md);border:var(--stroke);background:var(--border-hi);"></div>
  <div class="mono" style="font-size:10px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">--border-hi</div>
  <div class="mono" style="font-size:9px;color:var(--fainter);">emphasis</div>
</div></div>
</body></html>
