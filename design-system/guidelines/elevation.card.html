<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Shadows are accent-tinted, never neutral grey" name="Elevation & glow" -->
<!DOCTYPE html><html lang="en" data-course="cyber1"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
body{padding:18px;background-image:var(--field-image);background-size:var(--field-size) var(--field-size);}
.mono{font-family:var(--font-mono);}</style></head><body>
<div style="display:flex;gap:14px;flex-wrap:wrap;">
<div style="flex:1;min-width:120px;background:var(--panel);border:var(--stroke);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-hover)">
<div class="mono" style="font-size:11px;color:var(--accent);font-weight:700;">hover</div></div><div style="flex:1;min-width:120px;background:var(--panel);border:var(--stroke);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-lift);transform:translateY(-3px)">
<div class="mono" style="font-size:11px;color:var(--accent);font-weight:700;">lift</div></div><div style="flex:1;min-width:120px;background:var(--panel);border:var(--stroke);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-ring), var(--shadow-lift)">
<div class="mono" style="font-size:11px;color:var(--accent);font-weight:700;">ring</div></div><div style="flex:1;min-width:120px;background:var(--panel);border:var(--stroke);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-press)">
<div class="mono" style="font-size:11px;color:var(--accent);font-weight:700;">press</div></div>
</div>
</body></html>
