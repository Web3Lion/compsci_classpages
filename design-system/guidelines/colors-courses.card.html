<!-- @dsCard group="Colors" viewport="700x150" subtitle="One hue per course — the only value that changes between arenas" name="Course accents" -->
<!DOCTYPE html><html lang="en" data-course="cyber1"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
body{padding:18px;background-image:var(--field-image);background-size:var(--field-size) var(--field-size);}
.mono{font-family:var(--font-mono);}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
<div data-course="cyber1" style="border:var(--stroke);border-radius:var(--r-lg);background:var(--panel);padding:12px;">
  <div style="height:26px;border-radius:var(--r-sm);background:var(--accent);box-shadow:var(--glow-sm);"></div>
  <div class="mono" style="font-size:11px;color:var(--accent);margin-top:8px;font-weight:700;">Cyber 1</div>
  <div class="mono" style="font-size:9px;color:var(--dim);">#00b3ff</div></div><div data-course="cyber2" style="border:var(--stroke);border-radius:var(--r-lg);background:var(--panel);padding:12px;">
  <div style="height:26px;border-radius:var(--r-sm);background:var(--accent);box-shadow:var(--glow-sm);"></div>
  <div class="mono" style="font-size:11px;color:var(--accent);margin-top:8px;font-weight:700;">Cyber 2</div>
  <div class="mono" style="font-size:9px;color:var(--dim);">#39ff88</div></div><div data-course="apcsp" style="border:var(--stroke);border-radius:var(--r-lg);background:var(--panel);padding:12px;">
  <div style="height:26px;border-radius:var(--r-sm);background:var(--accent);box-shadow:var(--glow-sm);"></div>
  <div class="mono" style="font-size:11px;color:var(--accent);margin-top:8px;font-weight:700;">Byte Bounty</div>
  <div class="mono" style="font-size:9px;color:var(--dim);">#a855f7</div></div><div data-course="web3" style="border:var(--stroke);border-radius:var(--r-lg);background:var(--panel);padding:12px;">
  <div style="height:26px;border-radius:var(--r-sm);background:var(--accent);box-shadow:var(--glow-sm);"></div>
  <div class="mono" style="font-size:11px;color:var(--accent);margin-top:8px;font-weight:700;">Web 3.0</div>
  <div class="mono" style="font-size:9px;color:var(--dim);">#f7931a</div></div>
</div>
</body></html>
