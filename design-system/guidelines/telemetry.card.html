<!DOCTYPE html><html lang="en" data-course="cyber1"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);}
body{padding:18px;background-image:var(--field-image);background-size:var(--field-size) var(--field-size);}
.mono{font-family:var(--font-mono);}</style></head><body>
<div class="mono" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:11px;letter-spacing:1px;color:var(--faint);">
<span style="display:inline-flex;align-items:center;gap:7px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:var(--glow-sm);animation:led 1.5s ease-in-out infinite;"></span>NODE ONLINE</span>
<span>WEB3-2026</span><span>REV&nbsp;1.0</span><span>CHAIN&nbsp;SYNCED</span></div>
<div class="mono" style="margin-top:16px;font-weight:800;font-size:26px;color:var(--bright);letter-spacing:-.5px;">Ready<span style="display:inline-block;width:11px;height:24px;background:var(--accent);margin-left:8px;vertical-align:middle;animation:blink 1.1s step-end infinite;"></span></div>
</body></html>
