<!DOCTYPE html>

<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('course-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="../site.js?v=9.0.0"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mastermind — Example Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a14;--panel:#15111d;--panel2:#1a1524;--border:#332845;--border2:#241d33;--border3:#48395f;--text:#d8d2e6;--bright:#f5f2ff;--muted:#aca2c4;--dim:#867ba0;--faint:#6d6289;--accent:#a855f7;--accent2:#c98bff;}
:root[data-theme="light"]{--bg:#f1eef7;--panel:#ffffff;--panel2:#f6f3fb;--border:#d7cfe4;--border2:#e4ddf0;--border3:#b8accf;--text:#2c2740;--bright:#140e26;--muted:#524a6a;--dim:#6f668c;--faint:#7a7096;--accent:#8b2fd6;--accent2:#6f1fb0;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);transition:background-color .25s ease,color .25s ease;}
a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent2);}
.mono{font-family:'JetBrains Mono',monospace;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.themebtn:hover{border-color:var(--accent);}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 60px;}
.tb{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid #3a3a3a;background:#1e1e1e;color:#e6e6e6;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;}
.tb:hover{border-color:#8a8a8a;}
.tb.run{background:#2f7d32;border-color:#2f7d32;color:#fff;}
.tb.run:hover{background:#38913b;}
/* the console is always a real console: black, regardless of site theme */
#term{height:min(62vh,560px);overflow-y:auto;padding:14px 16px 18px;background:#0c0c0c;color:#cccccc;font-family:Consolas,'Cascadia Mono','JetBrains Mono',monospace;font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word;cursor:text;}
#term .err{color:#ff6b6b;}
#term .sys{color:#7a7a7a;}
#inLine{display:flex;}
#inLine input{flex:1;min-width:2ch;padding:0;margin:0;border:0;outline:0;background:transparent;color:#cccccc;font:inherit;caret-color:#cccccc;}
@media(max-width:720px){.wrap{padding:0 12px 48px;}.themebtn{top:8px;right:8px;}#term{font-size:14px;}}
</style>
</head>
<body>
<button id="themeToggle" class="themebtn" onclick="__toggleTheme()">LIGHT</button>
<main class="wrap" id="main">
  <a class="mono" href="index.html" style="display:inline-flex;align-items:center;min-height:44px;margin-top:18px;font-size:12px;color:var(--dim);">&larr; Example programs</a>

  <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 6px;">
    <h1 class="mono" style="margin:0;font-weight:800;font-size:clamp(26px,4.4vw,36px);color:var(--bright);">Mastermind</h1>
    <span class="mono" style="white-space:nowrap;flex:none;font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 9px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);">AP CSP</span>
  </div>
  <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:var(--muted);max-width:680px;text-wrap:pretty;">The computer has picked four secret numbers, each from 1 to 9. Type a guess for each one and press Enter. Play until you crack the code, and pay attention to exactly what the program prints. You'll be building this yourself next.</p>

  <div style="border:1px solid #2a2a2a;border-radius:12px;overflow:hidden;box-shadow:0 24px 50px -30px rgba(0,0,0,.7);">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;">
      <span class="mono" style="font-size:12px;color:#9a9a9a;padding:0 6px;">mastermind.py</span>
      <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="tb run" id="runBtn">&#9654; Run</button>
        <button type="button" class="tb" id="clearBtn">Clear</button>
      </span>
    </div>
    <div id="term" role="log" aria-live="polite" aria-label="Program output"><div id="out"></div><div id="inLine" hidden><span id="inPrompt"></span><input id="inBox" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Program input"></div></div>
  </div>

  <label class="mono" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:10px;font-size:12px;color:var(--dim);cursor:pointer;"><input type="checkbox" id="dbg" style="width:16px;height:16px;accent-color:var(--accent);"> Debug mode: print the answer when the program starts</label>
</main>

<script>
(function(){
  var out = document.getElementById('out'), line = document.getElementById('inLine'), pr = document.getElementById('inPrompt'),
      box = document.getElementById('inBox'), term = document.getElementById('term'), dbg = document.getElementById('dbg');
  var run = 0, waiting = null;

  function print(s, cls){ var d = document.createElement('div'); d.textContent = s === '' ? '\u200b' : s; if (cls) d.className = cls; out.appendChild(d); term.scrollTop = term.scrollHeight; }
  function input(p, id){
    return new Promise(function(res){
      if (id !== run) return;
      pr.textContent = p; box.value = ''; line.hidden = false; waiting = function(v){ line.hidden = true; print(p + v); res(v); };
      box.focus({preventScroll:true}); term.scrollTop = term.scrollHeight;
    });
  }
  /* Python's int(): optional whitespace and sign around digits, else ValueError */
  function pyInt(s, src){
    if (/^\s*[+-]?\d+(_\d+)*\s*$/.test(s)) return parseInt(s.replace(/_/g, ''), 10);
    var e = new Error(); e.py = true; e.src = src; e.val = s; throw e;
  }
  var SRC = [
    [36, 'guess1 = int(input("What do you think the first number is? "))'],
    [37, 'guess2 = int(input("What do you think the second number is? "))'],
    [38, 'guess3 = int(input("What do you think the third number is? "))'],
    [39, 'guess4 = int(input("What do you think the fourth number is? "))']
  ];
  var ASK = ['first', 'second', 'third', 'fourth'];

  async function program(id){
    var answer = [];
    for (var i = 0; i < 4; i++) answer.push(1 + Math.floor(Math.random() * 9));
    if (dbg.checked) print('[' + answer.join(', ') + ']');
    print(''); print(''); print('');
    var tries = 0, count = 0;
    try {
      while (count !== 4){
        tries = tries + 1;
        var g = [];
        for (var k = 0; k < 4; k++){
          var raw = await input('What do you think the ' + ASK[k] + ' number is? ', id);
          if (id !== run) return;
          g.push(pyInt(raw, SRC[k]));
        }
        count = 0;
        for (var j = 0; j < 4; j++) if (g[j] === answer[j]) count = count + 1;
        print('You guessed ' + count + ' correctly.');
      }
      print('Congratulations, it took you ' + tries + ' tries.');
      print(''); print('Process finished. Press \u25b6 Run to play again.', 'sys');
    } catch (e){
      if (!e.py) throw e;
      print('Traceback (most recent call last):', 'err');
      print('  File "mastermind.py", line ' + e.src[0] + ', in <module>', 'err');
      print('    ' + e.src[1], 'err');
      print("ValueError: invalid literal for int() with base 10: '" + e.val.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'", 'err');
      print(''); print('Process finished with an error. Press \u25b6 Run to try again.', 'sys');
    }
  }
  function start(){ run++; waiting = null; line.hidden = true; out.innerHTML = ''; program(run); }

  box.addEventListener('keydown', function(e){ if (e.key === 'Enter' && waiting){ e.preventDefault(); var w = waiting; waiting = null; w(box.value); } });
  term.addEventListener('click', function(){ if (!line.hidden && !getSelection().toString()) box.focus({preventScroll:true}); });
  document.getElementById('runBtn').addEventListener('click', start);
  document.getElementById('clearBtn').addEventListener('click', function(){ var keep = !line.hidden; out.innerHTML = ''; if (keep) box.focus({preventScroll:true}); });
  start();
})();
</script>
<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'◐ DARK':'◑ LIGHT';}window.__toggleTheme=function(){var t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem(K,t);}catch(e){}lbl();};lbl();})();</script>
</body>
</html>
