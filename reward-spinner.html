<style>
:root{--bg:#0a0e14;--panel:#0b1220;--panel2:#0c1626;--panel3:#0e2136;--border:#1e3350;--border2:#172436;--border3:#244a6d;--text:#cfe0f3;--bright:#eaf4ff;--muted:#a9bfd6;--dim:#7f9cb8;--faint:#5c7592;--accent:#00b3ff;--accent2:#7dd8ff;--amber:#ffcf5c;}
:root[data-theme="light"]{--bg:#e9eef5;--panel:#ffffff;--panel2:#f2f6fb;--panel3:#e8f1fb;--border:#cdd8e5;--border2:#dde5ef;--border3:#b6c8dc;--text:#26313f;--bright:#0e1622;--muted:#48566a;--dim:#5f7186;--faint:#8394a8;--accent:#0a74d6;--accent2:#075aa8;--amber:#9a7d16;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;}
#spotlight{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
#spotlight .glow{position:absolute;width:70vw;height:70vw;border-radius:50%;background:radial-gradient(circle, rgba(255,0,200,.28) 0%, transparent 65%);top:-25vw;left:-15vw;filter:blur(20px);animation:driftA 16s ease-in-out infinite;}
#spotlight .glow2{position:absolute;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle, rgba(0,240,255,.22) 0%, transparent 65%);bottom:-20vw;right:-10vw;filter:blur(20px);animation:driftB 21s ease-in-out infinite;}
#spotlight .glow3{position:absolute;width:40vw;height:40vw;border-radius:50%;background:radial-gradient(circle, rgba(176,38,255,.2) 0%, transparent 65%);top:30%;left:50%;filter:blur(24px);animation:driftC 13s ease-in-out infinite;}
@keyframes driftA{0%{transform:translate(0,0) scale(1);}25%{transform:translate(10vw,6vw) scale(1.1);}50%{transform:translate(4vw,16vw) scale(0.95);}75%{transform:translate(-8vw,6vw) scale(1.05);}100%{transform:translate(0,0) scale(1);}}
@keyframes driftB{0%{transform:translate(0,0) scale(1);}30%{transform:translate(-9vw,-8vw) scale(1.08);}60%{transform:translate(-3vw,7vw) scale(0.94);}100%{transform:translate(0,0) scale(1);}}
@keyframes driftC{0%{transform:translate(-50%,0) scale(1);opacity:.5;}50%{transform:translate(-30%,-10vh) scale(1.25);opacity:1;}100%{transform:translate(-50%,0) scale(1);opacity:.5;}}
.wrap{position:relative;z-index:1;}
.mono{font-family:'JetBrains Mono',monospace;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.themebtn:hover{border-color:var(--accent);}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 50px;text-align:center;}
.kick{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;}
h1{font-weight:800;font-size:26px;margin:6px 0 4px;color:var(--bright);letter-spacing:-.5px;}
.lead{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 20px;}
#layout{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:left;}
#stage{position:relative;width:min(380px,44vw);min-width:260px;margin:0 auto;filter:drop-shadow(0 0 40px rgba(255,0,200,.25)) drop-shadow(0 0 70px rgba(0,240,255,.18));}
#rightCol{display:flex;flex-direction:column;gap:18px;min-width:230px;}
#odds h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:0 0 10px;}
#odds ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
#odds li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
#odds .sw{width:12px;height:12px;border-radius:3px;flex:none;}
#odds .pct{margin-left:auto;font-weight:700;color:var(--bright);font-family:'JetBrains Mono',monospace;}
#pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:22px solid #00f0ff;filter:drop-shadow(0 0 8px #00f0ff);}
#wheel{display:block;width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 6px var(--panel), 0 0 0 8px #ff00c8, 0 20px 60px -20px rgba(0,0,0,.7);}
#hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,#ff00c8,#00f0ff);border:3px solid var(--panel);z-index:1;box-shadow:0 0 18px rgba(0,240,255,.6);}
#spinBtn{margin-top:0;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;letter-spacing:1px;padding:14px 0;width:100%;border-radius:999px;border:none;background:linear-gradient(90deg,#ff00c8,#00f0ff);color:#04040a;cursor:pointer;box-shadow:0 0 24px rgba(255,0,200,.4);}
#spinBtn:hover:not(:disabled){filter:brightness(1.08);}
#spinBtn:disabled{opacity:.55;cursor:not-allowed;}
#result{margin-top:0;min-height:0;}
#result .card{display:none;border:1px solid var(--accent);border-radius:14px;padding:18px 22px;background:var(--panel2);}
#result.show .card{display:block;animation:pop .4s ease;}
@keyframes pop{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
#result .rl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);}
#result .rv{font-size:22px;font-weight:800;color:var(--bright);margin-top:4px;}
#history{margin-top:26px;text-align:left;}
#history h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:0 0 10px;}
#history ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
#history li{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;border-bottom:1px solid var(--border2);padding-bottom:6px;}
#history .empty{color:var(--faint);font-size:13px;}
#confettiWrap{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden;}
.confetti{position:absolute;top:-20px;width:9px;height:14px;opacity:.9;animation:confettiFall linear forwards;}
@keyframes confettiFall{to{transform:translateY(105vh) rotate(540deg);opacity:.3;}}
.back{display:inline-block;margin-top:40px;font-size:13px;color:var(--dim);}
#award h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:0 0 8px;}
#award select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--border3);background:var(--panel);color:var(--bright);font-family:'JetBrains Mono',monospace;font-size:13px;margin-bottom:8px;}
#sendBtn{font-weight:700;font-size:13px;letter-spacing:1px;padding:10px 0;width:100%;border-radius:999px;border:1px solid #00f0ff;background:transparent;color:var(--bright);cursor:pointer;}
#sendBtn:disabled{opacity:.55;cursor:not-allowed;}
#sendMsg{font-size:12px;margin-top:8px;color:var(--dim);}
body[data-lock] #rightCol, body[data-lock] #history, body[data-lock] .lead{display:none;}
body[data-lock] #stage{filter:grayscale(1);opacity:.45;pointer-events:none;}
body[data-lock] #spotlight{opacity:.25;}
#lockMsg{display:none;margin-top:26px;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--muted);}
body[data-lock] #lockMsg{display:block;}
body[data-lock] .back{display:none;}
</style>
</head>
<body data-lock="1">
<button id="themeToggle" class="themebtn" onclick="__toggleTheme()">LIGHT</button>
<div id="spotlight"><div class="glow"></div><div class="glow2"></div><div class="glow3"></div></div>
<div id="confettiWrap"></div>

<div class="wrap">
  <div class="kick mono">&gt; ./class-rewards</div>
  <h1 class="mono">Reward Spinner</h1>
  <p class="lead">Spin for a class reward. Bigger prizes come up less often.</p>

  <div id="layout">
  <div id="stage">
    <div id="pointer"></div>
    <canvas id="wheel"></canvas>
    <div id="hub"></div>
  </div>

  <div id="rightCol">
    <div id="odds">
      <h2 class="mono">Odds</h2>
      <ul id="oddsList"></ul>
    </div>
    <button id="spinBtn" onclick="spin()">SPIN</button>
    <div id="result">
      <div class="card">
        <div class="rl mono">You won</div>
        <div class="rv" id="resultText">—</div>
        <div id="sendRow" style="display:none;margin-top:14px;">
          <button id="sendBtn" class="mono" onclick="sendPrize()">SEND TO PROFILE</button>
          <div id="sendMsg" class="mono"></div>
        </div>
      </div>
    </div>
    <div id="award">
      <h2 class="mono">Spin for</h2>
      <div id="awardBody" class="mono" style="font-size:12px;color:var(--faint);line-height:1.6;">Checking teacher sign-in…</div>
    </div>
  </div>
  </div>
  <div id="lockMsg" class="mono">The teacher is not available for spinning.</div>

  <div id="history">
    <h2 class="mono">Recent spins</h2>
    <ul id="historyList"></ul>
  </div>

  <a class="back mono" href="teacher.html">&larr; back to teacher dashboard</a>
</div>

<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'◐ DARK':'◑ LIGHT';}window.__toggleTheme=function(){var t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem(K,t);}catch(e){}lbl();redrawTheme();};lbl();})();</script>
<script>
// Higher-value rewards get lower weight (less probable). Sum = 100 for easy % reading.
// Each reward is split into multiple slices scattered around the wheel for a busier,
// more colorful spin — probability per reward is unchanged (its weight, summed).
var REWARDS = [
  {label:"Sticker Sheet",                          lines:["Sticker","Sheet"],   weight:11, slices:3, kind:"voucher"},
  {label:"Teacher Reward",                         lines:["Teacher","Reward"],  weight:10, slices:3, kind:"voucher"},
  {label:"Streak Freeze (1 Week)",                 lines:["Streak","Freeze"],  weight:15, slices:2, kind:"freeze"},
  {label:"Nightly Homework Pass",                  lines:["Homework","Pass"],   weight:9, slices:2, kind:"voucher"},
  {label:"2x XP for 24 Hours",                     lines:["2x XP","24 Hours"], weight:15, slices:2, kind:"xp2x"},
  {label:"1-Day Homework/Project Extension",       lines:["1-Day","Extension"], weight:7, slices:2, kind:"voucher"},
  {label:"+500 Bonus XP",                          lines:["+500","XP"],        weight:15,  slices:2, kind:"xp500"},
  {label:"+1 Bonus Point (Graded Assignment)",     lines:["+1 Bonus","Point"],  weight:10,  slices:2, kind:"voucher"},
  {label:"1% Unit Test/Quiz Bonus",                lines:["1% Test","Bonus"],   weight:6,  slices:1, kind:"voucher"},
  {label:"2% Unit Test/Quiz Bonus",                lines:["2% Test","Bonus"],   weight:2,  slices:1, kind:"voucher"}
];
var NEON = ["#ff00c8","#00f0ff","#b026ff","#fff500","#39ff14","#ff4d6d","#05d9e8","#ff8a00","#d100d1","#7dff6e","#ff2079","#00ffa2","#8f00ff","#ffd400","#00b3ff","#ff5ec4"];
var TOTAL_WEIGHT = REWARDS.reduce(function(s,r){return s+r.weight;},0);
var segs = []; (function(){
  // interleave: pass N puts each reward's Nth slice in the same round, so equal
  // rewards are spread around the wheel instead of sitting next to each other.
  var maxSlices = Math.max.apply(null, REWARDS.map(function(r){ return r.slices; }));
  REWARDS.forEach(function(r, i){ r.num = i+1; });
  var order = [];
  for (var pass=0; pass<maxSlices; pass++){
    REWARDS.forEach(function(r){ if (pass < r.slices) order.push(r); });
  }
  // avoid two slices of the same reward landing next to each other where the
  // wheel wraps back around (first slice meets last slice)
  while (order.length > 1 && order[0].num === order[order.length-1].num){
    order.splice(Math.floor(order.length/2), 0, order.pop());
  }
  var acc = 0, colorIdx = 0;
  order.forEach(function(r){
    var sliceWeight = r.weight/r.slices;
    var start = acc/TOTAL_WEIGHT*360; acc += sliceWeight; var end = acc/TOTAL_WEIGHT*360;
    var color = NEON[colorIdx % NEON.length]; colorIdx++;
    segs.push(Object.assign({}, r, {start:start, end:end, color:color, text:"#0a0014"}));
  });
})();

var canvas = document.getElementById('wheel'), ctx = canvas.getContext('2d');
function drawWheel(){
  var dpr = window.devicePixelRatio || 1;
  var size = canvas.clientWidth || 420;
  canvas.width = size*dpr; canvas.height = size*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var cx = size/2, cy = size/2, r = size/2 - 4;
  ctx.clearRect(0,0,size,size);
  segs.forEach(function(s){
    var a0 = (s.start-90)*Math.PI/180, a1 = (s.end-90)*Math.PI/180;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a0,a1); ctx.closePath();
    ctx.fillStyle = s.color; ctx.fill();
    ctx.strokeStyle = 'rgba(6,10,16,.55)'; ctx.lineWidth = 2; ctx.stroke();
    var mid = (a0+a1)/2;
    ctx.save();
    ctx.translate(cx + Math.cos(mid)*r*0.62, cy + Math.sin(mid)*r*0.62);
    ctx.rotate(mid - Math.PI/2);
    ctx.fillStyle = s.text;
    ctx.font = '800 ' + Math.max(20, size*0.09) + 'px Inter, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(s.num), 0, 0);
    ctx.restore();
  });
}
function redrawTheme(){ drawWheel(); }
window.addEventListener('resize', drawWheel);
drawWheel();
renderOdds();

var spinning = false, totalRotation = 0;
function pickReward(){
  var r = Math.random()*TOTAL_WEIGHT, acc = 0;
  for (var i=0;i<segs.length;i++){ acc += segs[i].weight; if (r < acc) return segs[i]; }
  return segs[segs.length-1];
}
function fireConfetti(big){
  var colors = ["#00b3ff","#7dd8ff","#ffd54a","#5cf07a","#ff6b9d"];
  var wrap = document.getElementById('confettiWrap');
  var n = big ? 90 : 45;
  for (var i=0;i<n;i++){
    var c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random()*100) + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (2 + Math.random()*1.5) + 's';
    c.style.animationDelay = (Math.random()*0.4) + 's';
    wrap.appendChild(c);
    (function(elm){ setTimeout(function(){ elm.remove(); }, 4000); })(c);
  }
}
function loadHistory(){ try{ return JSON.parse(localStorage.getItem('reward-spin-history')||'[]'); }catch(e){ return []; } }
function logHistory(reward){
  var h = loadHistory();
  h.unshift({label:reward.label, ts:Date.now()});
  h = h.slice(0,8);
  localStorage.setItem('reward-spin-history', JSON.stringify(h));
  renderHistory();
}
function renderHistory(){
  var h = loadHistory();
  var list = document.getElementById('historyList');
  if (!h.length){ list.innerHTML = '<li class="empty">No spins yet.</li>'; return; }
  list.innerHTML = h.map(function(e){
    var d = new Date(e.ts);
    return '<li><span>' + e.label + '</span><span class="mono">' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) + '</span></li>';
  }).join('');
}
renderHistory();

function renderOdds(){
  var list = document.getElementById('oddsList');
  var sorted = REWARDS.slice().sort(function(a,b){ return b.weight - a.weight; });
  list.innerHTML = sorted.map(function(r){
    var color = segs.filter(function(s){ return s.label===r.label; })[0].color;
    var pct = Math.round(r.weight/TOTAL_WEIGHT*1000)/10;
    return '<li><span class="sw" style="background:'+color+';"></span><span class="mono" style="font-weight:800;color:var(--bright);width:16px;">' + r.num + '</span>' + r.label + '<span class="pct">' + (pct%1===0?pct:pct.toFixed(1)) + '%</span></li>';
  }).join('');
}
function showResult(reward){
  document.getElementById('resultText').textContent = reward.label;
  document.getElementById('result').classList.add('show');
  fireConfetti(reward.label === '2% Unit Test/Quiz Bonus' || reward.kind === 'xp500');
  if (window.__awardReady) window.__awardReady(reward);
}
function spin(){
  if (spinning || document.body.hasAttribute('data-lock')) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('result').classList.remove('show');
  var chosen = pickReward();
  var theta = chosen.start + Math.random()*(chosen.end - chosen.start);
  var targetMod = (360 - theta + 360) % 360;
  var extraSpins = 6 + Math.floor(Math.random()*3);
  var newTotal = totalRotation - (totalRotation % 360) + 360*extraSpins + targetMod;
  if (newTotal <= totalRotation) newTotal += 360;
  totalRotation = newTotal;
  canvas.style.transition = 'transform 4.6s cubic-bezier(.12,.72,.15,1)';
  canvas.style.transform = 'rotate(' + totalRotation + 'deg)';
  setTimeout(function(){
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    showResult(chosen);
    logHistory(chosen);
  }, 4700);
}
</script>

<script>
/* Optional: pick a class + student before spinning and the prize can be sent
   straight to that student's profile inventory (reward-items.sql). Works only
   for the signed-in teacher; otherwise the spinner is purely a class display. */
(function(){
  var AUTH = window.CTF_AUTH, CLASSES = [], ROSTER = [], last = null;
  var body = document.getElementById('awardBody');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function note(t){ body.innerHTML = t; }
  function pick(){ var s = document.getElementById('aStudent'); return s && s.value ? ROSTER.filter(function(r){return r.id===s.value;})[0] : null; }
  function syncBtn(){
    var row = document.getElementById('sendRow'), who = pick();
    if (!last || !who){ row.style.display = 'none'; return; }
    row.style.display = 'block';
    var b = document.getElementById('sendBtn'); b.disabled = false; b.textContent = 'SEND TO ' + who.handle.toUpperCase();
    document.getElementById('sendMsg').textContent = last.kind === 'voucher' ? 'Lands in their profile to redeem with you.' : 'Lands in their profile, ready to use.';
  }
  async function loadRoster(id){
    ROSTER = []; var s = document.getElementById('aStudent');
    s.innerHTML = '<option value="">Loading\u2026</option>';
    try { ROSTER = await AUTH.rpc('ctf_t_roster',{p_class:id}) || []; } catch(e){}
    ROSTER.sort(function(a,b){ return String(a.handle).localeCompare(String(b.handle)); });
    s.innerHTML = '<option value="">Whole class (display only)</option>' + ROSTER.map(function(r){ return '<option value="'+esc(r.id)+'">'+esc(r.handle)+'</option>'; }).join('');
    syncBtn();
  }
  async function boot(){
    if (!AUTH || !AUTH.online){ note('Connect the class backend to send prizes to student profiles.'); return; }
    try { CLASSES = await AUTH.rpc('ctf_t_classes') || []; }
    catch(e){ note('Sign in on the <a href="teacher.html" style="color:var(--accent)">teacher dashboard</a> to send prizes to student profiles.'); return; }
    document.body.removeAttribute('data-lock');
    if (!CLASSES.length){ note('No classes yet.'); return; }
    body.innerHTML = '<select id="aClass">' + CLASSES.map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join('') + '</select>' +
      '<select id="aStudent"></select>' +
      '<div style="font-size:11px;color:var(--faint);line-height:1.5;">Pick a student and the prize goes straight to their profile when the wheel stops.</div>';
    var c = document.getElementById('aClass');
    try { var k = localStorage.getItem('spinner-class'); if (k && CLASSES.some(function(x){return x.id===k;})) c.value = k; } catch(e){}
    c.onchange = function(){ try { localStorage.setItem('spinner-class', c.value); } catch(e){} loadRoster(c.value); };
    document.getElementById('aStudent').onchange = syncBtn;
    loadRoster(c.value);
  }
  window.__awardReady = function(r){ last = r; syncBtn(); if (pick()) window.sendPrize(); };
  window.sendPrize = async function(){
    var who = pick(); if (!last || !who) return;
    var b = document.getElementById('sendBtn'), m = document.getElementById('sendMsg');
    b.disabled = true; b.textContent = 'SENDING\u2026';
    try {
      await AUTH.rpc('ctf_t_send_items',{ p_students:[who.id], p_kind:last.kind, p_label: last.kind === 'voucher' ? last.label : null, p_note:null, p_source:'spinner' });
      b.textContent = '\u2713 SENT TO ' + who.handle.toUpperCase(); m.textContent = 'Check the item log on the Send Rewards tab.'; last = null;
    } catch(e){
      b.disabled = false; b.textContent = 'TRY AGAIN';
      m.textContent = /send_items|function/.test((e&&e.message)||'') ? 'Run supabase/reward-items.sql first.' : 'Couldn\u2019t send: ' + ((e&&e.message)||e);
    }
  };
  boot();
})();
</script>
