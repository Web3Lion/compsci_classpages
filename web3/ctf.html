<style>

:root{--bg:#100e0b;--panel:#191510;--panel2:#1f1a13;--panel3:#26201a;--border:#3a3124;--border2:#2a231b;--border3:#4d3f2e;--border-hi:#6f5c42;--amber-bd:#6a4d20;--amber-bg:#241a0c;--text:#e6ddd0;--bright:#fff8ee;--muted:#c1b4a1;--dim:#93846f;--faint:#655849;--fainter:#40382d;--accent:#f7931a;--accent2:#ffb454;--amber:#f7931a;--via:rgba(247,147,26,.10);--trace:rgba(247,147,26,.035);}
:root[data-theme="light"]{--bg:#f5f1ea;--panel:#ffffff;--panel2:#faf6f0;--panel3:#f5efe6;--border:#e2d8ca;--border2:#ece4d8;--border3:#c6b8a3;--border-hi:#8f7d64;--amber-bd:#d3ba7a;--amber-bg:#f8f0d6;--text:#2f2a22;--bright:#1a140c;--muted:#5c5244;--dim:#7a6e5b;--faint:#9a8c77;--fainter:#bcb09b;--accent:#c56b0c;--accent2:#9a5408;--amber:#b0710f;--via:rgba(197,107,12,.16);--trace:rgba(197,107,12,.05);}
body,.card,.tab,.chip,.m-item,.q-opt,.btn{transition:background-color .25s ease,border-color .25s ease,color .25s ease;}
.themebtn{position:fixed;top:14px;right:14px;z-index:10000;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;padding:8px 14px;border-radius:999px;border:1px solid var(--border3);background:var(--panel);color:var(--accent);cursor:pointer;}
.themebtn:hover{border-color:var(--accent);}
.qlink{transition:transform .08s ease,border-color .15s ease,box-shadow .15s ease;text-decoration:none;}
.qlink:hover{border-color:var(--accent);box-shadow:0 6px 18px -12px var(--accent);}
.qlink:active{transform:translateY(2px) scale(.992);border-color:var(--accent);box-shadow:inset 0 2px 6px -2px var(--accent);}

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent2); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(220%); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
  .card { border: 1px solid var(--border); border-radius: 14px; background: var(--panel); padding: 28px; }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 14px; border-radius: 999px; }
  .mcard { padding: 18px; background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-top: 28px; }
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .mgrid { grid-template-columns: 1fr; } }
  .row { display: grid; grid-template-columns: 84px 1fr 150px; align-items: start; gap: 14px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; }
  .spin { width: 20px; height: 20px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
  @keyframes glShake {0%,100%{transform:translate(0)}10%{transform:translate(-4px,2px)}20%{transform:translate(4px,-2px)}30%{transform:translate(-3px,-1px) skewX(3deg)}40%{transform:translate(3px,1px) skewX(-3deg)}50%{transform:translate(-2px,2px)}60%{transform:translate(2px,-2px)}70%{transform:translate(-3px,1px) skewX(2deg)}80%{transform:translate(3px,-1px)}90%{transform:translate(-1px,1px)}}
  .glitching { animation: glShake .45s steps(3) 2; }
  /* PERF — the arena renders every challenge card up front (100+ on some
     courses), which is a lot of layout and paint for a school Chromebook.
     content-visibility lets the browser skip offscreen cards entirely; the
     contain-intrinsic-size keeps the scrollbar honest so scroll position
     doesn't jump as cards come into view. Cards stay in the DOM, so search,
     anchors, and the existing render logic are untouched. */
  .ctfCard, .bossCard { content-visibility: auto; contain-intrinsic-size: auto 260px; }
  .ctfLocked { contain-intrinsic-size: auto 200px; }
  @media print { .ctfCard, .bossCard { content-visibility: visible; } }
  @media (max-width: 640px) {
    .wrap { padding-left: 14px; padding-right: 14px; }
    .card { padding: 18px; }
    .row { grid-template-columns: 1fr; gap: 8px; }
    .ctfCard, .bossCard { padding: 16px; }
    .bossCard > div { flex-direction: column; align-items: flex-start !important; }
    .bossEnter { width: 100%; }
    .bChoices, .smGrid { grid-template-columns: 1fr !important; }
    input, textarea, select, button { font-size: 16px; }
    /* components added after this block was first written */
    #ctfIdentity { gap: 8px; }
    #ctfIdentity a, #ctfIdentity button { flex: none; }
    .ctfCryptoText { font-size: 11.5px !important; line-height: 1.7 !important; }
    .ctfLocked { padding: 14px !important; }
    /* the gate is the first thing a phone user sees — keep it thumb-friendly */
    #ctfGate { padding: 14px !important; align-items: flex-start !important; }
    #ctfGate > div:last-child { margin-top: 6vh; padding: 22px !important; }
    #nemArrive { padding: 16px !important; }
    #arSkip { top: 10px !important; right: 10px !important; }
  }
  @media (max-width: 380px) {
    .wrap { padding-left: 10px; padding-right: 10px; }
    .card, .ctfCard, .bossCard { padding: 13px; }
  }
  /* mobile pass */
  @media(max-width:720px){
    .wrap{padding-left:12px !important;padding-right:12px !important;}
    .card{padding:14px !important;border-radius:12px;}
    /* every tappable thing clears the 44px minimum */
    button,.btn,a.qlink,input[type=submit]{min-height:44px;}
    input,select,textarea{font-size:16px;}   /* stops iOS zooming the page on focus */
    .themebtn{top:8px;right:8px;padding:7px 11px;font-size:11px;}
    /* challenge rows: let long titles wrap instead of shoving the XP off-screen */
    .chalName{flex-wrap:wrap;gap:8px !important;padding:13px 2px !important;}
    .chalName > span:nth-child(2){flex:1 1 100% !important;order:-1;}
    .modHead{padding:15px 14px !important;gap:9px !important;flex-wrap:wrap;}
    .modHead > span:nth-child(2){flex:1 1 100% !important;font-size:15px !important;}
    .modBody{padding:0 14px 10px !important;}
    .bossCard{padding:14px !important;}
    .bossCard > div{gap:12px !important;}
    table{font-size:12px;}
  }
  @media(max-width:420px){
    .card{padding:12px !important;}
    .big{font-size:30px !important;}
  }
</style>
</head>

<script>(function(){var K='course-theme',r=document.documentElement,b=document.getElementById('themeToggle');function lbl(){if(b)b.textContent=r.getAttribute('data-theme')==='light'?'◐ DARK':'◑ LIGHT';}window.__toggleTheme=function(){var t=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',t);try{localStorage.setItem(K,t);}catch(e){}lbl();};lbl();})();</script>
<style>@keyframes ctfShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  /* --- touch targets: phones and Chromebook touchscreens ---
     A 17px-tall text link is a coin toss with a fingertip. On coarse pointers
     the standalone nav/action links get a 44px hit box without changing how

  @media (pointer:coarse){
    .themebtn{min-height:44px;display:inline-flex;align-items:center;}
    a.taplink,a.qlink,#ctfIdentity a,.backlink,
    .wrap > a[href$="index.html"],.wrap > a[href^="index"]{
      display:inline-flex;align-items:center;min-height:44px;

    table{font-size:12px;}

</style>
